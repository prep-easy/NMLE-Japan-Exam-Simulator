<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>国試シミュレーター</title>
<style>
/* layout: start screen, one-question-at-a-time test view with navigator, results with review */
:root{--paper:#FBF8F3;--card:#fff;--ink:#2A2523;--mute:#6E655F;--line:#E4DBD0;--brand:#B3202E;--tint:#FBE9EB;--ok:#2E8B57;--okt:#E3F4EA;--ng:#C23B3B;--ngt:#FBE6E6;--warn:#B8740A;--wt:#FDF0D5;--f:"Yu Gothic","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1C1917;--card:#27221F;--ink:#F1EBE4;--mute:#B2A89F;--line:#3A332F;--brand:#F08A94;--tint:#3A2427;--ok:#6CCB95;--okt:#1D3327;--ng:#F28B8B;--ngt:#3C2323;--warn:#F0B95A;--wt:#3A2F17;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1C1917;--card:#27221F;--ink:#F1EBE4;--mute:#B2A89F;--line:#3A332F;--brand:#F08A94;--tint:#3A2427;--ok:#6CCB95;--okt:#1D3327;--ng:#F28B8B;--ngt:#3C2323;--warn:#F0B95A;--wt:#3A2F17;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--paper);color:var(--ink);font:400 16px/1.75 var(--f)}
button{font:700 14px var(--f);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer}
button.pri{background:var(--brand);border-color:var(--brand);color:#fff}:root[data-theme="dark"] button.pri{color:#1C1917}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#1C1917}}
button:disabled{opacity:.45;cursor:default}.opt:disabled{opacity:1}:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 4px;color:var(--brand)}h2{font-size:18px;margin:22px 0 8px}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;flex-wrap:wrap}.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;background:var(--card)}
.seg input{accent-color:var(--brand)}.seg label:has(input:checked){border-color:var(--brand);background:var(--tint)}
.top{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);z-index:4}
.top .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px}
.bar{flex:1;min-width:120px;height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);width:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--tint);color:var(--brand);margin-right:6px}
.stem{font-size:17px;font-weight:500;margin:8px 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-weight:400;font-size:16px;line-height:1.6}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--brand);display:grid;place-items:center;font-size:14px}
.opt.sel{border-color:var(--brand);background:var(--tint)}.opt.sel b{background:var(--brand);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okt)}.opt.right b{background:var(--ok);color:#fff}.opt.wrong{border-color:var(--ng);background:var(--ngt)}.opt.wrong b{background:var(--ng);color:#fff}
.why{font-size:14px;color:var(--mute);margin:-2px 0 6px 40px}
.exp{background:var(--okt);border-radius:12px;padding:12px 14px;margin:12px 0;font-size:15px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px}
.grid button{padding:6px 0;font-size:13px;border-radius:8px}.grid .ans{background:var(--tint);border-color:var(--brand)}.grid .cur{outline:3px solid var(--brand)}.grid .flg{border-color:var(--warn);background:var(--wt)}
.grid .r{background:var(--okt);border-color:var(--ok)}.grid .w{background:var(--ngt);border-color:var(--ng)}
.big{font-size:40px;font-weight:900;line-height:1.1}.pass{color:var(--ok)}.fail{color:var(--ng)}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.kinshi{display:inline-block;background:var(--ngt);color:var(--ng);font-weight:700;font-size:12px;padding:1px 8px;border-radius:999px;margin-left:6px}
.flag{border:1.5px solid var(--warn);background:var(--wt)}
.hide{display:none}
@media (max-width:480px){body{font-size:15px}.stem{font-size:16px}}
</style></head><body>
<div id="app"></div>
<script>
const Q=[{"n":1,"b":"必修","t":"一般","th":"現役並み所得者の自己負担","s":"70歳から74歳の現役並み所得者が、医療機関の窓口で支払う自己負担の割合はどれか。","o":["3割","1割","2割","4割","5割"],"a":0,"e":"70歳から74歳でも、現役並み所得者の自己負担は3割です。","w":["","1割は、75歳以上の原則の割合です。","2割は、70歳から74歳の原則の割合です。","4割という区分はありません。","5割という区分はありません。"],"k":-1,"p":1},{"n":2,"b":"必修","t":"一般","th":"高額療養費の上限額","s":"高額療養費の自己負担の上限額を決める要素の組合せはどれか。","o":["性別と職業","年齢と所得","居住地と家族数","病名と入院日数","診療科と受診回数"],"a":1,"e":"上限額は、年齢と所得で決まります。","w":["性別と職業では、上限額は決まりません。","","居住地と家族数では、上限額は決まりません。","病名と入院日数では、上限額は決まりません。","診療科と受診回数では、上限額は決まりません。"],"k":-1,"p":1},{"n":3,"b":"必修","t":"一般","th":"療養の給付の帳簿の保存期間","s":"保険医療機関及び保険医療養担当規則で、療養の給付の担当に関する帳簿や書類の保存期間として定められているのはどれか。","o":["2年","5年","3年","10年","20年"],"a":2,"e":"療養の給付の担当に関する帳簿や書類は、3年間保存します。","w":["2年は、病院日誌や手術記録などの保存期間です。","5年は、診療録の保存期間です。","","10年と定められた保存期間ではありません。","20年は、特定生物由来製品の使用の記録の保存期間です。"],"k":-1,"p":1},{"n":4,"b":"必修","t":"一般","th":"特定生物由来製品の記録","s":"特定生物由来製品（血液製剤など）の使用の記録の保存期間はどれか。","o":["2年","3年","5年","20年","10年"],"a":3,"e":"特定生物由来製品の使用の記録は、医薬品医療機器等法に基づき、20年間保存します。","w":["2年は、病院日誌や手術記録などの保存期間です。","3年は、療養の給付に関する帳簿や書類の保存期間です。","5年は、診療録の保存期間です。","","10年と定められた保存期間ではありません。"],"k":-1,"p":1},{"n":5,"b":"必修","t":"一般","th":"第1号被保険者","s":"介護保険の第1号被保険者はどれか。","o":["40歳から64歳の医療保険加入者","20歳以上の人","75歳以上の人","60歳以上の人","65歳以上の人"],"a":4,"e":"第1号被保険者は65歳以上で、原因を問わず、要介護または要支援と認定されればサービスを受けられます。","w":["40歳から64歳の医療保険加入者は、第2号被保険者です。","20歳以上という区分ではありません。","75歳以上という区分ではありません。","60歳以上という区分ではありません。",""],"k":-1,"p":1},{"n":6,"b":"必修","t":"一般","th":"特定疾病の数","s":"介護保険の第2号被保険者が、サービスを受けられる原因となる特定疾病は何種類か。","o":["16種類","8種類","10種類","20種類","32種類"],"a":0,"e":"第2号被保険者は、16種類の特定疾病が原因で要介護または要支援と認定された場合に、サービスを受けられます。","w":["","8種類ではありません。","10種類ではありません。","20種類ではありません。","32種類ではありません。"],"k":-1,"p":1},{"n":7,"b":"必修","t":"一般","th":"無呼吸テスト","s":"法的脳死判定の判定項目に含まれるのはどれか。","o":["深部腱反射の消失の確認","自発呼吸の消失を確認する無呼吸テスト","筋緊張の消失の確認","瞳孔径が2mm以下の縮瞳の確認","体温が35度以下の低体温の確認"],"a":1,"e":"判定項目は、深昏睡、瞳孔の散大と固定、脳幹反射の消失、平坦脳波、自発呼吸の消失（無呼吸テスト）です。","w":["深部腱反射の消失は、判定項目に含まれません。","","筋緊張の消失は、判定項目に含まれません。","瞳孔は、縮瞳ではなく、散大と固定を確認します。","低体温は、脳死判定の対象外になる例です。"],"k":-1,"p":1},{"n":8,"b":"必修","t":"一般","th":"標準予防策の考え方","s":"標準予防策（スタンダード・プリコーション）の考え方として正しいのはどれか。","o":["感染症と診断された患者の血液や体液だけを、感染性のあるものとして扱う","手袋を着用すれば、手指衛生は行わなくてよい","感染症の診断の有無にかかわらず、血液や体液を感染性のあるものとして扱う","薬剤耐性菌の患者にだけ、適用する対策である","入院が長い患者にだけ、適用する対策である"],"a":2,"e":"標準予防策では、血液、体液、分泌物、排泄物を、診断の有無にかかわらず、感染性のあるものとして扱います。","w":["診断のついた患者だけを対象にする考え方ではありません。","手袋を着用しても、手指衛生は必要です。","","薬剤耐性菌の患者に限らず、すべての患者に適用します。","入院期間に関係なく、すべての患者に適用します。"],"k":-1,"p":1},{"n":9,"b":"必修","t":"一般","th":"医療事故調査制度の目的","s":"医療事故調査制度の目的として正しいのはどれか。","o":["医療者の過失を判断し、責任を追及する","診療報酬の請求が適正かを審査する","患者への補償金の額を決定する","予期しなかった死亡の原因を調べ、再発を防ぐ","医師の免許の処分を決定する"],"a":3,"e":"この制度は、予期しなかった死亡の原因を調べ、再発を防ぐための制度で、責任を追及する制度ではありません。","w":["責任の追及は、この制度の目的ではありません。","診療報酬の審査は、この制度の目的ではありません。","補償金の決定は、この制度の目的ではありません。","","免許の処分は、この制度の目的ではありません。"],"k":-1,"p":1},{"n":10,"b":"必修","t":"一般","th":"院内調査の支援","s":"医療事故調査制度の院内調査で、病院などの管理者が支援を受けることができるのはどれか。","o":["所轄の警察署","厚生労働大臣","地域の保健所","検察庁","都道府県医師会などの支援団体"],"a":4,"e":"院内調査では、都道府県医師会などの支援団体の支援を受けることができます。","w":["警察署は、院内調査の支援を行う機関ではありません。","厚生労働大臣が、院内調査を直接支援するわけではありません。","保健所は、院内調査の支援を行う機関ではありません。","検察庁は、院内調査の支援を行う機関ではありません。",""],"k":-1,"p":1},{"n":11,"b":"必修","t":"一般","th":"診療録の保存者","s":"病院に勤める医師が記載した診療録を、保存する責任があるのはどれか。","o":["病院の管理者","診療録を記載した医師","患者本人","都道府県知事","市町村長"],"a":0,"e":"病院や診療所に勤める医師の診療録は、管理者が保存します。","w":["","記載した医師個人が、保存する責任を負うのではありません。","患者本人が、診療録を保存するのではありません。","都道府県知事が、診療録を保存するのではありません。","市町村長が、診療録を保存するのではありません。"],"k":-1,"p":1},{"n":12,"b":"必修","t":"一般","th":"医学略語のRR","s":"医学略語のRRが表すのはどれか。","o":["心拍数","血圧","体温","心肺蘇生","呼吸数"],"a":4,"e":"RRは、respiratory rate（呼吸数）の略語です。","w":["心拍数は、HRです。","血圧は、BPです。","体温は、BTです。","心肺蘇生は、CPRです。",""],"k":-1,"p":1},{"n":13,"b":"必修","t":"一般","th":"脳死判定の前提条件","s":"法的脳死判定の前提条件に含まれるのはどれか。","o":["発症から1か月以上が、経過している","低体温の状態が、確認されている","原因疾患が、確実に診断されている","自発呼吸が、保たれている","全身麻酔の影響が、続いている"],"a":2,"e":"前提条件は、器質的脳障害による深昏睡と自発呼吸の消失、原因疾患の確実な診断、回復の可能性がないことです。","w":["発症からの期間は、前提条件ではありません。","低体温は、脳死判定の対象外になる例です。","","前提条件では、自発呼吸が消失しています。","麻酔の影響が続く状態は、判定の対象になりません。"],"k":-1,"p":1},{"n":14,"b":"必修","t":"一般","th":"アクシデントの定義","s":"アクシデントの説明として正しいのはどれか。","o":["患者に害が及ぶ前に気づいた出来事","医師の過失が確定した出来事","訴訟に発展した出来事","患者に害が及んだ出来事","患者が死亡した出来事"],"a":3,"e":"アクシデントは、患者に害が及んだ出来事です。","w":["害が及ぶ前に気づいた出来事は、インシデント（ヒヤリ・ハット）です。","過失が確定していなくても、害が及べばアクシデントです。","訴訟になったかどうかは、分類の基準ではありません。","","死亡に至らなくても、害が及べばアクシデントです。"],"k":-1,"p":1},{"n":15,"b":"必修","t":"一般","th":"対象となる死亡","s":"医療事故調査制度の対象となる死亡について、正しいのはどれか。","o":["医療に起因し、過誤があったものに限る","医療に起因し、管理者が予期しなかったもので、過誤の有無は問わない","医師が過失を認めたものに限る","遺族が申し出たものに限る","手術中に起こったものに限る"],"a":1,"e":"対象は、医療に起因し、または疑われる死亡で、管理者が予期しなかったものです。過誤の有無は問いません。","w":["過誤があったものに限る制度ではありません。","","医師が過失を認めたものに限る制度ではありません。","遺族の申し出がなくても、対象になります。","手術中の死亡に限る制度ではありません。"],"k":-1,"p":1},{"n":16,"b":"必修","t":"臨床","th":"70歳以上の自己負担","s":"76歳の男性。外来で診察を受けた。現役並み所得者でも、一定以上の所得がある人でもない。窓口で支払う自己負担の割合はどれか。","o":["2割","3割","1割","4割","0割"],"a":2,"e":"75歳以上の自己負担は原則1割です。現役並み所得者は3割、一定以上の所得がある人は2割です。","w":["2割は、一定以上の所得がある人の割合です。","3割は、現役並み所得者の割合です。","","4割という区分はありません。","75歳以上でも、窓口で負担のない人はいません。"],"k":-1,"p":3},{"n":17,"b":"必修","t":"臨床","th":"異状のある死体の届出","s":"42歳の男性。高所から転落して搬送され、到着時にすでに死亡していた。診察した医師は、外因による死亡を疑い、死体に異状があると認めた。医師の対応として正しいのはどれか。","o":["1週間以内に、保健所へ届け出る","24時間以内に、所轄の警察署へ届け出る","死亡診断書を交付すれば、届け出は不要である","遺族が希望した場合にだけ、警察署へ届け出る","死因が確定するまで、届け出を待つ"],"a":1,"e":"死体を検案して異状があると認めたときは、医師法第21条により、24時間以内に所轄の警察署へ届け出ます。","w":["届け出の先は保健所ではなく、期限は24時間以内です。","","書類を交付しても、異状があれば届け出は必要です。","遺族の希望に関係なく、届け出は医師の義務です。","死因の確定を待たずに、24時間以内に届け出ます。"],"k":-1,"p":3},{"n":18,"b":"必修","t":"臨床","th":"小児の脳死判定","s":"5歳の男児。溺水による重い脳障害で、法的脳死判定の第1回を終えた。第2回の判定は、第1回の終了後、何時間以上あけて行うか。","o":["6時間以上","12時間以上","48時間以上","72時間以上","24時間以上"],"a":4,"e":"法的脳死判定の第2回は、6歳以上では6時間以上、6歳未満では24時間以上あけて行います。","w":["6時間以上は、6歳以上の場合の間隔です。","12時間以上という間隔は、定められていません。","48時間以上という間隔は、定められていません。","72時間以上という間隔は、定められていません。",""],"k":-1,"p":3},{"n":19,"b":"必修","t":"臨床","th":"特定疾病と介護保険","s":"52歳の男性。若年で発症した認知症と診断され、特定疾病に当てはまる。日常生活に介助が必要になった。介護保険のサービスについて、正しいのはどれか。","o":["第2号被保険者として、要介護の認定を受ければ、利用できる","65歳になるまで、介護保険のサービスは利用できない","第1号被保険者として、保険料を納める","原因にかかわらず、認定を受ければ、利用できる","介護保険ではなく、医療保険だけで介護を受ける"],"a":0,"e":"40歳から64歳の第2号被保険者は、特定疾病が原因で要介護または要支援と認定されれば、サービスを受けられます。","w":["","特定疾病が原因なら、65歳未満でも利用できます。","65歳以上の人が、第1号被保険者です。","原因を問わないのは、第1号被保険者です。","介護サービスは、介護保険で受けます。"],"k":-1,"p":3},{"n":20,"b":"必修","t":"臨床","th":"法律に基づく情報の提供","s":"30歳の男性。咳が続いて受診し、結核と診断された。患者は、病名を誰にも知られたくないと話している。医師の対応として正しいのはどれか。","o":["同意が得られるまで、届け出を行わない","守秘義務があるため、届け出を一切行わない","職場に、病名を直接連絡する","法律に基づき、患者の同意がなくても、保健所に届け出る","家族全員に、病名を伝える"],"a":3,"e":"法律に基づく感染症の届け出は、守秘義務の例外で、本人の同意がなくても行えます。","w":["法律に基づく届け出は、同意を待たずに行います。","守秘義務は、法律の定めがあれば、例外になります。","職場への連絡は、本人の同意がなければできません。","","家族への伝達も、本人の同意がなければできません。"],"k":-1,"p":3},{"n":21,"b":"必修","t":"臨床","th":"意思を推定する人","s":"86歳の女性。誤嚥性肺炎で入院中に、意識が低下し、意思を伝えられなくなった。以前に、本人が意思を推定する人として、長女を決めていた。医療・ケアチームの対応として最も適切なのはどれか。","o":["本人の意思が確認できないため、医師が単独で、方針を決める","家族の中で最年長の者の希望だけに、従う","意思を伝えられるまで、治療を一切行わない","話し合いは行わず、延命治療を最大限に行う","長女と話し合い、本人が望むであろう意思を確認して、方針を決める"],"a":4,"e":"本人が意思を伝えられないときは、本人が決めておいた意思を推定する人と、医療・ケアチームが話し合います。","w":["医師が単独で決めるのは、適切ではありません。","指定された人と話し合わずに、年長者の希望だけに従うのは適切ではありません。","治療を一切行わない対応は、適切ではありません。","話し合いを行わずに、延命治療を行うのは適切ではありません。",""],"k":-1,"p":3},{"n":22,"b":"必修","t":"臨床","th":"医療事故調査・支援センターの調査","s":"68歳の男性が、手術の翌日に、予期しない経過で死亡した。病院は院内調査を行い、遺族に結果を説明した。遺族は、結果に納得できず、調査を求めている。医療事故調査制度で、行えるのはどれか。","o":["遺族の希望があれば、医療事故調査・支援センターが調査を行う","警察署が、この制度に基づいて調査を行う","管理者の許可がなければ、センターは調査できない","センターは、病院の希望がある場合だけ、調査を行う","都道府県知事が、調査の結果で医師の免許を取り消す"],"a":0,"e":"病院または遺族の希望があれば、医療事故調査・支援センターが調査を行います。","w":["","この制度の調査は、警察署が行うのではありません。","遺族の希望があれば、管理者の許可は必要ありません。","病院だけでなく、遺族の希望でも調査が行えます。","この制度は、免許の処分を目的としません。"],"k":-1,"p":3},{"n":23,"b":"必修","t":"一般","th":"単純型熱性けいれん","s":"単純型熱性けいれんの特徴として、正しいのはどれか。","o":["15分以上続き、体の一部だけに起こる","24時間以内に、2回以上くり返す","発熱がなくても、毎回起こる","全身性で、数分以内に自然におさまる","発作のあとに、長い麻痺を残す"],"a":3,"e":"単純型熱性けいれんは、全身性で、15分以内におさまり、24時間以内にはくり返しません。","w":["単純型では、15分以内におさまり、全身性です。","単純型では、24時間以内には、くり返しません。","熱性けいれんは、発熱に伴って起こります。","","単純型では、発作のあとに、長い麻痺を残しません。"],"k":-1,"p":1},{"n":24,"b":"必修","t":"一般","th":"系統別の症候と原因","s":"系統別の症候と、生命に関わる原因の例の組合せで正しいのはどれか。","o":["呼吸器：糖尿病ケトアシドーシス","消化器：急性心筋梗塞","精神・神経：脳卒中","血液・腎・泌尿器・生殖器：くも膜下出血","内分泌・代謝：肺塞栓症"],"a":2,"e":"精神・神経の症候では、脳卒中や自殺のおそれを、生命に関わる原因として考えます。","w":["糖尿病ケトアシドーシスは、内分泌・代謝の例です。","急性心筋梗塞は、心臓・循環器の例です。","","くも膜下出血は、皮膚・頭頸部の例です。","肺塞栓症は、呼吸器の例です。"],"k":-1,"p":1},{"n":25,"b":"必修","t":"一般","th":"循環器の症候","s":"心臓・循環器の症候に分類されるのはどれか。","o":["黄疸","失神","喘鳴","血尿","下痢"],"a":1,"e":"心臓・循環器の症候は、胸痛、動悸、失神、浮腫、チアノーゼです。","w":["黄疸は、皮膚・頭頸部の症候です。","","喘鳴は、呼吸器の症候です。","血尿は、血液・腎・泌尿器・生殖器の症候です。","下痢は、消化器の症候です。"],"k":-1,"p":1},{"n":26,"b":"必修","t":"一般","th":"失神の前ぶれ","s":"失神の前ぶれとして典型的なのはどれか。","o":["においなどの前兆","立ちくらみや冷や汗、目の前が暗くなる感じ","発作後の長いもうろう状態","強直と間代の動き","舌をかむこと"],"a":1,"e":"失神の前ぶれは、立ちくらみ、冷や汗、目の前が暗くなる感じです。","w":["においなどの前兆は、けいれんでみられることがあります。","","発作後のもうろう状態は、けいれんの特徴です。","強直と間代は、けいれんの動きです。","舌をかむことは、けいれんでみられることがあります。"],"k":-1,"p":1},{"n":27,"b":"必修","t":"一般","th":"けいれんの所見","s":"失神と比べて、けいれんにみられやすい所見はどれか。","o":["舌をかむことがある","力が抜けて倒れる","短時間で自然にすっきり戻る","立ちくらみの前ぶれがある","脳血流の一時的な低下が原因である"],"a":0,"e":"けいれんでは、強直や間代の動きがあり、舌をかむことがあります。","w":["","力が抜けて倒れるのは、失神の特徴です。","短時間ですっきり戻るのは、失神の特徴です。","立ちくらみの前ぶれは、失神の特徴です。","脳血流の一時的な低下は、失神の原因です。"],"k":-1,"p":1},{"n":28,"b":"必修","t":"一般","th":"失神中のけいれん様の動き","s":"失神の際にみられる、短いけいれんのような動きについて正しいのはどれか。","o":["動きがあれば、必ずてんかんである","動きがあれば、失神は否定できる","心臓が原因の失神では、出ない","脳血流が減ると、失神でも出ることがある","起立性低血圧の失神では、出ない"],"a":3,"e":"失神でも、脳血流が減ると、短いけいれんのような動きが出ることがあります。1つの所見だけで決めません。","w":["動きがあっても、必ずてんかんとは限りません。","動きがあっても、失神は否定できません。","心臓が原因の失神でも、出ることがあります。","","起立性低血圧の失神でも、出ることがあります。"],"k":-1,"p":1},{"n":29,"b":"必修","t":"一般","th":"腹痛の緊急度","s":"腹痛で、緊急度が高いサインはどれか。","o":["空腹時にみられる軽い痛み","食後の軽い膨満感","腹膜刺激症状、ショック、吐血・下血","便秘に伴う軽い痛み","軽い圧痛だけの痛み"],"a":2,"e":"腹痛では、腹膜刺激症状、ショック、吐血・下血があれば、緊急度が高いと判断します。","w":["空腹時の軽い痛みだけでは、緊急度は高くありません。","食後の軽い膨満感だけでは、緊急度は高くありません。","","便秘に伴う軽い痛みだけでは、緊急度は高くありません。","軽い圧痛だけでは、緊急度は高くありません。"],"k":-1,"p":1},{"n":30,"b":"必修","t":"一般","th":"頭痛の緊急度","s":"頭痛で、緊急度が高いサインはどれか。","o":["数年来の、慢性的な軽い頭痛","夕方に強くなる、肩こりを伴う頭痛","月に1回程度の、軽い頭痛","朝の洗顔後に治まる、軽い頭痛","突然の激しい頭痛、意識障害、麻痺"],"a":4,"e":"頭痛では、突然の激しい頭痛、意識障害、麻痺があれば、緊急度が高いと判断します。","w":["慢性的な軽い頭痛だけでは、緊急度は高くありません。","肩こりを伴う夕方の頭痛だけでは、緊急度は高くありません。","月に1回程度の軽い頭痛だけでは、緊急度は高くありません。","洗顔後に治まる軽い頭痛だけでは、緊急度は高くありません。",""],"k":-1,"p":1},{"n":31,"b":"必修","t":"臨床","th":"術後の呼吸困難と胸痛","s":"62歳の女性。大腿骨の手術後3日目に、歩き始めた直後から、突然の呼吸困難と胸痛が出現した。SpO2は90%に低下している。生命に関わる原因として、まず考えるのはどれか。","o":["逆流性食道炎","帯状疱疹","肋間神経痛","肺塞栓症","過換気症候群"],"a":3,"e":"手術後の安静のあとに、突然の呼吸困難と胸痛が出れば、まず肺塞栓症を考えます。","w":["逆流性食道炎では、突然のSpO2の低下はみられません。","帯状疱疹では、突然のSpO2の低下はみられません。","肋間神経痛では、SpO2は低下しません。","","過換気症候群では、SpO2は低下しません。"],"k":-1,"p":3},{"n":32,"b":"必修","t":"臨床","th":"発熱と頭痛と項部硬直","s":"19歳の男性。発熱と激しい頭痛があり、仰臥位で頭を前に曲げようとすると抵抗がある。生命に関わる原因として、まず考えるのはどれか。","o":["緊張型頭痛","副鼻腔炎","片頭痛","群発頭痛","髄膜炎"],"a":4,"e":"発熱、頭痛、項部硬直があれば、髄膜炎を考えます。","w":["緊張型頭痛では、発熱と項部硬直はありません。","副鼻腔炎では、項部硬直はありません。","片頭痛では、発熱と項部硬直はありません。","群発頭痛では、発熱と項部硬直はありません。",""],"k":-1,"p":3},{"n":33,"b":"必修","t":"臨床","th":"腸閉塞の症候","s":"70歳の男性。開腹手術の既往がある。腹痛と嘔吐が続き、排便と排ガスがない。腹部が膨隆している。生命に関わる原因として、まず考えるのはどれか。","o":["過敏性腸症候群","逆流性食道炎","腸閉塞","機能性ディスペプシア","便秘症"],"a":2,"e":"手術の既往があり、腹痛、嘔吐、排便と排ガスの停止、腹部膨隆があれば、腸閉塞を考えます。","w":["過敏性腸症候群では、排ガスの停止と嘔吐は続きません。","逆流性食道炎では、排便と排ガスは止まりません。","","機能性ディスペプシアでは、排便と排ガスは止まりません。","便秘症だけでは、嘔吐と腹部膨隆は説明できません。"],"k":-1,"p":3},{"n":34,"b":"必修","t":"臨床","th":"神経調節性失神","s":"16歳の女子。朝礼で長時間立っていたところ、気分が悪くなり、冷や汗をかいて倒れた。数十秒で意識が戻り、その後は普段どおりである。この失神の機序として最も考えられるのはどれか。","o":["不整脈","神経調節性（血管迷走神経反射）","大動脈弁狭窄症","てんかん発作","低血糖"],"a":1,"e":"長く立ったあとの前ぶれのある短時間の失神は、神経調節性（血管迷走神経反射）を考えます。","w":["不整脈は、前ぶれなく起こることが多く、状況に合いません。","","大動脈弁狭窄症は、労作時の失神が典型です。","てんかん発作では、発作後にもうろう状態が続きます。","低血糖では、意識が短時間で戻ることは多くありません。"],"k":-1,"p":3},{"n":35,"b":"必修","t":"臨床","th":"起立性低血圧","s":"74歳の男性。降圧薬を増量した翌日、トイレから立ち上がった直後に、目の前が暗くなって倒れた。すぐに意識が戻った。最も考えられるのはどれか。","o":["起立性低血圧による失神","てんかん発作","脳出血","肺塞栓症","くも膜下出血"],"a":0,"e":"薬の増量後に、立ち上がった直後に起こり、すぐ回復する失神は、起立性低血圧を考えます。","w":["","てんかん発作では、発作後にもうろう状態が続きます。","脳出血では、意識がすぐに回復することは多くありません。","肺塞栓症では、呼吸困難や胸痛を伴います。","くも膜下出血では、突然の激しい頭痛を伴います。"],"k":-1,"p":3},{"n":36,"b":"必修","t":"臨床","th":"心臓が原因の失神","s":"78歳の男性。階段を上がる途中に、胸痛とともに意識を失った。胸骨右縁で、収縮期雑音を聴取した。この失神で、まず考えるべき原因はどれか。","o":["起立性低血圧","神経調節性失神","大動脈弁狭窄症","過換気症候群","てんかん発作"],"a":2,"e":"労作時の失神と胸痛、収縮期雑音があれば、大動脈弁狭窄症などの心疾患を考えます。","w":["起立性低血圧は、立ち上がった直後に起こります。","神経調節性失神は、労作時の胸痛と雑音を説明できません。","","過換気症候群では、収縮期雑音は聴取しません。","てんかん発作では、収縮期雑音と胸痛は説明できません。"],"k":-1,"p":3},{"n":37,"b":"必修","t":"臨床","th":"血痰の検査","s":"70歳の男性。喫煙歴が長く、2か月続く血痰と体重減少がある。最初に行う検査はどれか。","o":["腹部超音波検査","上部消化管内視鏡","頭部MRI","安静時心電図","胸部X線と胸部CT"],"a":4,"e":"喫煙歴のある高齢者の血痰と体重減少は、肺癌を疑い、胸部X線と胸部CTを行います。","w":["腹部超音波検査は、血痰の原因を調べる最初の検査ではありません。","上部消化管内視鏡は、血痰の原因を調べる最初の検査ではありません。","頭部MRIは、血痰の原因を調べる最初の検査ではありません。","安静時心電図は、血痰の原因を調べる最初の検査ではありません。",""],"k":-1,"p":3},{"n":38,"b":"必修","t":"臨床","th":"JCSの2桁","s":"70歳の男性。呼びかけると開眼するが、すぐに閉眼してしまう。ジャパン・コーマ・スケール（JCS）で、この状態が分類される桁数はどれか。","o":["1桁","3桁","4桁","2桁","5桁"],"a":3,"e":"JCSの2桁は、刺激で覚醒する状態です。呼びかけで開眼する状態が、これにあたります。","w":["1桁は、刺激しなくても覚醒している状態です。","3桁は、刺激しても覚醒しない状態です。","4桁という分類はありません。","","5桁という分類はありません。"],"k":-1,"p":3},{"n":39,"b":"必修","t":"臨床","th":"血痰と体重減少","s":"68歳の男性。喫煙歴が長い。2か月前から血痰があり、5kgの体重減少がある。最初に行う検査として適切なのはどれか。","o":["上部消化管内視鏡検査","胸部X線検査","頭部CT検査","腹部超音波検査","膝関節X線検査"],"a":1,"e":"血痰は呼吸器の症候です。喫煙歴と体重減少があり、悪性腫瘍も考えて、まず胸部X線検査を行います。","w":["上部消化管内視鏡検査は、血痰の原因の検索になりません。","","頭部CT検査は、血痰の原因の検索になりません。","腹部超音波検査は、血痰の原因の検索になりません。","膝関節X線検査は、血痰の原因の検索になりません。"],"k":-1,"p":3},{"n":40,"b":"必修","t":"臨床","th":"異所性妊娠の破裂","s":"29歳の女性。無月経から7週で、突然の激しい下腹部痛が出現した。顔面は蒼白で、血圧は70/40mmHg、脈拍は130回/分である。最初に行う対応として適切なのはどれか。","o":["静脈路を確保し、細胞外液を輸液する","経過をみて、翌日に外来で再診させる","鎮痛薬を内服させて、帰宅させる","子宮収縮薬を投与する","食事をとらせて、安静にさせる"],"a":0,"e":"異所性妊娠の破裂によるショックが疑われます。静脈路の確保と輸液で循環を保ち、産婦人科へ連絡します。","w":["","帰宅させて経過をみると、出血性ショックが進みます。","鎮痛薬だけで帰宅させると、出血性ショックが進みます。","子宮収縮薬は、この病態の対応ではありません。","食事をとらせる対応は、緊急手術の妨げになります。"],"k":-1,"p":3},{"n":41,"b":"必修","t":"臨床","th":"動悸のあとの失神","s":"68歳の男性。動悸を自覚した直後に、意識を失って倒れた。数分で意識は戻った。心不全の症状はない。最初に行う検査として適切なのはどれか。","o":["頭部MRI検査","腹部超音波検査","脳波検査","下肢静脈超音波検査","12誘導心電図検査"],"a":4,"e":"動悸に続く失神では、心臓が原因の不整脈を考え、まず12誘導心電図検査を行います。","w":["頭部MRI検査は、最初に行う検査ではありません。","腹部超音波検査は、失神の原因の検索になりません。","脳波検査は、最初に行う検査ではありません。","下肢静脈超音波検査は、動悸と失神の原因の検索になりません。",""],"k":-1,"p":3},{"n":42,"b":"必修","t":"臨床","th":"職業と生活歴","s":"58歳の男性。数か月続く咳で受診した。長年、建設現場で働いている。病歴で、次に聞く項目として適切なのはどれか。","o":["血液型","配偶者の出身地","最終学歴","職業の内容と、喫煙や飲酒などの生活歴","年収の額"],"a":3,"e":"職業、喫煙、飲酒などの社会歴・生活歴は、咳の原因を考える手がかりになります。","w":["血液型は、咳の原因の手がかりになりません。","配偶者の出身地は、咳の原因の手がかりになりません。","最終学歴は、咳の原因の手がかりになりません。","","年収の額は、咳の原因の手がかりになりません。"],"k":-1,"p":3},{"n":43,"b":"必修","t":"臨床","th":"GCSの合計点","s":"60歳の男性。路上で倒れていて、搬送された。痛み刺激を加えても、開眼せず、発語もなく、四肢の動きもない。グラスゴー・コーマ・スケール（GCS）の合計点はどれか。","o":["0点","1点","3点","5点","15点"],"a":2,"e":"GCSは、開眼、言語反応、運動反応の合計で、最低は3点です。まったく反応がない状態が、3点です。","w":["0点という点数はありません。","1点という合計点は、ありません。","","5点は、反応の一部が残っている場合です。","15点は、意識が清明な場合です。"],"k":-1,"p":3},{"n":44,"b":"必修","t":"一般","th":"MMTの段階1","s":"徒手筋力テスト（MMT）で、筋の収縮はあるが、関節は動かない段階はどれか。","o":["0","1","2","3","5"],"a":1,"e":"MMTの1は、筋の収縮はあるが、関節は動かない状態です。","w":["0は、筋の収縮もない状態です。","","2は、重力を除けば動かせる状態です。","3は、重力に抗して動かせるが、抵抗を加えると動かせない状態です。","5は、強い抵抗を加えても、重力に抗して動かせる正常です。"],"k":-1,"p":1},{"n":45,"b":"必修","t":"一般","th":"腹部の聴診を先に行う理由","s":"腹部の診察で、聴診を打診と触診の前に行う理由はどれか。","o":["触診や打診で腸を刺激すると、腸蠕動音が変わるため","聴診を先に行うと、患者の苦痛が最も大きいため","聴診で、腫瘤の硬さを確かめられるため","聴診は、感染の危険が最も高い手技であるため","聴診は、所要時間が最も長い手技であるため"],"a":0,"e":"触診や打診で腸を刺激すると、腸蠕動音が変わるため、腹部では聴診を先に行います。","w":["","聴診は、患者の苦痛が少ない手技です。","腫瘤の硬さは、聴診ではなく、触診で確かめます。","聴診は、感染の危険が高い手技ではありません。","聴診の所要時間は、順序を決める理由ではありません。"],"k":-1,"p":1},{"n":46,"b":"必修","t":"一般","th":"筋性防御","s":"筋性防御の説明として正しいのはどれか。","o":["ゆっくり押して、急に離すと痛みが強まる","軽くたたくと、痛みが出る","触れると、腹壁の筋が反射的に緊張する","押すと、へこんだ跡が残る","患者が自分で、腹壁に力を入れる"],"a":2,"e":"筋性防御は、触れると腹壁の筋が反射的に緊張する所見で、腹膜の炎症を示します。","w":["急に手を離すと痛む所見は、反跳痛です。","軽くたたくと痛む所見は、打診痛です。","","押してへこんだ跡が残る所見は、浮腫の圧痕です。","患者が自分の意思で力を入れる動きは、筋性防御ではありません。"],"k":-1,"p":1},{"n":47,"b":"必修","t":"一般","th":"肺動脈弁領域","s":"肺動脈弁領域の聴診部位はどれか。","o":["第2肋間、胸骨右縁","第4肋間、胸骨左縁下部","心尖拍動の部位","第5肋間、前腋窩線","第2肋間、胸骨左縁"],"a":4,"e":"肺動脈弁領域は、第2肋間の胸骨左縁です。","w":["第2肋間の胸骨右縁は、大動脈弁領域です。","第4肋間の胸骨左縁下部は、三尖弁領域です。","心尖拍動の部位は、僧帽弁領域です。","第5肋間の前腋窩線は、心音の聴診領域ではありません。",""],"k":-1,"p":1},{"n":48,"b":"必修","t":"一般","th":"神経診察の順序","s":"神経系の診察の順序で、脳神経を診たあとに診るのはどれか。","o":["運動系","感覚系","髄膜刺激症状","小脳と歩行","反射"],"a":0,"e":"神経系の診察は、意識、脳神経、運動系、反射、感覚系、小脳と歩行、髄膜刺激症状の順です。","w":["","感覚系は、反射のあとに診ます。","髄膜刺激症状は、最後に診ます。","小脳と歩行は、感覚系のあとに診ます。","反射は、運動系のあとに診ます。"],"k":-1,"p":1},{"n":49,"b":"必修","t":"一般","th":"脈拍の診察","s":"脈拍の診察で、通常触れる動脈はどれか。","o":["大腿動脈","橈骨動脈","足背動脈","腋窩動脈","椎骨動脈"],"a":1,"e":"脈拍は、通常、橈骨動脈で触れて、回数、リズム、強さを見ます。","w":["大腿動脈は、通常の脈拍測定では触れません。","","足背動脈は、通常の脈拍測定では触れません。","腋窩動脈は、通常の脈拍測定では触れません。","椎骨動脈は、体表から触れる動脈ではありません。"],"k":-1,"p":1},{"n":50,"b":"必修","t":"臨床","th":"血圧の左右差","s":"66歳の男性。突然、背部に抜ける激しい胸痛が出現した。血圧は、右上肢が170/90mmHg、左上肢が120/70mmHgである。まず疑う疾患はどれか。","o":["気胸","肋間神経痛","逆流性食道炎","大動脈解離","帯状疱疹"],"a":3,"e":"背部に抜ける激しい胸痛と血圧の左右差があれば、大動脈解離を疑います。","w":["気胸では、血圧の左右差は目立ちません。","肋間神経痛では、血圧の左右差は出ません。","逆流性食道炎では、血圧の左右差は出ません。","","帯状疱疹では、血圧の左右差は出ません。"],"k":-1,"p":3},{"n":51,"b":"必修","t":"臨床","th":"MMTの評価","s":"70歳の男性。脳梗塞後で、右上肢は重力に抗して持ち上げられないが、重力を除けば動かせる。徒手筋力テスト（MMT）の段階はどれか。","o":["1","3","4","0","2"],"a":4,"e":"重力を除けば動かせる状態は、MMTの2です。","w":["1は、筋の収縮はあるが、関節は動かない状態です。","3は、重力に抗して動かせる状態です。","4は、ある程度の抵抗に抗して動かせる状態です。","0は、筋の収縮もない状態です。",""],"k":-1,"p":3},{"n":52,"b":"必修","t":"臨床","th":"腹部診察の順序","s":"52歳の女性。腹痛で受診した。腹部の診察で、視診を終えた。次に行う診察はどれか。","o":["聴診","打診","触診","直腸診","反跳痛の確認"],"a":0,"e":"腹部の診察は、視診、聴診、打診、触診の順です。視診の次は、聴診です。","w":["","打診は、聴診のあとに行います。","触診は、最後に行います。","直腸診は、通常の腹部診察の順序に含まれません。","反跳痛の確認は、触診で行います。"],"k":-1,"p":3},{"n":53,"b":"必修","t":"臨床","th":"腹部の鼓音","s":"74歳の男性。嘔吐と腹部膨隆がある。腹部を打診すると、全体に鼓音を認める。この所見の意味として考えられるのはどれか。","o":["腹水の貯留","肝臓の腫大","腹壁の筋力の低下","腸管内のガスの貯留","腹腔内の出血"],"a":3,"e":"腹部の鼓音は、腸管内にガスがたまっていることを示します。","w":["腹水がたまると、鼓音ではなく濁音になります。","肝臓の腫大では、その部位が濁音になります。","腹壁の筋力の低下では、鼓音は出ません。","","腹腔内の出血では、鼓音ではなく濁音になります。"],"k":-1,"p":3},{"n":54,"b":"必修","t":"臨床","th":"肺の濁音","s":"72歳の男性。発熱と咳がある。右の下肺野を打診すると、濁音を認める。この所見から考えられるのはどれか。","o":["胸腔内の空気の貯留","肺の過膨張","肺の含気の低下","気道の狭窄","胸壁の筋力の低下"],"a":2,"e":"肺の打診で濁音が出れば、肺炎などによる含気の低下を考えます。","w":["空気がたまると、濁音ではなく鼓音になります。","肺の過膨張では、過共鳴音になります。","","気道の狭窄は、打診ではなく、聴診で笛のような音として現れます。","胸壁の筋力の低下では、濁音は出ません。"],"k":-1,"p":3},{"n":55,"b":"必修","t":"臨床","th":"眼瞼結膜の蒼白","s":"34歳の女性。月経過多が続き、動悸と息切れがある。眼瞼結膜が蒼白である。次に行う検査として適切なのはどれか。","o":["頭部MRI検査","血液検査でヘモグロビン値を測定する","心臓カテーテル検査","脳波検査","膝関節X線検査"],"a":1,"e":"眼瞼結膜の蒼白は貧血を示すため、ヘモグロビン値を測定して評価します。","w":["頭部MRI検査は、貧血の評価になりません。","","心臓カテーテル検査は、貧血の評価になりません。","脳波検査は、貧血の評価になりません。","膝関節X線検査は、貧血の評価になりません。"],"k":-1,"p":3},{"n":56,"b":"必修","t":"臨床","th":"血圧測定のカフ","s":"45歳の男性。肥満があり、上腕が太い。血圧を測定する。カフの選び方として適切なのはどれか。","o":["標準的な幅の狭いカフを、そのまま使う","上腕の幅に合ったカフを使う","カフを使わず、橈骨動脈の拍動だけで測る","カフの中心を、心臓より低い位置に合わせる","カフの幅は、血圧の値に影響しない"],"a":1,"e":"血圧は、上腕の幅に合ったカフを使い、カフの中心を心臓の高さに合わせて測ります。","w":["幅が狭いカフを使うと、血圧が高く出ます。","","カフを使わずに、血圧は測れません。","カフの中心は、心臓の高さに合わせます。","カフの幅は、血圧の値に影響します。"],"k":-1,"p":3},{"n":57,"b":"必修","t":"一般","th":"出生時の体重","s":"新生児の出生時の体重の目安はどれか。","o":["約3,000g","約2,000g","約4,000g","約1,500g","約5,000g"],"a":0,"e":"新生児の出生時の体重は約3,000g、身長は約50cmです。","w":["","約2,000gは、目安より軽い値です。","約4,000gは、目安より重い値です。","約1,500gは、目安より軽い値です。","約5,000gは、目安より重い値です。"],"k":-1,"p":1},{"n":58,"b":"必修","t":"一般","th":"ひとりで座る時期","s":"乳児が、ひとりで座る月齢の目安はどれか。","o":["3から4か月","5から6か月","9から10か月","12から14か月","7か月ごろ"],"a":4,"e":"ひとりで座るのは、7か月ごろが目安です。","w":["3から4か月は、首がすわる時期です。","5から6か月は、寝返りをする時期です。","9から10か月は、つかまり立ちをする時期です。","12から14か月は、ひとりで歩く時期です。",""],"k":-1,"p":1},{"n":59,"b":"必修","t":"一般","th":"空腹時血糖の糖尿病型","s":"空腹時血糖が糖尿病型と判定される値はどれか。","o":["110 mg/dL未満","80 mg/dL未満","100 mg/dL以上","126 mg/dL以上","90 mg/dL以上"],"a":3,"e":"空腹時血糖が126 mg/dL以上であれば、糖尿病型です。","w":["110 mg/dL未満は、正常型です。","80 mg/dL未満は、糖尿病型の基準ではありません。","100 mg/dL以上でも、110 mg/dL未満は正常型です。","","90 mg/dL以上は、糖尿病型の基準ではありません。"],"k":-1,"p":1},{"n":60,"b":"必修","t":"一般","th":"確認検査の性能","s":"確認検査で、特に重視する性能はどれか。","o":["感度","有病率","特異度","検査の所要時間","検査の費用"],"a":2,"e":"確認検査は、特異度を重視し、誤診を減らします。","w":["感度を重視するのは、スクリーニング検査です。","有病率は、検査の性能ではありません。","","所要時間は、確認検査で重視する性能ではありません。","費用は、確認検査で重視する性能ではありません。"],"k":-1,"p":1},{"n":61,"b":"必修","t":"一般","th":"アニオンギャップの基準値","s":"アニオンギャップの基準値の目安はどれか。","o":["約4","約20","約30","約12","約40"],"a":3,"e":"アニオンギャップ（Na − Cl − HCO3）の基準値は、約12です。","w":["約4は、基準値より低い値です。","約20は、基準値より高い値です。","約30は、基準値より高い値です。","","約40は、基準値より高い値です。"],"k":-1,"p":1},{"n":62,"b":"必修","t":"一般","th":"信頼性","s":"同じ条件で測ると、同じ結果が出る性質はどれか。","o":["妥当性","感度","信頼性","特異度","有病率"],"a":2,"e":"信頼性は、同じ条件で測ると、同じ結果が出る性質です。","w":["妥当性は、測りたいものを正しく測れている性質です。","感度は、病気がある人のうち、陽性になる割合です。","","特異度は、病気がない人のうち、陰性になる割合です。","有病率は、集団の中で病気がある人の割合です。"],"k":-1,"p":1},{"n":63,"b":"必修","t":"一般","th":"研究の根拠の強さ","s":"症例対照研究より根拠が強く、ランダム化比較試験より根拠が弱い研究はどれか。","o":["症例報告","メタ分析","専門家の意見","個人の経験談","コホート研究"],"a":4,"e":"根拠は、メタ分析、ランダム化比較試験、コホート研究、症例対照研究、症例報告の順に弱くなります。","w":["症例報告は、症例対照研究より根拠が弱い研究です。","メタ分析は、ランダム化比較試験より根拠が強い研究です。","専門家の意見は、この順序に含まれません。","個人の経験談は、この順序に含まれません。",""],"k":-1,"p":1},{"n":64,"b":"必修","t":"一般","th":"内視鏡検査の合併症","s":"内視鏡検査の合併症として注意するのはどれか。","o":["出血と穿孔","強い磁場による金属の移動","放射線の被ばくによる脱毛","造影剤による腎機能の悪化","超音波による組織の熱傷"],"a":0,"e":"内視鏡検査では、出血や穿孔などの合併症と、鎮静に注意します。","w":["","磁場による金属の移動は、MRI検査の注意点です。","内視鏡検査は、放射線を使いません。","造影剤は、内視鏡検査では通常使いません。","内視鏡検査は、超音波を使う検査ではありません。"],"k":-1,"p":1},{"n":65,"b":"必修","t":"一般","th":"超音波検査の特徴","s":"超音波検査の特徴として正しいのはどれか。","o":["骨や空気の後ろも、よく見える","被ばくがなく、ベッドサイドでできる","被ばくがあり、妊婦には行えない","撮影に長い時間がかかる","ペースメーカがあると、行えない"],"a":1,"e":"超音波検査は、被ばくがなく、ベッドサイドでできます。空気や骨の後ろは見えにくい検査です。","w":["骨や空気の後ろは、見えにくい検査です。","","超音波検査には、被ばくがありません。","超音波検査は、短時間でできます。","ペースメーカに注意が必要なのは、MRI検査です。"],"k":-1,"p":1},{"n":66,"b":"必修","t":"臨床","th":"非溶血性発熱反応","s":"50歳の男性。赤血球製剤の輸血を開始して30分後に、悪寒と38.5℃の発熱が出た。血圧と呼吸は安定し、尿は赤くない。最初に考えるべき副作用はどれか。","o":["急性溶血反応","輸血関連急性肺障害","アナフィラキシー","循環過負荷","非溶血性発熱反応"],"a":4,"e":"悪寒と発熱だけで、血圧や呼吸が保たれていれば、非溶血性発熱反応を考えます。","w":["急性溶血反応では、腰背部痛、血圧低下、赤い尿がみられます。","輸血関連急性肺障害では、強い呼吸困難と肺水腫がみられます。","アナフィラキシーでは、蕁麻疹、喘鳴、血圧低下がみられます。","循環過負荷では、呼吸困難と、頸静脈の怒張がみられます。",""],"k":-1,"p":3},{"n":67,"b":"必修","t":"臨床","th":"乳児の発達の目安","s":"16か月の女児。つかまり立ちはできるが、まだひとり歩きをしない。言語と社会性の発達は良好で、診察で異常はない。対応として適切なのはどれか。","o":["直ちに入院して、精密検査を行う","運動発達の遅れと診断し、治療を始める","個人差を考え、全体の発達をみながら経過をみる","目安の月齢を過ぎたので、異常と判断する","全身麻酔下で、MRI検査を行う"],"a":2,"e":"月齢の目安を過ぎても、すぐに異常とは判断せず、全体の発達をみます。","w":["診察で異常がなければ、直ちに入院する必要はありません。","この所見だけで、診断して治療を始めるのは不適切です。","","目安を過ぎただけで、異常と判断してはいけません。","全身麻酔下のMRI検査は、この段階では不適切です。"],"k":-1,"p":3},{"n":68,"b":"必修","t":"臨床","th":"PICOの比較","s":"65歳の男性。高血圧で通院している。担当医は、新薬Aが従来薬Bより脳卒中を減らすかを調べるため、疑問をPICOで整理した。従来薬Bにあたるのはどれか。","o":["患者（Patient）","比較（Comparison）","介入（Intervention）","結果（Outcome）","適用（Application）"],"a":1,"e":"PICOのCは、比較（Comparison）です。新薬Aと比べる従来薬Bが、これにあたります。","w":["患者は、高血圧の65歳以上の人のことです。","","介入は、新薬Aのことです。","結果は、脳卒中の発症のことです。","適用は、PICOの要素ではありません。"],"k":-1,"p":3},{"n":69,"b":"必修","t":"臨床","th":"感度の計算","s":"62歳の男性。健康診断で、ある検査が陽性であった。この検査は、病気がある40人のうち32人が陽性、8人が陰性で、病気がない110人のうち11人が陽性、99人が陰性という性能であった。この検査の感度はどれか。","o":["80%","74%","90%","93%","20%"],"a":0,"e":"感度は、病気がある人のうち、陽性になる割合です。32÷40で、80%です。","w":["","74%は、陽性的中率（32÷43）です。","90%は、特異度（99÷110）です。","93%は、陰性的中率（99÷107）です。","20%は、病気がある人が陰性になる割合です。"],"k":-1,"p":3},{"n":70,"b":"必修","t":"臨床","th":"絶対リスク減少の計算","s":"58歳の男性。心筋梗塞の再発予防薬を勧められた。臨床試験では、5年間の再発が、対照群で12%、治療群で8%であった。絶対リスク減少はどれか。","o":["8%","12%","20%","4%","33%"],"a":3,"e":"絶対リスク減少は、対照群のリスクから治療群のリスクを引いた値です。12%から8%を引いて、4%です。","w":["8%は、治療群のリスクです。","12%は、対照群のリスクです。","20%は、2つのリスクの和です。","","33%は、相対リスク減少（4÷12）です。"],"k":-1,"p":3},{"n":71,"b":"必修","t":"臨床","th":"相対リスクの計算","s":"50歳の女性。ある薬の臨床試験の結果を読んでいる。発症は、対照群で12%、治療群で3%であった。相対リスクはどれか。","o":["4.0","0.75","0.25","0.09","0.15"],"a":2,"e":"相対リスクは、治療群のリスクを対照群のリスクで割った値です。3÷12で、0.25です。","w":["4.0は、対照群のリスクを治療群のリスクで割った逆の値です。","0.75は、相対リスク減少の値です。","","0.09は、絶対リスク減少の値です。","0.15は、2つのリスクの和です。"],"k":-1,"p":3},{"n":72,"b":"必修","t":"臨床","th":"薬を処方する前の確認","s":"28歳の女性。咽頭炎で受診した。抗菌薬を処方する前に、確認すべき事項はどれか。","o":["血液型","運動の習慣","睡眠の時間","通勤の方法","薬のアレルギー歴と、飲んでいる薬"],"a":4,"e":"薬物療法では、アレルギー歴、相互作用、腎機能と肝機能、妊娠の可能性を確認します。","w":["血液型は、抗菌薬の処方で必須の確認事項ではありません。","運動の習慣は、抗菌薬の処方で必須の確認事項ではありません。","睡眠の時間は、抗菌薬の処方で必須の確認事項ではありません。","通勤の方法は、抗菌薬の処方で必須の確認事項ではありません。",""],"k":-1,"p":3},{"n":73,"b":"必修","t":"一般","th":"小児の胸骨圧迫の深さ","s":"小児の胸骨圧迫の深さの目安はどれか。","o":["胸の厚さの約3分の1","胸の厚さの約2分の1","胸の厚さの約5分の1","約6cm以上","約1cm"],"a":0,"e":"小児と乳児では、胸の厚さの約3分の1の深さで圧迫します。成人は約5cmです。","w":["","2分の1は深すぎて、胸部の損傷を起こします。","5分の1は浅すぎて、十分な血流が得られません。","6cm以上は、成人でも深すぎる値です。","1cmは浅すぎて、圧迫の効果がありません。"],"k":-1,"p":1},{"n":74,"b":"必修","t":"一般","th":"電気ショックの適応","s":"医療従事者が行う二次救命処置で、電気ショックの適応となるリズムの組み合わせとして正しいのはどれか。","o":["心静止と無脈性電気活動","心室細動と無脈性心室頻拍","心室細動と心静止","無脈性心室頻拍と無脈性電気活動","無脈性電気活動と心室細動"],"a":1,"e":"電気ショックの適応は、心室細動と無脈性心室頻拍です。心静止と無脈性電気活動は適応ではありません。","w":["どちらも電気ショックの適応ではありません。","","心静止は、電気ショックの適応ではありません。","無脈性電気活動は、電気ショックの適応ではありません。","無脈性電気活動は、電気ショックの適応ではありません。"],"k":-1,"p":1},{"n":75,"b":"必修","t":"一般","th":"ベックの3徴","s":"心タンポナーデでみられる、ベックの3徴はどれか。","o":["血圧の上昇、頸静脈の怒張、心音の亢進","血圧の低下、頸静脈の虚脱、心音の微弱","血圧の低下、呼吸音の左右差、打診での鼓音","血圧の低下、頸静脈の怒張、心音の微弱","血圧の上昇、頸静脈の虚脱、心音の微弱"],"a":3,"e":"心タンポナーデでは、血圧の低下、頸静脈の怒張、心音の微弱を、ベックの3徴といいます。","w":["血圧は低下し、心音は微弱になります。","頸静脈は、虚脱せずに怒張します。","呼吸音の左右差と鼓音は、緊張性気胸の所見です。","","血圧は低下し、頸静脈は怒張します。"],"k":-1,"p":1},{"n":76,"b":"必修","t":"一般","th":"二次トリアージ","s":"二次トリアージで、生理学的評価とともに行う評価はどれか。","o":["解剖学的評価（PAT）","歩行の可否の確認","病歴の詳細な聴取","検査値による精密な評価","家族への聞き取り"],"a":0,"e":"二次トリアージは、生理学的評価と解剖学的評価（PAT）で、精度を上げる段階です。","w":["","歩行の確認は、START法の一次トリアージで行います。","詳細な病歴の聴取は、二次トリアージの評価に含まれません。","精密な評価は、トリアージの目的ではありません。","家族への聞き取りは、トリアージの評価ではありません。"],"k":-1,"p":1},{"n":77,"b":"必修","t":"一般","th":"小児の心停止","s":"小児の心停止に対する心肺蘇生として、望ましいのはどれか。","o":["胸骨圧迫のみの心肺蘇生","AEDが届くまで、何もしない","脈を確認してから、開始する","人工呼吸を組み合わせた心肺蘇生","成人より速い圧迫のみを行う"],"a":3,"e":"小児の心停止では、人工呼吸を組み合わせた心肺蘇生が望ましいとされています。","w":["小児では、人工呼吸を組み合わせることが望まれます。","AEDの到着を待たず、直ちに蘇生を始めます。","脈の確認に時間をかけず、直ちに圧迫を始めます。","","テンポは、成人と同じ1分間に100から120回です。"],"k":-1,"p":1},{"n":78,"b":"必修","t":"臨床","th":"意識障害の初期対応","s":"68歳の男性。自宅の居間で倒れているところを、家族が発見して救急搬送された。呼びかけへの反応が乏しく、いびき様の呼吸があり、SpO2は82%である。最初に行うべき対応はどれか。","o":["頭部CTを撮影するため、撮影室へ移動する","血液培養を2セット、採取する","気道を確保して、酸素を投与する","家族から、詳しい既往歴を聴取する","瞳孔と麻痺を、詳しく評価する"],"a":2,"e":"気道と呼吸の異常があるため、診断より先に、気道確保と酸素投与で安定化を行います。","w":["不安定な患者を、時間のかかる検査へ移すことは危険です。","血液培養は、気道と呼吸を安定させたあとで行います。","","既往歴の聴取は、安定化のあとで構いません。","意識の評価は、気道と呼吸の安定化のあとに行います。"],"k":0,"p":3},{"n":79,"b":"必修","t":"臨床","th":"出血性ショック","s":"25歳の男性。大腿部をナイフで刺されて搬送された。創から出血が続き、冷汗がある。脈拍は130回/分、血圧は70/40mmHgである。初期対応として適切なのはどれか。","o":["止血より先に、造影CTを撮影する","利尿薬を投与して、血圧を保つ","創の洗浄を十分に行ってから、止血する","経口で水分を摂取させて、様子をみる","圧迫して止血し、静脈路を確保して輸液を行う"],"a":4,"e":"循環血液量減少性ショックでは、出血の制御と、輸液・輸血が初期対応です。","w":["検査より、出血の制御が先です。","利尿薬は、循環血液量を減らします。","止血を後回しにすると、出血が続きます。","出血性ショックでは、経口摂取は行いません。",""],"k":-1,"p":3},{"n":80,"b":"必修","t":"臨床","th":"アドレナリンの成人量","s":"35歳の女性（体重55kg）。造影剤の注射の直後から、全身の蕁麻疹と呼吸困難が出現し、血圧は72/40mmHgとなった。アドレナリンの筋肉内注射の1回量として適切なのはどれか。","o":["0.03から0.05mg","0.3から0.5mg","3から5mg","0.003から0.005mg","30から50mg"],"a":1,"e":"アドレナリンの量の目安は、体重1kgあたり0.01mgで、成人では0.3から0.5mgです。","w":["桁が小さすぎて、効果が不足します。","","桁が大きすぎて、過量になります。","桁が小さすぎて、効果が不足します。","桁が大きすぎて、過量になります。"],"k":-1,"p":3},{"n":81,"b":"必修","t":"臨床","th":"心室細動の対応","s":"58歳の男性。病院内で胸痛を訴えたあと、突然倒れた。反応と脈がなく、モニターで心室細動を認める。胸骨圧迫を行いながら、行うべきことはどれか。","o":["気管挿管が終わるまで、ショックを待つ","アドレナリンだけを投与し、ショックは行わない","リズムが変わるまで、圧迫だけを続ける","心嚢穿刺の準備を、先に行う","除細動器で、電気ショックを行う"],"a":4,"e":"心室細動は、電気ショックの適応です。ショックのあとは、直ちに胸骨圧迫を再開します。","w":["挿管を待たず、速やかにショックを行います。","心室細動では、ショックが最も有効な治療です。","圧迫だけでは、心室細動は止まりません。","心嚢穿刺は、心タンポナーデに行う処置です。",""],"k":-1,"p":3},{"n":82,"b":"必修","t":"臨床","th":"心タンポナーデの治療","s":"30歳の男性。胸部の刺創のために搬送された。血圧は68/40mmHgで、頸静脈の怒張があり、心音は遠くて小さい。呼吸音は両側で保たれている。根本的な対応として適切なのはどれか。","o":["心嚢穿刺または心嚢ドレナージを行う","針で胸腔の脱気を行う","利尿薬を静脈内に投与する","輸液を中止して、経過をみる","冠動脈の血栓溶解療法を行う"],"a":0,"e":"心タンポナーデの治療は、心嚢穿刺または心嚢ドレナージです。","w":["","脱気は、緊張性気胸の治療です。","利尿薬は、前負荷を減らして、ショックを悪化させます。","経過をみるだけでは、ショックが進みます。","血栓溶解療法は、心タンポナーデの治療ではありません。"],"k":-1,"p":3},{"n":83,"b":"必修","t":"臨床","th":"START法で気道確保後に呼吸","s":"災害現場で、歩行できない40歳の女性を一次トリアージした。自発呼吸がなかったが、用手的に気道を確保すると、呼吸が出現した。START法での区分はどれか。","o":["黒（区分0）","黄（区分Ⅱ）","赤（区分Ⅰ）","緑（区分Ⅲ）","判定を保留し、二次トリアージを待つ"],"a":2,"e":"自発呼吸がなくても、気道確保で呼吸が出れば、START法では赤です。","w":["気道確保でも呼吸がない場合が、黒です。","黄は、呼吸と循環が基準内で、簡単な指示に応じる場合です。","","緑は、歩行できる場合です。","一次トリアージは、その場で区分を決めます。"],"k":-1,"p":3},{"n":84,"b":"必修","t":"臨床","th":"START法の循環","s":"災害現場で、歩行できない30歳の男性を一次トリアージした。呼吸数は24回/分で、橈骨動脈は触れず、簡単な指示には応じる。START法での区分はどれか。","o":["黄（区分Ⅱ）","赤（区分Ⅰ）","緑（区分Ⅲ）","黒（区分0）","判定を保留し、再評価を待つ"],"a":1,"e":"橈骨動脈が触れない場合は、循環の異常があるため、START法では赤です。","w":["黄は、呼吸と循環が基準内の場合です。","","緑は、歩行できる場合です。","黒は、気道確保でも呼吸がない場合です。","一次トリアージは、その場で区分を決めます。"],"k":-1,"p":3},{"n":85,"b":"必修","t":"臨床","th":"土で汚れた創","s":"55歳の男性。庭仕事で、土で汚れた釘を足に刺して受診した。創を洗浄した。このあとに検討することはどれか。","o":["B型肝炎の予防","狂犬病のワクチン接種","肺炎球菌ワクチンの接種","破傷風の予防","抗結核薬の予防内服"],"a":3,"e":"破傷風のおそれがある創では、破傷風の予防を検討します。","w":["B型肝炎は、血液の曝露で問題になります。","狂犬病は、動物にかまれた場合の問題です。","肺炎球菌ワクチンは、創の処置と関係がありません。","","結核の予防は、創の処置と関係がありません。"],"k":-1,"p":3},{"n":86,"b":"必修","t":"一般","th":"HbA1cの基準","s":"糖尿病型と判定するHbA1cの値はどれか。","o":["5.6%以上","6.0%以上","6.5%以上","7.5%以上","8.4%以上"],"a":2,"e":"糖尿病の診断では、HbA1c 6.5%以上を、糖尿病型と判定します。","w":["5.6%は、糖尿病型の基準に届きません。","6.0%は、糖尿病型の基準に届きません。","","7.5%は、判定の基準の値ではありません。","8.4%は、判定の基準の値ではありません。"],"k":-1,"p":1},{"n":87,"b":"必修","t":"一般","th":"血栓溶解療法の時間","s":"脳梗塞で、血栓溶解療法を検討する、発症からの時間の目安はどれか。","o":["発症1時間以内","発症4.5時間以内","発症12時間以内","発症24時間以内","発症72時間以内"],"a":1,"e":"脳梗塞では、発症4.5時間以内であれば、血栓溶解療法を検討します。","w":["1時間以内に限る基準ではありません。","","12時間では、時間が長すぎます。","24時間では、時間が長すぎます。","72時間では、時間が長すぎます。"],"k":-1,"p":1},{"n":88,"b":"必修","t":"一般","th":"ライフコースアプローチ","s":"健康日本21（第三次）で、子ども、高齢者、女性など、人生の各段階に応じた対策を行う考え方はどれか。","o":["ハイリスクアプローチ","ポピュレーションアプローチ","ヘルスプロモーション","プライマリ・ヘルス・ケア","ライフコースアプローチ"],"a":4,"e":"ライフコースアプローチを踏まえた健康づくりは、健康日本21（第三次）の基本的な方向の1つです。","w":["ハイリスクアプローチは、高リスクの人に絞る方法です。","ポピュレーションアプローチは、集団全体に働きかける方法です。","ヘルスプロモーションは、健康を管理できるようにする過程です。","プライマリ・ヘルス・ケアは、住民に身近な基本的な保健医療です。",""],"k":-1,"p":1},{"n":89,"b":"必修","t":"一般","th":"川崎病の主要症状","s":"川崎病の主要症状に含まれないのはどれか。","o":["高度の黄疸","両側の眼球結膜の充血","口唇・口腔の所見","不定形の発疹","四肢末端の変化"],"a":0,"e":"川崎病の主要症状は、眼球結膜の充血、口唇・口腔の所見、不定形の発疹、四肢末端の変化、頸部のリンパ節の腫れです。","w":["","両側の眼球結膜の充血は、主要症状です。","口唇・口腔の所見は、主要症状です。","不定形の発疹は、主要症状です。","四肢末端の変化は、主要症状です。"],"k":-1,"p":1},{"n":90,"b":"必修","t":"一般","th":"メタボリックシンドロームの血糖","s":"日本のメタボリックシンドロームの診断基準で、血糖の基準はどれか。","o":["空腹時血糖100mg/dL以上","空腹時血糖126mg/dL以上","随時血糖200mg/dL以上","空腹時血糖110mg/dL以上","空腹時血糖140mg/dL以上"],"a":3,"e":"メタボリックシンドロームの血糖の基準は、空腹時血糖110mg/dL以上です。","w":["100mg/dLは、基準より低い値です。","126mg/dLは、糖尿病型の基準です。","随時血糖200mg/dLは、糖尿病型の基準です。","","140mg/dLは、基準とは異なる値です。"],"k":-1,"p":1},{"n":91,"b":"必修","t":"一般","th":"純アルコール量の計算","s":"ビール（アルコール度数5%）350mLに含まれる純アルコール量はどれか。","o":["14g","7g","17.5g","20g","28g"],"a":0,"e":"純アルコール量は、飲酒量×アルコール度数×0.8で計算します。350×0.05×0.8で、14gです。","w":["","7gは、計算の値の半分です。","17.5gは、0.8を掛けていない誤りです。","20gは、500mLの量の値です。","28gは、計算の値の2倍です。"],"k":-1,"p":1},{"n":92,"b":"必修","t":"一般","th":"心筋梗塞の胸痛","s":"急性心筋梗塞の胸痛の特徴として、正しいのはどれか。","o":["数秒で消え、深呼吸で強くなる","安静で、1分以内に消える","体位を変えるたびに、消える","20分以上続き、冷や汗を伴う","食後にだけ、短時間みられる"],"a":3,"e":"急性心筋梗塞では、胸痛が20分以上続き、冷や汗を伴うことが特徴です。","w":["数秒で消える痛みは、心筋梗塞の特徴ではありません。","安静で速やかに消える痛みは、心筋梗塞の特徴ではありません。","体位で消える痛みは、心筋梗塞の特徴ではありません。","","食後だけの短い痛みは、心筋梗塞の特徴ではありません。"],"k":-1,"p":1},{"n":93,"b":"必修","t":"臨床","th":"熱性けいれんの対応","s":"2歳の男児。発熱の翌日に全身のけいれんが起こり、救急外来に搬入された。到着時も、けいれんが続いている。対応として適切なのはどれか。","o":["舌を噛まないよう、口の中にタオルを入れる","解熱薬だけを投与して、けいれんの停止を待つ","診察の前に、頭部CTを撮影する","原因を調べず、すぐに帰宅させる","側臥位にして気道を確保し、酸素を投与する"],"a":4,"e":"けいれん中は、気道の確保と酸素投与を行い、原因の除外を進めます。","w":["口に物を入れると、窒息や気道の損傷を起こします。","解熱薬では、けいれんは止まりません。","けいれん中の移動と検査は、気道の管理より後です。","髄膜炎などの原因の除外が必要です。",""],"k":0,"p":3},{"n":94,"b":"必修","t":"臨床","th":"糖尿病型の判定","s":"48歳の男性。健診で糖尿病を疑われ、再検査を受けた。次の検査値のうち、糖尿病型と判定されるのはどれか。","o":["空腹時血糖が118mg/dL","75g経口ブドウ糖負荷試験の2時間値が210mg/dL","随時血糖が180mg/dL","HbA1cが6.2%","75g経口ブドウ糖負荷試験の2時間値が160mg/dL"],"a":1,"e":"75g経口ブドウ糖負荷試験の2時間値が200mg/dL以上であれば、糖尿病型です。","w":["空腹時血糖は、126mg/dL以上が糖尿病型です。","","随時血糖は、200mg/dL以上が糖尿病型です。","HbA1cは、6.5%以上が糖尿病型です。","2時間値は、200mg/dL以上が糖尿病型です。"],"k":-1,"p":3},{"n":95,"b":"必修","t":"臨床","th":"異所性妊娠の初期対応","s":"28歳の女性。無月経のあと、突然の下腹部痛と少量の性器出血があり、受診した。妊娠反応は陽性で、超音波で子宮内に胎嚢がない。初期対応として適切なのはどれか。","o":["自宅で経過をみて、1週間後に再診させる","鎮痛薬を処方して、帰宅させる","超音波とhCGで評価し、緊急の対応を準備する","月経の開始を待って、再検査する","排卵誘発薬を処方する"],"a":2,"e":"異所性妊娠が疑われる場合は、超音波とhCGで評価し、緊急の対応を準備します。","w":["破裂の危険があり、経過観察は不適切です。","痛みの治療だけで帰宅させると、見逃します。","","月経を待つ間に、状態が悪化するおそれがあります。","排卵誘発薬は、治療として誤りです。"],"k":-1,"p":3},{"n":96,"b":"必修","t":"臨床","th":"急性虫垂炎の対応","s":"22歳の男性。心窩部の痛みが右下腹部へ移り、発熱がある。右下腹部に圧痛と反跳痛があり、急性虫垂炎が疑われる。次に行う対応として適切なのはどれか。","o":["帰宅させて、翌日の再診を指示する","下剤を処方して、排便を促す","食事をとらせて、様子をみる","内視鏡検査を、直ちに行う","超音波やCTで評価し、外科へ相談する"],"a":4,"e":"急性虫垂炎が疑われる場合は、超音波やCTで評価し、外科へ相談します。","w":["穿孔の危険があり、帰宅は不適切です。","下剤は、腹膜炎を悪化させるおそれがあります。","手術の可能性があり、食事は控えます。","内視鏡は、虫垂炎の初期の評価には用いません。",""],"k":-1,"p":3},{"n":97,"b":"必修","t":"臨床","th":"維持期のかかわり","s":"50歳の男性。禁煙を始めて8か月がたち、喫煙は再開していない。この段階の患者へのかかわり方として、適切なのはどれか。","o":["情報の提供と、気持ちの傾聴を行う","利点と欠点を、一緒に整理する","具体的な計画を、一緒に立てる","再発の予防と、継続の支援を行う","始めたばかりとして、困りごとに対応する"],"a":3,"e":"6か月以上続けている維持期には、再発の予防と、継続の支援を行います。","w":["情報の提供と傾聴は、無関心期のかかわりです。","利点と欠点の整理は、関心期のかかわりです。","計画づくりは、準備期のかかわりです。","","困りごとへの対応は、実行期のかかわりです。"],"k":-1,"p":3},{"n":98,"b":"必修","t":"臨床","th":"準備期のかかわり","s":"45歳の女性。体重を減らすために、来月から運動を始めるつもりだと話す。この段階の患者へのかかわり方として、適切なのはどれか。","o":["情報の提供と、気持ちの傾聴を行う","具体的な計画を、一緒に立てる","利点と欠点を、一緒に整理する","再発の予防と、継続の支援を行う","励ましと、困りごとへの対応を行う"],"a":1,"e":"近く始めるつもりがある準備期には、具体的な計画を立てます。","w":["情報の提供と傾聴は、無関心期のかかわりです。","","利点と欠点の整理は、関心期のかかわりです。","再発の予防は、維持期のかかわりです。","励ましと困りごとへの対応は、実行期のかかわりです。"],"k":-1,"p":3},{"n":99,"b":"必修","t":"臨床","th":"飲酒量の計算","s":"50歳の男性。毎日、ビール（アルコール度数5%）を500mLの缶で2本飲む。1日の純アルコール量と、リスクの判断として正しいのはどれか。","o":["40gで、リスクを高める量に当たらない","20gで、リスクを高める量に当たる","40gで、リスクを高める量に当たる","20gで、リスクを高める量に当たらない","32gで、リスクを高める量に当たる"],"a":2,"e":"500mLの缶1本は、500×0.05×0.8で20gです。2本で40gとなり、男性の40g以上に当たります。","w":["男性では、40g以上がリスクを高める量です。","1日の量は、20gではなく40gです。","","1日の量は、20gではなく40gです。","計算の値は32gではなく40gです。"],"k":-1,"p":3},{"n":100,"b":"必修","t":"臨床","th":"メタボリックシンドロームの判定","s":"52歳の男性。腹囲84cm、中性脂肪200mg/dL、血圧140/90mmHg、空腹時血糖120mg/dLである。降圧薬などは使っていない。メタボリックシンドロームの判定として正しいのはどれか。","o":["腹囲が基準に満たないため、該当しない","3項目に当てはまるため、該当する","血圧だけで判定できるため、該当する","腹囲に関係なく、2項目以上で該当する","血糖が基準に満たないため、該当しない"],"a":0,"e":"腹囲が男性85cm以上であることが必須です。84cmは基準に満たないため、該当しません。","w":["","腹囲が基準に満たないと、項目が揃っても該当しません。","血圧だけでは、判定できません。","腹囲は、必須の項目です。","空腹時血糖120mg/dLは、110mg/dL以上で基準を満たします。"],"k":-1,"p":3},{"n":101,"b":"総論","t":"一般","th":"労災保険の柱","s":"労災保険が属する社会保障の柱はどれか。","o":["公的扶助","社会保険","社会福祉","公衆衛生","社会手当"],"a":1,"e":"労災保険は、医療保険、介護保険、年金保険、雇用保険とともに、社会保険に属します。","w":["公的扶助は、生活保護などです。","","社会福祉は、児童福祉や障害者福祉などです。","公衆衛生は、感染症対策や予防接種などです。","社会手当は、社会保障の4つの柱に含まれません。"],"k":-1,"p":1},{"n":102,"b":"総論","t":"一般","th":"予防接種の柱","s":"感染症対策や予防接種が属する社会保障の柱はどれか。","o":["社会保険","公的扶助","公衆衛生","社会福祉","社会手当"],"a":2,"e":"感染症対策、予防接種、環境衛生は、社会全体の健康を守る公衆衛生に属します。","w":["社会保険は、保険料を出し合い事故に備える仕組みです。","公的扶助は、困窮する人に税金で生活を保障する仕組みです。","","社会福祉は、支援が必要な人にサービスを提供する仕組みです。","社会手当は、社会保障の4つの柱に含まれません。"],"k":-1,"p":1},{"n":103,"b":"総論","t":"一般","th":"介護保険の保険者","s":"介護保険の保険者はどれか。","o":["市町村","国","都道府県","健康保険組合","全国健康保険協会"],"a":0,"e":"介護保険の保険者は、市町村です。","w":["","国は、介護保険の保険者ではありません。","都道府県は、介護保険の保険者ではありません。","健康保険組合は、被用者保険の保険者です。","全国健康保険協会は、被用者保険の保険者です。"],"k":-1,"p":1},{"n":104,"b":"総論","t":"一般","th":"診療報酬の改定","s":"診療報酬は、原則として何年に1度、改定されるか。","o":["1年","3年","4年","5年","2年"],"a":4,"e":"診療報酬は、原則として2年に1度、改定されます。","w":["1年ごとの改定ではありません。","3年ごとの改定ではありません。","4年ごとの改定ではありません。","5年ごとの改定ではありません。",""],"k":-1,"p":1},{"n":105,"b":"総論","t":"一般","th":"介護保険の自己負担","s":"介護保険のサービスを利用したときの、自己負担の割合はどれか。","o":["費用の5割","費用の10割","費用の0割","費用の1割から3割","費用の4割から6割"],"a":3,"e":"介護保険の自己負担は、費用の1割から3割です。","w":["5割負担の制度ではありません。","全額が自己負担になる制度ではありません。","自己負担がない制度ではありません。","","4割から6割の負担の制度ではありません。"],"k":-1,"p":1},{"n":106,"b":"総論","t":"一般","th":"アルマ・アタ宣言","s":"プライマリ・ヘルス・ケアを示した宣言はどれか。","o":["オタワ憲章","ジュネーブ宣言","ヘルシンキ宣言","リスボン宣言","アルマ・アタ宣言"],"a":4,"e":"プライマリ・ヘルス・ケアは、アルマ・アタ宣言で示されました。","w":["オタワ憲章は、ヘルスプロモーションを示しました。","ジュネーブ宣言は、医師の倫理を示した宣言です。","ヘルシンキ宣言は、人を対象とする研究の倫理を示した宣言です。","リスボン宣言は、患者の権利を示した宣言です。",""],"k":-1,"p":1},{"n":107,"b":"総論","t":"一般","th":"応急入院の期間","s":"精神保健福祉法の応急入院で、入院させることができる期間はどれか。","o":["72時間に限る","24時間に限る","1週間に限る","1か月に限る","期間の制限はない"],"a":0,"e":"応急入院は、急を要する場合に、72時間に限り入院させる形態です。","w":["","24時間ではなく、72時間です。","1週間ではなく、72時間です。","1か月ではなく、72時間です。","72時間という期間の制限があります。"],"k":-1,"p":1},{"n":108,"b":"総論","t":"一般","th":"措置入院の命令","s":"措置入院を命じるのはどれか。","o":["市町村長","病院の管理者","都道府県知事","精神保健指定医","家庭裁判所"],"a":2,"e":"措置入院は、都道府県知事の命令で行います。","w":["市町村長は、措置入院を命じません。","病院の管理者は、措置入院を命じません。","","精神保健指定医は、診察で必要を判断しますが、命令はしません。","家庭裁判所は、措置入院を命じません。"],"k":-1,"p":1},{"n":109,"b":"総論","t":"一般","th":"初期救急","s":"救急医療の初期にあたるのはどれか。","o":["救命救急センター","入院を要する救急を担う病院","特定機能病院","在宅当番医","地域包括支援センター"],"a":3,"e":"救急医療の初期には、在宅当番医などがあたります。","w":["救命救急センターは、三次救急です。","入院を要する救急は、二次救急です。","特定機能病院は、高度な医療を提供する病院です。","","地域包括支援センターは、高齢者の総合相談の窓口です。"],"k":-1,"p":1},{"n":110,"b":"総論","t":"一般","th":"国際保健の中心","s":"国際保健で、感染症対策や持続可能な開発目標（SDGs）の取り組みの中心となる機関はどれか。","o":["国際労働機関（ILO）","世界保健機関（WHO）","世界貿易機関（WTO）","国際通貨基金（IMF）","国連教育科学文化機関（UNESCO）"],"a":1,"e":"国際保健では、世界保健機関（WHO）が中心となります。","w":["ILOは、労働に関する国際機関です。","","WTOは、貿易に関する国際機関です。","IMFは、通貨に関する国際機関です。","UNESCOは、教育や文化に関する国際機関です。"],"k":-1,"p":1},{"n":111,"b":"総論","t":"一般","th":"障害の概念","s":"障害の説明として正しいのはどれか。","o":["診断名のつく、体の状態の異常","人々が自分の健康を、よりよく管理できる過程","誰もが利用できる、住民に身近な保健医療","病気の再発を防ぐための活動","心身の機能の障害に加えて、活動や参加の制限を含む"],"a":4,"e":"障害は、心身の機能の障害に加えて、活動や参加の制限を含む概念です。","w":["診断名のつく状態の異常は、疾病の説明です。","健康を管理できる過程は、ヘルスプロモーションです。","住民に身近な保健医療は、プライマリ・ヘルス・ケアです。","再発を防ぐ活動は、三次予防です。",""],"k":-1,"p":1},{"n":112,"b":"総論","t":"一般","th":"精神保健福祉法の目的","s":"精神保健福祉法の目的の要点はどれか。","o":["国民の健康の増進","精神障害者の医療と保護、社会復帰の促進","母性と乳幼児の健康の保持と増進","感染症の発生予防とまん延防止","労働者の安全と健康"],"a":1,"e":"精神保健福祉法は、精神障害者の医療と保護、社会復帰の促進を目的とします。","w":["国民の健康の増進は、健康増進法の目的です。","","母性と乳幼児の健康は、母子保健法の目的です。","感染症の予防は、感染症法の目的です。","労働者の安全と健康は、労働安全衛生法の目的です。"],"k":-1,"p":1},{"n":113,"b":"総論","t":"一般","th":"医療計画の作成","s":"医療計画を作成するのはどれか。","o":["都道府県","市町村","国","保健所","医療保険者"],"a":0,"e":"医療計画は、都道府県が作成します。","w":["","市町村は、医療計画を作成しません。","国は、医療計画を作成しません。","保健所は、医療計画を作成しません。","医療保険者は、医療計画を作成しません。"],"k":-1,"p":1},{"n":114,"b":"総論","t":"一般","th":"地域包括ケアの要素","s":"地域包括ケアシステムで、一体的に提供される要素に含まれないのはどれか。","o":["住まい","医療","学校教育","予防","生活支援"],"a":2,"e":"地域包括ケアシステムは、住まい、医療、介護、予防、生活支援を、一体的に提供します。","w":["住まいは、構成要素です。",
