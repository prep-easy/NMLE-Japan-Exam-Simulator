などの会社員の保険者です。"],"k":-1,"p":1},{"n":121,"b":"総論","t":"一般","th":"高齢社会","s":"老年人口の割合が14%を超えた社会を、何と呼ぶか。","o":["高齢化社会","高齢社会","超高齢社会","少子社会","人口減少社会"],"a":1,"e":"老年人口の割合が、7%を超えると高齢化社会、14%を超えると高齢社会、21%を超えると超高齢社会です。","w":["高齢化社会は、7%を超えた社会です。","","超高齢社会は、21%を超えた社会です。","少子社会は、老年人口の割合による呼び方ではありません。","人口減少社会は、老年人口の割合による呼び方ではありません。"],"k":-1,"p":1},{"n":122,"b":"総論","t":"一般","th":"合計特殊出生率の値","s":"令和6年（2024年）の全国の合計特殊出生率はどれか。","o":["1.15","1.05","1.26","1.45","1.84"],"a":0,"e":"令和6年（2024年）の合計特殊出生率は、全国で1.15でした。","w":["","1.05は、この年の値より低い値です。","1.26は、この年の値より高い値です。","1.45は、この年の値より高い値です。","1.84は、この年の値より高い値です。"],"k":-1,"p":1},{"n":123,"b":"総論","t":"一般","th":"平均寿命","s":"令和5年の簡易生命表による、女性の平均寿命はどれか。","o":["81.09年","84.14年","90.14年","87.14年","85.04年"],"a":3,"e":"令和5年の簡易生命表では、男性が81.09年、女性が87.14年です。","w":["81.09年は、男性の平均寿命です。","84.14年は、女性の平均寿命ではありません。","90.14年は、女性の平均寿命ではありません。","","85.04年は、女性の平均寿命ではありません。"],"k":-1,"p":1},{"n":124,"b":"総論","t":"一般","th":"新生児の定義","s":"新生児死亡率で数える、新生児の定義はどれか。","o":["生後7日未満","生後3か月未満","生後6か月未満","生後1年未満","生後28日未満"],"a":4,"e":"新生児は、生後28日未満です。生後1年未満は乳児です。","w":["生後7日未満は、早期新生児です。","生後3か月未満は、新生児ではありません。","生後6か月未満は、新生児ではありません。","生後1年未満は、乳児です。",""],"k":-1,"p":1},{"n":125,"b":"総論","t":"一般","th":"周産期死亡率の分母","s":"周産期死亡率の分母はどれか。","o":["出生数のみ","全国の人口","出生数と、妊娠満22週以後の死産数の和","出生数と、新生児死亡数の和","妊娠満22週以後の死産数のみ"],"a":2,"e":"周産期死亡率の分母は、出産数です。出生数と、妊娠満22週以後の死産数の和にあたります。","w":["出生数だけでは、死産を含みません。","人口は、死因別死亡率などの分母です。","","新生児死亡数は、分母に足しません。","死産数だけでは、出生を含みません。"],"k":-1,"p":1},{"n":126,"b":"総論","t":"一般","th":"死因別死亡率","s":"死因別死亡率の計算で、死因別死亡数を人口で割ったあとに掛ける数はどれか。","o":["1,000","100","10,000","100,000","1,000,000"],"a":3,"e":"死因別死亡率は、死因別死亡数÷人口×100,000で、人口10万対で表します。","w":["1,000は、出生率や死亡率で掛ける数です。","100は、死因別死亡率で掛ける数ではありません。","10,000は、死因別死亡率で掛ける数ではありません。","","1,000,000は、死因別死亡率で掛ける数ではありません。"],"k":-1,"p":1},{"n":127,"b":"総論","t":"一般","th":"罹患率の説明","s":"罹患率の説明として正しいのはどれか。","o":["ある時点で、病気を持つ人の割合","曝露群のリスクが、非曝露群の何倍か","曝露によって増えた、リスクの大きさ","病気で死亡する人の割合","一定期間に、新しく病気になる人の割合"],"a":4,"e":"罹患率は、一定期間に、新しく病気になる人の割合です。","w":["ある時点の割合は、有病率です。","リスクの倍数は、相対危険です。","増えたリスクの大きさは、寄与危険です。","死亡する人の割合は、罹患率ではありません。",""],"k":-1,"p":1},{"n":128,"b":"総論","t":"一般","th":"寄与危険の説明","s":"寄与危険の説明として正しいのはどれか。","o":["曝露群のリスクが、非曝露群の何倍か","曝露によって増えた、リスクの大きさ","ある時点で、病気を持つ人の割合","一定期間に、新しく病気になる人の割合","曝露のオッズの比"],"a":1,"e":"寄与危険は、曝露群の罹患率から、非曝露群の罹患率を引いた値です。","w":["リスクの倍数は、相対危険です。","","ある時点の割合は、有病率です。","新しく病気になる割合は、罹患率です。","曝露のオッズの比は、オッズ比です。"],"k":-1,"p":1},{"n":129,"b":"総論","t":"一般","th":"ランダム化比較試験","s":"ランダム化比較試験の特徴として、正しいのはどれか。","o":["因果関係の証明力が強いが、倫理面の制約がある","稀な疾患に適するが、思い出しの偏りが入りやすい","時間の前後が分からず、有病率が得られる","人、場所、時間の分布を記述して、仮説をつくる","過去の曝露を比べるため、時間と費用が少ない"],"a":0,"e":"ランダム化比較試験は、介入群と対照群を無作為に割り付けます。因果関係の証明力が強い一方で、倫理面の制約があります。","w":["","稀な疾患に適するのは、症例対照研究です。","時間の前後が分からないのは、横断研究です。","分布を記述するのは、記述疫学です。","過去の曝露を比べるのは、症例対照研究です。"],"k":-1,"p":1},{"n":130,"b":"総論","t":"一般","th":"症例対照研究が適する場合","s":"症例対照研究が適しているのはどれか。","o":["稀な曝露の影響を調べる場合","集団の有病率を調べる場合","稀な疾患の原因を調べる場合","介入の効果を無作為に比べる場合","疾患の経過を長く追う場合"],"a":2,"e":"症例対照研究は、患者と対照を集めて過去の曝露を比べるため、稀な疾患に適します。","w":["稀な曝露に適するのは、コホート研究です。","有病率が得られるのは、横断研究です。","","無作為に比べるのは、ランダム化比較試験です。","経過を長く追うのは、コホート研究です。"],"k":-1,"p":1},{"n":131,"b":"総論","t":"一般","th":"選択バイアス","s":"選択バイアスの説明として正しいのはどれか。","o":["対象者の選び方によって、結果が偏る","測定や聞き取りの方法によって、結果が偏る","第三の因子が、曝露と結果の関連を歪める","差があるのに、差がないと判断する","差がないのに、差があると判断する"],"a":0,"e":"選択バイアスは、対象者の選び方によって、結果が偏ることです。","w":["","測定や聞き取りによる偏りは、情報バイアスです。","第三の因子による歪みは、交絡です。","差があるのに差がないとするのは、第2種の過誤です。","差がないのに差があるとするのは、第1種の過誤です。"],"k":-1,"p":1},{"n":132,"b":"総論","t":"一般","th":"特異度の計算","s":"疾患のない200人にスクリーニング検査を行い、180人が陰性、20人が陽性であった。この検査の特異度はどれか。","o":["10%","20%","90%","45%","80%"],"a":2,"e":"特異度は、疾患のない人のうち、陰性と判定される割合です。180÷200で、90%です。","w":["10%は、偽陽性の割合です。","20%は、陽性の人数の値で、特異度ではありません。","","45%は、計算の結果と一致しません。","80%は、計算の結果と一致しません。"],"k":-1,"p":1},{"n":133,"b":"総論","t":"一般","th":"システマティックレビュー","s":"システマティックレビューの説明として正しいのはどれか。","o":["複数の研究の結果を、統計学的に統合する方法","患者と対照を集めて、過去の曝露を比べる研究","集団を無作為に割り付けて、介入を比べる研究","条件を決めて、関連する研究を網羅的に集め、評価する方法","生存時間を解析して、曲線で表す方法"],"a":3,"e":"システマティックレビューは、条件を決めて、関連する研究を網羅的に集めて評価する方法です。","w":["統計学的に統合する方法は、メタ分析です。","過去の曝露を比べる研究は、症例対照研究です。","無作為に割り付ける研究は、ランダム化比較試験です。","","生存時間の解析は、カプラン・マイヤー法です。"],"k":-1,"p":1},{"n":134,"b":"総論","t":"一般","th":"特定健康診査の実施義務","s":"特定健康診査の実施が義務づけられているのはどれか。","o":["学校の校長","全国の保健所","日本医師会","厚生労働大臣","医療保険者"],"a":4,"e":"特定健康診査と特定保健指導は、医療保険者に実施が義務づけられています。","w":["学校の校長は、特定健康診査の実施者ではありません。","保健所は、特定健康診査の実施が義務づけられた機関ではありません。","日本医師会は、特定健康診査の実施が義務づけられた機関ではありません。","厚生労働大臣は、特定健康診査の実施者ではありません。",""],"k":-1,"p":1},{"n":135,"b":"総論","t":"一般","th":"A類疾病の特徴","s":"予防接種法のA類疾病の説明として正しいのはどれか。","o":["個人の重症化予防を目的とする","集団の感染予防を目的とし、接種の努力義務がある","接種は、すべて任意である","高齢者だけが対象である","対象は、季節性インフルエンザである"],"a":1,"e":"A類疾病は、集団の感染予防を目的とし、接種の努力義務があります。","w":["個人の重症化予防は、B類疾病の目的です。","","A類疾病は、定期接種で、努力義務があります。","A類疾病には、小児の疾病が多く含まれます。","季節性インフルエンザは、B類疾病です。"],"k":-1,"p":1},{"n":136,"b":"総論","t":"一般","th":"食中毒の届出期限","s":"食中毒を診断した医師が、最寄りの保健所長へ届け出る期限はどれか。","o":["48時間以内","7日以内","24時間以内","14日以内","1か月以内"],"a":2,"e":"食品衛生法に基づき、食中毒を診断した医師は、24時間以内に最寄りの保健所長へ届け出ます。","w":["48時間ではなく、24時間以内です。","7日以内は、五類感染症の届出の期限です。","","14日以内ではなく、24時間以内です。","1か月以内ではなく、24時間以内です。"],"k":-1,"p":1},{"n":137,"b":"総論","t":"一般","th":"イタイイタイ病の障害","s":"イタイイタイ病でみられる障害はどれか。","o":["感覚障害、運動失調、視野狭窄","腎の尿細管障害と骨軟化症","気管支喘息などの呼吸器疾患","貧血と皮膚の色素沈着","高血圧と心不全"],"a":1,"e":"イタイイタイ病は、カドミウムによる、腎の尿細管障害と骨軟化症が特徴です。","w":["感覚障害、運動失調、視野狭窄は、水俣病の特徴です。","","呼吸器疾患は、四日市ぜんそくの特徴です。","貧血と色素沈着は、イタイイタイ病の特徴ではありません。","高血圧と心不全は、イタイイタイ病の特徴ではありません。"],"k":-1,"p":1},{"n":138,"b":"総論","t":"臨床","th":"麻しんの届出","s":"20歳の女性。発熱、発疹、結膜の充血で受診し、麻しんと診断された。感染症法に基づく、医師の届出の時期として正しいのはどれか。","o":["7日以内","14日以内","30日以内","届出は不要である","直ちに"],"a":4,"e":"麻しんは、五類感染症（全数把握）ですが、診断した医師は直ちに届け出ます。","w":["7日以内は、麻しんの届出の期限ではありません。","14日以内は、麻しんの届出の期限ではありません。","30日以内は、麻しんの届出の期限ではありません。","麻しんは、全数把握の対象で、届出が必要です。",""],"k":-1,"p":1},{"n":139,"b":"総論","t":"臨床","th":"特定健康診査の対象","s":"76歳の男性。会社を退職し、後期高齢者医療制度に加入している。特定健康診査の対象年齢についての説明として、正しいのはどれか。","o":["対象ではない。対象は40歳から74歳である","対象である。対象は40歳以上である","対象である。対象は65歳以上である","対象ではない。対象は20歳から64歳である","対象である。対象は50歳以上である"],"a":0,"e":"特定健康診査の対象は、40歳から74歳です。76歳は対象に含まれません。","w":["","対象は、40歳以上ではなく、40歳から74歳です。","対象は、65歳以上ではなく、40歳から74歳です。","対象は、20歳から64歳ではありません。","対象は、50歳以上ではなく、40歳から74歳です。"],"k":-1,"p":1},{"n":140,"b":"総論","t":"臨床","th":"相対危険の計算","s":"40歳以上の喫煙者2,000人と、非喫煙者3,000人を5年間追跡した。喫煙者では60人、非喫煙者では30人が、肺疾患を発症した。相対危険はどれか。","o":["2.0","0.33","6.0","3.0","1.5"],"a":3,"e":"喫煙者の罹患率は60÷2,000で3%、非喫煙者は30÷3,000で1%です。相対危険は、3÷1で3.0です。","w":["2.0は、発症者数だけの比で、人数を考慮していません。","0.33は、2群の割合を逆にした値です。","6.0は、計算の結果と一致しません。","","1.5は、計算の結果と一致しません。"],"k":-1,"p":1},{"n":141,"b":"総論","t":"臨床","th":"罹患率の計算","s":"40歳以上の住民5,000人を1年間追跡したところ、新たに糖尿病を発症した人は25人であった。1年間の罹患率はどれか。","o":["5%","0.05%","0.5%","2.5%","20%"],"a":2,"e":"罹患率は、新規患者数÷観察した人数で求めます。25÷5,000で、0.5%です。","w":["5%は、桁が1つ大きい誤りです。","0.05%は、桁が1つ小さい誤りです。","","2.5%は、計算の結果と一致しません。","20%は、計算の結果と一致しません。"],"k":-1,"p":1},{"n":142,"b":"総論","t":"臨床","th":"オッズ比の計算","s":"症例対照研究で、40歳以上の患者50人と、対照100人を調べた。患者では、曝露ありが30人、曝露なしが20人であった。対照では、曝露ありが20人、曝露なしが80人であった。オッズ比はどれか。","o":["6.0","3.0","1.5","12.0","0.17"],"a":0,"e":"オッズ比は、(a×d)÷(b×c)で求めます。(30×80)÷(20×20)で、6.0です。","w":["","3.0は、患者と対照の曝露の割合の比で、オッズ比ではありません。","1.5は、患者の曝露ありとなしの比で、オッズ比ではありません。","12.0は、計算の結果と一致しません。","0.17は、式の分母と分子を逆にした値です。"],"k":-1,"p":1},{"n":143,"b":"総論","t":"臨床","th":"周産期死亡率の計算","s":"ある年の、ある地域の出生数は990人、妊娠満22週以後の死産数は10人、早期新生児死亡数は5人であった。周産期死亡率（出産千対）はどれか。","o":["15.2","15.0","10.0","5.0","1.5"],"a":1,"e":"周産期死亡率は、（死産数＋早期新生児死亡数）÷（出生数＋死産数）×1,000です。15÷1,000×1,000で、15.0です。","w":["15.2は、分母を出生数だけにした誤りです。","","10.0は、死産数だけで計算した値です。","5.0は、早期新生児死亡数だけで計算した値です。","1.5は、1,000を掛けていない桁の誤りです。"],"k":-1,"p":1},{"n":144,"b":"総論","t":"臨床","th":"マススクリーニングの予防段階","s":"生後5日の男児。先天性代謝異常等の検査（マススクリーニング）のために、足の裏から採血した。この活動が属する予防の段階はどれか。","o":["一次予防","三次予防","リハビリテーション","二次予防","ヘルスプロモーション"],"a":3,"e":"新生児マススクリーニングは、早期に発見し、早期に治療する、二次予防です。","w":["一次予防は、病気にならないようにする予防です。","三次予防は、再発や悪化を防ぐ予防です。","リハビリテーションは、三次予防の例です。","","ヘルスプロモーションは、健康を管理できるようにする過程です。"],"k":-1,"p":1},{"n":145,"b":"総論","t":"臨床","th":"ロタウイルスワクチンと間隔","s":"生後2か月の女児。ロタウイルスワクチン（経口生ワクチン）を接種した。数日後に、五種混合ワクチンの接種を予定している。接種間隔について正しいのはどれか。","o":["27日以上あけなければならない","14日以上あけなければならない","1か月以上あけなければならない","3か月以上あけなければならない","間隔の制限はなく、接種できる"],"a":4,"e":"経口の生ワクチンと不活化ワクチンには、間隔の制限がありません。27日以上の間隔は、注射の生ワクチン同士の決まりです。","w":["27日以上の間隔は、注射の生ワクチン同士の決まりです。","14日以上の間隔の決まりはありません。","1か月以上の間隔の決まりはありません。","3か月以上の間隔の決まりはありません。",""],"k":-1,"p":1},{"n":146,"b":"総論","t":"一般","th":"嗅神経","s":"嗅覚を担う脳神経はどれか。","o":["視神経","嗅神経","三叉神経","迷走神経","舌咽神経"],"a":1,"e":"嗅覚を担うのは、第Ⅰ脳神経の嗅神経です。","w":["視神経は、視覚を担います。","","三叉神経は、顔面の感覚と咀嚼筋の運動を担います。","迷走神経は、咽頭・喉頭の運動と内臓の副交感神経を担います。","舌咽神経は、舌の後方3分の1の味覚と嚥下を担います。"],"k":-1,"p":1},{"n":147,"b":"総論","t":"一般","th":"視神経","s":"視覚を担う脳神経はどれか。","o":["動眼神経","滑車神経","視神経","外転神経","嗅神経"],"a":2,"e":"視覚を担うのは、第Ⅱ脳神経の視神経です。","w":["動眼神経は、眼球運動と瞳孔の縮小を担います。","滑車神経は、上斜筋を支配します。","","外転神経は、外直筋を支配します。","嗅神経は、嗅覚を担います。"],"k":-1,"p":1},{"n":148,"b":"総論","t":"一般","th":"動眼神経の働き","s":"瞳孔の縮小と、上眼瞼の挙上に働く脳神経はどれか。","o":["滑車神経","外転神経","顔面神経","視神経","動眼神経"],"a":4,"e":"動眼神経は、眼球運動、瞳孔の縮小、上眼瞼の挙上を担います。","w":["滑車神経は、上斜筋を支配する眼球運動を担います。","外転神経は、外直筋による眼球の外転を担います。","顔面神経は、表情筋と涙腺・唾液腺の分泌を担います。","視神経は、視覚の伝達だけを担います。",""],"k":-1,"p":1},{"n":149,"b":"総論","t":"一般","th":"顔面神経の分泌","s":"涙腺と唾液腺の分泌に関わる脳神経はどれか。","o":["顔面神経","三叉神経","内耳神経","副神経","舌下神経"],"a":0,"e":"顔面神経は、表情筋、舌の前方3分の2の味覚、涙腺・唾液腺の分泌を担います。","w":["","三叉神経は、顔面の感覚と咀嚼筋の運動を担います。","内耳神経は、聴覚と平衡覚を担います。","副神経は、胸鎖乳突筋と僧帽筋を支配します。","舌下神経は、舌の運動を支配します。"],"k":-1,"p":1},{"n":150,"b":"総論","t":"一般","th":"ヒス束の次","s":"心臓の刺激伝導系で、ヒス束の次に興奮が伝わる部位はどれか。","o":["洞結節","房室結節","プルキンエ線維","左右の脚","心房筋"],"a":3,"e":"興奮は、洞結節、房室結節、ヒス束、左右の脚、プルキンエ線維の順に伝わります。","w":["洞結節は、興奮が始まる最初の部位です。","房室結節は、ヒス束の前に位置します。","プルキンエ線維は、左右の脚の次に位置します。","","心房筋は、伝導系の順路に含まれません。"],"k":-1,"p":1},{"n":151,"b":"総論","t":"一般","th":"糸球体の働き","s":"腎の糸球体の主な働きはどれか。","o":["原尿の水分を再吸収する","血液を濾過して、原尿をつくる","尿を一時的にためる","尿を体の外へ運ぶ","血液にホルモンを放出する"],"a":1,"e":"糸球体は、血液を濾過して原尿をつくります。再吸収は、尿細管で行います。","w":["再吸収は、尿細管の働きです。","","尿をためるのは、膀胱です。","尿を体外へ運ぶのは、尿道です。","ホルモンの放出は、糸球体の主な働きではありません。"],"k":-1,"p":1},{"n":152,"b":"総論","t":"一般","th":"ミトコンドリア","s":"細胞内で、エネルギー（ATP）をつくる小器官はどれか。","o":["ミトコンドリア","核","ゴルジ装置","リソソーム","小胞体"],"a":0,"e":"ミトコンドリアは、細胞のエネルギーであるATPを産生します。","w":["","核は、遺伝情報を保持します。","ゴルジ装置は、蛋白質の修飾と分泌に関わります。","リソソームは、不要な物質を分解します。","小胞体は、蛋白質の合成と輸送に関わります。"],"k":-1,"p":1},{"n":153,"b":"総論","t":"一般","th":"甲状腺ホルモン","s":"代謝を高めるホルモンはどれか。","o":["PTH","ADH","甲状腺ホルモン","プロラクチン","カルシトニン"],"a":2,"e":"甲状腺ホルモンは、代謝を高めます。","w":["PTHは、血中カルシウムを上げます。","ADHは、水の再吸収を促します。","","プロラクチンは、乳汁の産生を促します。","カルシトニンは、血中カルシウムを下げます。"],"k":-1,"p":1},{"n":154,"b":"総論","t":"一般","th":"オキシトシンの分泌","s":"オキシトシンを分泌する部位はどれか。","o":["下垂体前葉","副腎皮質","副腎髄質","下垂体後葉","膵臓"],"a":3,"e":"オキシトシンは、ADHとともに、下垂体後葉から分泌されます。","w":["下垂体前葉は、GHやプロラクチンなどを分泌します。","副腎皮質は、コルチゾールなどを分泌します。","副腎髄質は、アドレナリンなどを分泌します。","","膵臓は、インスリンなどを分泌します。"],"k":-1,"p":1},{"n":155,"b":"総論","t":"一般","th":"インスリン","s":"血糖を下げるホルモンはどれか。","o":["グルカゴン","アドレナリン","コルチゾール","PTH","インスリン"],"a":4,"e":"膵臓から分泌されるインスリンが、血糖を下げます。","w":["グルカゴンは、血糖を上げます。","アドレナリンは、交感神経の働きを強め、血糖を上げます。","コルチゾールは、糖代謝に働き、血糖を上げます。","PTHは、血中カルシウムを上げます。",""],"k":-1,"p":1},{"n":156,"b":"総論","t":"一般","th":"TSHの標的","s":"TSHが刺激する臓器はどれか。","o":["副腎皮質","甲状腺","卵巣","乳腺","副甲状腺"],"a":1,"e":"TSHは、下垂体前葉から分泌され、甲状腺を刺激します。","w":["副腎皮質を刺激するのは、ACTHです。","","卵巣を刺激するのは、FSHとLHです。","乳腺を刺激するのは、プロラクチンです。","副甲状腺は、血中カルシウムで調節されます。"],"k":-1,"p":1},{"n":157,"b":"総論","t":"一般","th":"ACTHの標的","s":"ACTHが刺激する臓器はどれか。","o":["甲状腺","精巣","膵臓","副腎皮質","副腎髄質"],"a":3,"e":"ACTHは、下垂体前葉から分泌され、副腎皮質を刺激します。","w":["甲状腺を刺激するのは、TSHです。","精巣を刺激するのは、FSHとLHです。","膵臓は、血糖で調節されます。","","副腎髄質は、交感神経で調節されます。"],"k":-1,"p":1},{"n":158,"b":"総論","t":"一般","th":"静脈管の働き","s":"胎児循環で、臍静脈血を肝を迂回して下大静脈へ送る構造はどれか。","o":["動脈管","卵円孔","静脈管","臍動脈","肝円索"],"a":2,"e":"静脈管は、臍静脈血を肝を迂回して、下大静脈へ送ります。","w":["動脈管は、肺動脈から大動脈へ血液を通します。","卵円孔は、右心房から左心房へ血液を通します。","","臍動脈は、胎児から胎盤へ血液を運びます。","肝円索は、臍静脈が出生後に閉じたものです。"],"k":-1,"p":1},{"n":159,"b":"総論","t":"一般","th":"体重が2倍になる時期","s":"乳児の体重が、出生時の約2倍になる時期の目安はどれか。","o":["生後1か月","生後6か月","生後9か月","生後12か月","生後3から4か月"],"a":4,"e":"体重は、生後3から4か月で出生時の約2倍、1歳で約3倍になります。","w":["生後1か月では、まだ約2倍になりません。","生後6か月は、約2倍になる時期より遅い目安です。","生後9か月は、約2倍になる時期より遅い目安です。","生後12か月は、約3倍になる時期です。",""],"k":-1,"p":1},{"n":160,"b":"総論","t":"一般","th":"身長が2倍になる時期","s":"身長が、出生時の約2倍になる時期の目安はどれか。","o":["4歳","生後6か月","1歳","生後3か月","2歳"],"a":0,"e":"身長は、1歳で出生時の約1.5倍、4歳で約2倍です。","w":["","生後6か月では、約2倍に届きません。","1歳は、約1.5倍の時期です。","生後3か月では、約2倍に届きません。","2歳では、まだ約2倍に届きません。"],"k":-1,"p":1},{"n":161,"b":"総論","t":"一般","th":"6か月ごろの発達","s":"生後6か月ごろの乳児の発達として、正しいのはどれか。","o":["ひとりで歩く","二語文を話す","階段を上り下りする","寝返りができる","ひとりで着替える"],"a":3,"e":"生後6か月ごろは、寝返りができるようになります。","w":["ひとり歩きは、1歳ごろです。","二語文は、2歳ごろです。","階段の上り下りは、2から3歳ごろです。","","ひとりで着替えるのは、3から4歳ごろです。"],"k":-1,"p":1},{"n":162,"b":"総論","t":"一般","th":"つかまり立ち","s":"つかまり立ちをして、はいはいをする時期の目安はどれか。","o":["2から3か月","3から4か月","9から10か月","5から6か月","12から14か月"],"a":2,"e":"つかまり立ちとはいはいは、9から10か月が目安です。","w":["2から3か月は、あやすと笑う時期です。","3から4か月は、首がすわる時期です。","","5から6か月は、寝返りをする時期です。","12から14か月は、ひとり歩きをする時期です。"],"k":-1,"p":1},{"n":163,"b":"総論","t":"一般","th":"加齢と肺活量","s":"加齢による呼吸器の変化はどれか。","o":["肺活量の増加","咳反射の亢進","誤嚥の減少","肺胞数の増加","肺活量の低下"],"a":4,"e":"加齢では、肺活量が低下し、咳反射の低下で誤嚥が増えます。","w":["肺活量は、増加せずに低下します。","咳反射は、亢進せずに低下します。","誤嚥は、減少せずに増加します。","肺胞数は、加齢で増加しません。",""],"k":-1,"p":1},{"n":164,"b":"総論","t":"一般","th":"反射の左右差","s":"原始反射に左右差があるとき、まず考えるのはどれか。","o":["正常な個人差","神経の異常","発達が早いこと","母乳の不足","皮膚の乾燥"],"a":1,"e":"反射が消えないときや、左右差があるときは、神経の異常を考えます。","w":["左右差は、正常な個人差とは考えません。","","左右差は、発達が早いことを示しません。","母乳の不足では、反射の左右差は起こりません。","皮膚の乾燥では、反射の左右差は起こりません。"],"k":-1,"p":1},{"n":165,"b":"総論","t":"臨床","th":"滑車神経麻痺","s":"58歳の男性。頭部外傷のあと、階段を降りるときに物が二重に見える。下を向くと複視が強くなる。障害されている脳神経はどれか。","o":["滑車神経","動眼神経","外転神経","三叉神経","視神経"],"a":0,"e":"下方視の複視は、上斜筋を支配する滑車神経の障害で起こります。","w":["","動眼神経の麻痺では、眼瞼下垂と瞳孔の散大が出ます。","外転神経の麻痺では、外側を向くときに複視が出ます。","三叉神経は、顔面の感覚と咀嚼筋を担います。","視神経の障害では、視力や視野が障害されます。"],"k":-1,"p":1},{"n":166,"b":"総論","t":"臨床","th":"副神経麻痺","s":"55歳の男性。頸部リンパ節の生検のあと、右の肩を上げにくく、首を左へ回す力が弱い。障害されている脳神経はどれか。","o":["舌下神経","迷走神経","舌咽神経","副神経","顔面神経"],"a":3,"e":"胸鎖乳突筋と僧帽筋を支配する副神経の障害です。","w":["舌下神経の障害では、舌の運動が障害されます。","迷走神経の障害では、嗄声や嚥下の障害が出ます。","舌咽神経の障害では、舌の後方の味覚と嚥下が障害されます。","","顔面神経の障害では、表情筋が麻痺します。"],"k":-1,"p":1},{"n":167,"b":"総論","t":"臨床","th":"舌下神経麻痺","s":"68歳の男性。舌を出すと、右に曲がる。舌の萎縮があり、味覚は保たれている。障害されている脳神経はどれか。","o":["舌咽神経","顔面神経","迷走神経","三叉神経","舌下神経"],"a":4,"e":"舌の運動を支配する舌下神経の障害です。","w":["舌咽神経の障害では、舌の後方の味覚が低下します。","顔面神経の障害では、舌の前方の味覚が低下します。","迷走神経の障害では、咽頭・喉頭の運動が障害されます。","三叉神経の障害では、顔面の感覚が鈍くなります。",""],"k":-1,"p":1},{"n":168,"b":"総論","t":"臨床","th":"三叉神経麻痺","s":"60歳の女性。左の顔面の感覚が鈍い。口を閉じて噛みしめると、左の咬筋が触れにくい。障害されている脳神経はどれか。","o":["三叉神経","顔面神経","動眼神経","内耳神経","副神経"],"a":0,"e":"顔面の感覚と咀嚼筋の運動を担う三叉神経の障害です。","w":["","顔面神経の障害では、表情筋が麻痺します。","動眼神経の障害では、眼瞼下垂が出ます。","内耳神経の障害では、聴覚と平衡覚が障害されます。","副神経の障害では、肩が上がりにくくなります。"],"k":-1,"p":1},{"n":169,"b":"総論","t":"臨床","th":"10か月の発達","s":"生後10か月の乳児。つかまり立ちをして、はいはいで移動する。まだ歩かず、初語もない。母親が発達の遅れを心配している。対応として適切なのはどれか。","o":["直ちに薬物療法を開始する","直ちに染色体検査を行う","月齢相応の発達であると説明し、経過をみる","歩行訓練を始めるよう指示する","発達障害と診断して療育を勧める"],"a":2,"e":"つかまり立ちとはいはいは9から10か月、ひとり歩きと初語は12から14か月が目安で、月齢相応です。","w":["発達の遅れではないため、薬物療法は不要です。","発達の遅れがなく、染色体検査は必要ありません。","","歩行は12から14か月の目安で、訓練は不要です。","月齢相応の発達で、発達障害とは診断できません。"],"k":-1,"p":1},{"n":170,"b":"総論","t":"臨床","th":"分娩第3期","s":"28歳の女性。分娩中で、児が娩出された。胎盤はまだ娩出されていない。この時期はどれか。","o":["第1期（開口期）","第3期（後産期）","第2期（娩出期）","産褥期","妊娠末期"],"a":1,"e":"児の娩出から胎盤の娩出までは、第3期（後産期）です。","w":["第1期は、陣痛の開始から子宮口の全開大までです。","","第2期は、子宮口の全開大から児の娩出までです。","産褥期は、分娩のあと、母体が妊娠前の状態に戻るまでの期間です。","妊娠末期は、妊娠28週0日以降の分娩前の時期です。"],"k":-1,"p":1},{"n":171,"b":"総論","t":"臨床","th":"母乳と免疫グロブリン","s":"生後2か月の乳児。母乳栄養である。母乳に含まれ、乳児の腸管の粘膜を守る免疫グロブリンはどれか。","o":["IgM","IgD","IgE","IgG","分泌型IgA"],"a":4,"e":"分泌型IgAは、粘膜、母乳、唾液、涙に含まれ、粘膜を守ります。","w":["IgMは、感染の初期に上がる五量体で、母乳の主成分ではありません。","IgDは、粘膜を守る主な免疫グロブリンではありません。","IgEは、Ⅰ型アレルギーと寄生虫の防御に関わります。","IgGは、胎盤を通過して新生児を守りますが、粘膜を守る主役ではありません。",""],"k":-1,"p":1},{"n":172,"b":"総論","t":"臨床","th":"過期産","s":"32歳の女性。妊娠42週3日で、自然に分娩した。出産の時期の分類として正しいのはどれか。","o":["早産","正期産","流産","過期産","産褥期"],"a":3,"e":"妊娠42週0日以降の出産は、過期産です。","w":["早産は、22週0日から36週6日の出産です。","正期産は、37週0日から41週6日の出産です。","流産は、妊娠22週より前の妊娠の終了です。","","産褥期は、分娩のあとの回復期間です。"],"k":-1,"p":1},{"n":173,"b":"総論","t":"一般","th":"常染色体優性の特徴","s":"常染色体優性遺伝の特徴はどれか。","o":["世代を連続して現れ、男女に同じ頻度で発症する","世代を飛び越えて現れ、血族結婚で増える","男性に多く、母から息子へ伝わる","母から子へ伝わり、男女とも発症する","男性から男性にだけ伝わる"],"a":0,"e":"常染色体優性遺伝は、世代を連続して現れ、男女に同じ頻度で発症します。","w":["","世代を飛び越える特徴は、常染色体劣性遺伝です。","男性に多く母から息子へ伝わるのは、X連鎖劣性遺伝です。","母から子へ伝わるのは、ミトコンドリア遺伝です。","男性から男性にだけ伝わる形式は、常染色体優性遺伝ではありません。"],"k":-1,"p":1},{"n":174,"b":"総論","t":"一般","th":"X連鎖劣性の疾患","s":"X連鎖劣性遺伝の疾患はどれか。","o":["ハンチントン病","赤緑色覚異常","フェニルケトン尿症","嚢胞性線維症","神経線維腫症"],"a":1,"e":"赤緑色覚異常は、X連鎖劣性遺伝で、男性に多くみられます。","w":["ハンチントン病は、常染色体優性遺伝です。","","フェニルケトン尿症は、常染色体劣性遺伝です。","嚢胞性線維症は、常染色体劣性遺伝です。","神経線維腫症は、常染色体優性遺伝です。"],"k":-1,"p":1},{"n":175,"b":"総論","t":"一般","th":"血族結婚と遺伝形式","s":"血族結婚で、患者の頻度が増える遺伝形式はどれか。","o":["常染色体優性遺伝","X連鎖劣性遺伝","常染色体劣性遺伝","ミトコンドリア遺伝","Y連鎖遺伝"],"a":2,"e":"両親が保因者であることが多い常染色体劣性遺伝は、血族結婚で増えます。","w":["常染色体優性遺伝は、血族結婚で増えません。","X連鎖劣性遺伝は、血族結婚で増える形式ではありません。","","ミトコンドリア遺伝は、母から子へ伝わる形式です。","Y連鎖遺伝は、血族結婚で増える形式ではありません。"],"k":-1,"p":1},{"n":176,"b":"総論","t":"一般","th":"内因と外因","s":"疾病の外因に含まれるのはどれか。","o":["遺伝","加齢","免疫","体質","物理的因子"],"a":4,"e":"疾病の外因には、物理的、化学的、生物学的な因子があります。","w":["遺伝は、内因です。","加齢は、内因です。","免疫は、内因です。","体質は、内因に含まれます。",""],"k":-1,"p":1},{"n":177,"b":"総論","t":"一般","th":"創傷治癒の炎症期","s":"創傷の治癒の炎症期の特徴はどれか。","o":["線維芽細胞とコラーゲンの産生","コラーゲンの再構築","止血と、好中球・マクロファージによる処理","肉芽組織の形成","血管新生"],"a":2,"e":"炎症期では、止血と、好中球・マクロファージによる処理が行われます。","w":["線維芽細胞とコラーゲンの産生は、増殖期です。","コラーゲンの再構築は、成熟期です。","","肉芽組織の形成は、増殖期です。","血管新生は、増殖期です。"],"k":-1,"p":1},{"n":178,"b":"総論","t":"一般","th":"創傷治癒の成熟期","s":"創傷の治癒の成熟期の特徴はどれか。","o":["止血","コラーゲンの再構築","好中球の遊走","肉芽組織の形成","血管新生"],"a":1,"e":"成熟期では、コラーゲンが再構築されます。","w":["止血は、炎症期の初めに起こります。","","好中球の遊走は、炎症期です。","肉芽組織の形成は、増殖期です。","血管新生は、増殖期です。"],"k":-1,"p":1},{"n":179,"b":"総論","t":"一般","th":"空気感染","s":"感染経路のうち、飛沫核によって起こるのはどれか。","o":["空気感染","接触感染","経口感染","血液感染","母子感染"],"a":0,"e":"飛沫核によって起こる感染経路は、空気感染です。","w":["","接触感染は、皮膚や物を介する経路です。","経口感染は、飲食物を介する経路です。","血液感染は、血液を介する経路です。","母子感染は、母から子へ伝わる経路です。"],"k":-1,"p":1},{"n":180,"b":"総論","t":"一般","th":"がん抑制遺伝子","s":"がん抑制遺伝子はどれか。","o":["RAS","MYC","HER2","p53","BCR-ABL"],"a":3,"e":"p53は、不活化でがんの発生に関わるがん抑制遺伝子です。","w":["RASは、活性化でがんに関わるがん遺伝子です。","MYCは、活性化でがんに関わるがん遺伝子です。","HER2は、活性化でがんに関わるがん遺伝子です。","","BCR-ABLは、活性化でがんに関わる融合遺伝子です。"],"k":-1,"p":1},{"n":181,"b":"総論","t":"一般","th":"血栓","s":"血管内で、血液が固まったものを何というか。","o":["塞栓","梗塞","血栓","浮腫","肉芽"],"a":2,"e":"血管内で血液が固まったものを、血栓といいます。","w":["塞栓は、血管を流れてきた物が詰まることです。","梗塞は、血流が絶たれて組織が壊死することです。","","浮腫は、組織間に水分がたまる状態です。","肉芽は、組織の修復で形成される組織です。"],"k":-1,"p":1},{"n":182,"b":"総論","t":"一般","th":"Ⅱ型アレルギーの疾患","s":"Ⅱ型アレルギーによる疾患はどれか。","o":["気管支喘息","全身性エリテマトーデス","接触皮膚炎","自己免疫性溶血性貧血","花粉症"],"a":3,"e":"Ⅱ型は、抗体が細胞表面の抗原に結合して細胞を傷害します。","w":["気管支喘息は、Ⅰ型です。","全身性エリテマトーデスは、Ⅲ型です。","接触皮膚炎は、Ⅳ型です。","","花粉症は、Ⅰ型です。"],"k":-1,"p":1},{"n":183,"b":"総論","t":"一般","th":"ダウン症候群の頻度","s":"ダウン症候群の頻度が増える要因はどれか。","o":["母の年齢が高いこと","母の年齢が低いこと","両親の血族結婚","早産であること","母乳で育てること"],"a":0,"e":"ダウン症候群は、母の年齢が高いほど頻度が増えます。","w":["","母の年齢が低いほど、頻度は低くなります。","血族結婚で増えるのは、常染色体劣性遺伝です。","早産であることは、頻度を増やす要因ではありません。","母乳で育てることは、染色体異常と関係しません。"],"k":-1,"p":1},{"n":184,"b":"総論","t":"臨床","th":"熱傷の腫脹","s":"35歳の男性。熱湯で右前腕に熱傷を負い、受傷部が腫れている。腫れの主な機序はどれか。","o":["毛細血管の静水圧の上昇","血管透過性の亢進","血漿の膠質浸透圧の低下","リンパ還流の障害","血管の収縮"],"a":1,"e":"熱傷では、血管透過性が亢進して、浸出が起こり、腫れます。","w":["静水圧の上昇は、右心不全などの浮腫の機序です。","","膠質浸透圧の低下は、低アルブミン血症の浮腫の機序です。","リンパ還流の障害は、郭清後などの浮腫の機序です。","血管の収縮では、血流が減り、腫れません。"],"k":-1,"p":1},{"n":185,"b":"総論","t":"臨床","th":"血行性転移","s":"65歳の男性。肺癌の手術後に、肝臓と脳に転移が見つかった。主な転移の経路はどれか。","o":["リンパ行性転移","播種","直接浸潤","神経周囲転移","血行性転移"],"a":4,"e":"離れた臓器への転移は、血流に乗って起こる血行性転移が主です。","w":["リンパ行性転移は、リンパ節への転移の経路です。","播種は、体腔内に細胞が散らばる経路です。","直接浸潤は、隣接する組織への広がりです。","神経周囲への広がりは、離れた臓器への転移の経路ではありません。",""],"k":-1,"p":1},{"n":186,"b":"総論","t":"臨床","th":"尿崩症の脱水","s":"35歳の男性。多尿と激しい口渇がある。尿崩症と診断された。この患者の脱水の型として考えられるのはどれか。","o":["等張性（混合）脱水","低張性（ナトリウム欠乏）脱水","高張性（水欠乏）脱水","水の過剰による希釈","体液量が正常な状態"],"a":2,"e":"尿崩症では水が失われ、高張性（水欠乏）脱水になります。","w":["等張性脱水は、水とナトリウムが同じ割合で失われる脱水です。","低張性脱水は、ナトリウムが水より多く失われる脱水です。","","水が失われる病態で、水の過剰にはなりません。","多尿と口渇があり、体液量は正常ではありません。"],"k":-1,"p":1},{"n":187,"b":"総論","t":"臨床","th":"有機リン中毒の治療","s":"50歳の男性。農薬を飲んで搬入された。縮瞳、流涎、気管支分泌の増加、筋の線維束性収縮がある。有効な薬剤はどれか。","o":["アセチルシステイン","プロタミン","ビタミンK","アトロピン","フルマゼニル"],"a":3,"e":"有機リン中毒には、アトロピンとPAMを用います。","w":["アセチルシステインは、アセトアミノフェン中毒の解毒薬です。","プロタミンは、ヘパリンの拮抗薬です。","ビタミンKは、ワルファリンの拮抗に用います。","","フルマゼニルは、有機リン中毒の解毒薬ではありません。"],"k":-1,"p":1},{"n":188,"b":"総論","t":"臨床","th":"保因者の母の息子","s":"血友病Aの保因者である28歳の女性が、男児を妊娠した。この男児が血友病Aを発症する確率はどれか。","o":["50%","0%","25%","75%","100%"],"a":0,"e":"X連鎖劣性遺伝で、保因者の母から息子へは、50%の確率で伝わります。","w":["","0%は、母が保因者でない場合の確率です。","25%は、確率が低すぎます。","75%は、確率が高すぎます。","100%は、母が患者の場合の確率です。"],"k":-1,"p":1},{"n":189,"b":"総論","t":"臨床","th":"播種性転移","s":"62歳の男性。胃癌が漿膜を越えて広がり、腹腔内に癌細胞が散らばった。この転移の経路はどれか。","o":["リンパ行性転移","播種","血行性転移","神経周囲転移","経気道転移"],"a":1,"e":"体腔内に癌細胞が散らばる転移の経路は、播種です。","w":["リンパ行性転移は、リンパ管を介してリンパ節へ広がります。","","血行性転移は、血流を介して遠隔の臓器へ広がります。","神経周囲転移は、腹腔内に散らばる経路ではありません。","経気道転移は、腹腔内に散らばる経路ではありません。"],"k":-1,"p":1},{"n":190,"b":"総論","t":"臨床","th":"日和見感染","s":"55歳の男性。白血病で化学療法中に、好中球が著しく減った。健康な人には病気を起こさない常在菌で、肺炎を起こした。この感染を何というか。","o":["母子感染","経口感染","空気感染","接触感染","日和見感染"],"a":4,"e":"宿主の抵抗力が弱いと、普通は病気を起こさない菌でも発病します。これを日和見感染といいます。","w":["母子感染は、母から子へ伝わる感染経路です。","経口感染は、飲食物を介する感染経路です。","空気感染は、飛沫核による感染経路です。","接触感染は、皮膚や物を介する感染経路です。",""],"k":-1,"p":1},{"n":191,"b":"総論","t":"一般","th":"浮腫の診察","s":"浮腫の診察で、まず確認する所見はどれか。","o":["皮膚の色が、赤いか","指で押して、圧痕が残るか","皮膚の温度が、高いか","皮膚に、発疹があるか","毛が、薄くなっているか"],"a":1,"e":"浮腫の診察では、押すとへこむ（圧痕を残す）かを確認します。全身性か局所性かの判断につながります。","w":["皮膚の赤みは炎症の所見で、浮腫の確認の第一ではありません。","","皮膚の温度は炎症の評価に使い、浮腫の確認の第一ではありません。","発疹は皮膚疾患の所見で、浮腫の確認の第一ではありません。","毛の状態は、浮腫の診察で最初に見る所見ではありません。"],"k":-1,"p":1},{"n":192,"b":"総論","t":"一般","th":"肺塞栓症の検査","s":"肺塞栓症で上昇する血液検査の項目はどれか。","o":["Dダイマー","トロポニン","アミラーゼ","AST","ビリルビン"],"a":0,"e":"肺塞栓症では、血栓が溶ける際に生じるDダイマーが上昇します。頻脈や低酸素血症と合わせて判断します。","w":["","トロポニンは、心筋の障害で上昇する項目です。","アミラーゼは、膵炎で上昇する項目です。","ASTは、主に肝細胞の障害で上昇する項目です。","ビリルビンは、黄疸で上昇する項目です。"],"k":-1,"p":1},{"n":193,"b":"総論","t":"一般","th":"末梢性めまいの疾患","s":"末梢性のめまいを起こす疾患はどれか。","o":["小脳梗塞","脳幹出血","メニエール病","小脳出血","椎骨動脈の解離"],"a":2,"e":"メニエール病は、内耳の障害による末梢性のめまいで、難聴と耳鳴を伴うことがあります。","w":["小脳梗塞は、中枢性のめまいの原因です。","脳幹出血は、中枢性のめまいの原因です。","","小脳出血は、中枢性のめまいの原因です。","椎骨動脈の解離は、脳幹や小脳の虚血を通じて中枢性のめまいを起こします。"],"k":-1,"p":1},{"n":194,"b":"総論","t":"一般","th":"口腔咽頭性嚥下障害の原因","s":"口腔咽頭性嚥下障害の原因となるのはどれか。","o":["食道がん","アカラシア","逆流性食道炎による狭窄","脳卒中","食道の良性腫瘍"],"a":3,"e":"口腔咽頭性嚥下障害は、脳卒中、神経筋疾患、咽頭の腫瘍などで起こります。","w":["食道がんは、食道性嚥下障害の原因です。","アカラシアは、食道性嚥下障害の原因です。","逆流性食道炎による狭窄は、食道性嚥下障害の原因です。","","食道の腫瘍は、食道性嚥下障害の原因です。"],"k":-1,"p":1},{"n":195,"b":"総論","t":"一般","th":"栄養の評価尺度","s":"高齢者総合機能評価（CGA）で、栄養の評価に使う尺度はどれか。","o":["GDS","MMSE","バーセルインデックス","ロートンの尺度","MNA"],"a":4,"e":"CGAでは、栄養の評価にMNAを使います。体重の変化や食事量を見ます。","w":["GDSは、気分（抑うつ）の評価に使う尺度です。","MMSEは、認知機能の評価に使う尺度です。","バーセルインデックスは、日常生活動作（ADL）の評価に使う尺度です。","ロートンの尺度は、手段的日常生活動作（IADL）の評価に使う尺度です。",""],"k":-1,"p":1},{"n":196,"b":"総論","t":"一般","th":"中枢性めまいの疾患","s":"中枢性のめまいを起こす疾患はどれか。","o":["メニエール病","小脳出血","良性発作性頭位めまい症","前庭神経炎","中耳炎による内耳障害"],"a":1,"e":"小脳や脳幹の出血と梗塞は、中枢性のめまいの原因です。","w":["メニエール病は、内耳の障害による末梢性のめまいです。","","良性発作性頭位めまい症は、末梢性のめまいです。","前庭神経炎は、内耳の神経の障害による末梢性のめまいです。","内耳の障害によるめまいは、末梢性のめまいです。"],"k":-1,"p":1},{"n":197,"b":"総論","t":"一般","th":"新生児の心拍数","s":"新生児の心拍数の目安はどれか。","o":["80から120回/分","100から150回/分","70から100回/分","160から200回/分","120から160回/分"],"a":4,"e":"新生児の心拍数は、120から160回/分が目安です。年齢が低いほど多くなります。","w":["80から120回/分は、幼児の目安です。","100から150回/分は、乳児の目安です。","70から100回/分は、学童の目安です。","160から200回/分は、新生児でも多すぎる値です。",""],"k":-1,"p":1},{"n":198,"b":"総論","t":"一般","th":"乳児の呼吸数","s":"乳児の呼吸数の目安はどれか。","o":["40から60回/分","20から30回/分","15から25回/分","30から50回/分","10から15回/分"],"a":3,"e":"乳児の呼吸数は、30から50回/分が目安です。","w":["40から60回/分は、新生児の目安です。","20から30回/分は、幼児の目安です。","15から25回/分は、学童の目安です。","","10から15回/分は、乳児では少なすぎる値です。"],"k":-1,"p":1},{"n":199,"b":"総論","t":"一般","th":"幼児の心拍数","s":"幼児の心拍数の目安はどれか。","o":["120から160回/分","100から150回/分","80から120回/分","70から100回/分","50から70回/分"],"a":2,"e":"幼児の心拍数は、80から120回/分が目安です。","w":["120から160回/分は、新生児の目安です。","100から150回/分は、乳児の目安です。","","70から100回/分は、学童の目安です。","50から70回/分は、幼児では少なすぎる値です。"],"k":-1,"p":1},{"n":200,"b":"総論","t":"一般","th":"学童の呼吸数","s":"学童の呼吸数の目安はどれか。","o":["15から25回/分","20から30回/分","30から50回/分","40から60回/分","5から10回/分"],"a":0,"e":"学童の呼吸数は、15から25回/分が目安で、成人に近づきます。","w":["","20から30回/分は、幼児の目安です。","30から50回/分は、乳児の目安です。","40から60回/分は、新生児の目安です。","5から10回/分は、学童では少なすぎる値です。"],"k":-1,"p":1},{"n":201,"b":"総論","t":"一般","th":"新生児の呼吸様式","s":"新生児の呼吸の特徴はどれか。","o":["腹式呼吸が中心である","胸式呼吸が中心である","呼吸数は成人より少ない","呼吸数は15から25回/分である","努力呼吸が正常である"],"a":0,"e":"新生児は腹式呼吸が中心で、呼吸数は40から60回/分と成人より多くなります。","w":["","胸式呼吸が中心になるのは、成長してからです。","新生児の呼吸数は、成人より多くなります。","15から25回/分は、学童の目安です。","努力呼吸は、呼吸障害を疑う所見です。"],"k":-1,"p":1},{"n":202,"b":"総論","t":"一般","th":"保護者からの聴取","s":"小児の診察で、保護者から聞く項目として適切なのはどれか。","o":["母親の学歴と収入","周産期の経過と予防接種","父親の職歴と勤続年数","祖父母の出身地と宗教","兄弟の成績と習い事"],"a":1,"e":"小児では、周産期の経過、哺乳の状況、予防接種、発達の経過を保護者から聞きます。","w":["学歴や収入は、診察で優先して聞く項目ではありません。","","父親の職歴は、診察で優先して聞く項目ではありません。","祖父母の出身地や宗教は、診察で優先して聞く項目ではありません。","兄弟の成績や習い事は、診察で優先して聞く項目ではありません。"],"k":-1,"p":1},{"n":203,"b":"総論","t":"一般","th":"IADLの尺度","s":"手段的日常生活動作（IADL）の評価に使う尺度はどれか。","o":["バーセルインデックス","カッツ指数","MMSE","GDS","ロートンの尺度"],"a":4,"e":"IADLの評価には、ロートンの尺度を使います。買い物、金銭管理、服薬管理、電話などを見ます。","w":["バーセルインデックスは、ADLの尺度です。","カッツ指数は、ADLの尺度です。","MMSEは、認知機能の尺度です。","GDSは、気分（抑うつ）の尺度です。",""],"k":-1,"p":1},{"n":204,"b":"総論","t":"一般","th":"妊婦健診の間隔（前期）","s":"妊婦健康診査の間隔で、妊娠23週までの目安はどれか。","o":["1週に1回","2週に1回","6週に1回","4週に1回","8週に1回"],"a":3,"e":"妊婦健康診査は、妊娠23週までは4週に1回が目安です。","w":["週に1回は、妊娠36週以降の目安です。","2週に1回は、妊娠24から35週の目安です。","6週に1回は、標準の間隔より長すぎます。","","8週に1回は、標準の間隔より長すぎます。"],"k":-1,"p":1},{"n":205,"b":"総論","t":"一般","th":"食事と関係する胸痛","s":"胸痛の鑑別で、食事と関係して起こる痛みのとき、考える部位はどれか。","o":["心臓","胸膜","食道・胃","大動脈","肺動脈"],"a":2,"e":"食事と関係する胸痛では、食道や胃の疾患を考えます。","w":["心臓の痛みは、締めつけられる痛みで、食事とは関係しにくいです。","胸膜の痛みは、呼吸や咳で強まります。","","大動脈の痛みは、突然の引き裂かれる痛みです。","肺動脈の閉塞では、突然の呼吸困難と胸痛が出ます。"],"k":-1,"p":1},{"n":206,"b":"総論","t":"一般","th":"救急の診察の順序","s":"二次・三次救急の診察の順序は、何に従うか。","o":["SOAP","SBAR","ABCDE","PDCA","TNM"],"a":2,"e":"救急の診察は、気道、呼吸、循環、中枢神経、体温の順に評価するABCDEに従います。","w":["SOAPは、診療記録の書き方です。","SBARは、情報を伝達する形式です。","","PDCAは、業務改善の手順です。","TNMは、がんの進行度の分類です。"],"k":-1,"p":1},{"n":207,"b":"総論","t":"一般","th":"腹痛の分類","s":"腹痛を3つに分けるとき、正しい組合せはどれか。","o":["急性痛、慢性痛、心因痛","内臓痛、体性痛、関連痛","局所痛、全身痛、放散痛","鈍痛、鋭痛、拍動痛","一次痛、二次痛、三次痛"],"a":1,"e":"腹痛は、内臓痛、体性痛、関連痛の3つに分けて考えます。","w":["急性痛と慢性痛は、経過による分け方で、腹痛の3分類ではありません。","","局所痛と全身痛は、腹痛の3分類ではありません。","鈍痛や鋭痛は痛みの性状で、腹痛の3分類ではありません。","一次痛と二次痛は、腹痛の3分類ではありません。"],"k":-1,"p":1},{"n":208,"b":"総論","t":"一般","th":"虐待を疑う所見","s":"小児の身体所見で、虐待を疑うのはどれか。","o":["外傷の原因の説明が一貫している","外傷の後、すぐに受診している","予防接種を済ませている","年齢に合わない外傷","成長曲線に沿って育っている"],"a":3,"e":"説明のつかない外傷、年齢に合わない外傷、受診の遅れは、虐待を疑う所見です。","w":["説明が一貫して外傷と合うなら、虐待を疑う根拠にはなりません。","すぐに受診していれば、受診の遅れはありません。","予防接種の完了は、虐待を疑う所見ではありません。","","成長曲線に沿った成長は、虐待を疑う所見ではありません。"],"k":-1,"p":1},{"n":209,"b":"総論","t":"臨床","th":"リンパ浮腫","s":"58歳の女性。乳がんの手術でリンパ節を郭清した後、右上肢が腫れてきた。左上肢は正常である。この浮腫の原因として最も考えられるのはどれか。","o":["リンパ浮腫","心不全","ネフローゼ症候群","肝硬変","低栄養"],"a":0,"e":"リンパ節の郭清後の片側上肢の腫れは、局所性のリンパ浮腫を考えます。","w":["","心不全の浮腫は全身性で、片側だけに出ません。","ネフローゼ症候群の浮腫は全身性です。","肝硬変の浮腫は全身性です。","低栄養による浮腫は全身性です。"],"k":-1,"p":1},{"n":210,"b":"総論","t":"臨床","th":"生命に関わる胸痛","s":"60歳の男性。突然の胸痛と冷や汗があり、意識がもうろうとしている。血圧は70/40mmHgである。この時点で同時に考える疾患の組合せはどれか。","o":["逆流性食道炎、肋間神経痛、帯状疱疹、筋肉痛","胃潰瘍、胆石症、膵炎、虫垂炎","肺炎、胸膜炎、気管支炎、肺結核","心筋炎、心膜炎、心内膜炎、心筋症","急性冠症候群、大動脈解離、肺塞栓症、緊張性気胸"],"a":4,"e":"ショックや意識障害を伴う胸痛では、生命に関わる4つの疾患を同時に考えます。","w":["これらは、生命の危険が比較的低い胸痛の原因です。","これらは、主に腹部の疾患です。","これらは、ショックを伴いにくい呼吸器の疾患です。","これらは、4つの緊急疾患の組合せではありません。",""],"k":-1,"p":1},{"n":211,"b":"総論","t":"臨床","th":"メニエール病","s":"45歳の女性。回転性のめまいを繰り返し、難聴と耳鳴を伴う。神経症状はなく、眼振は水平回旋性で、注視で抑えられる。最も考えられるのはどれか。","o":["小脳梗塞","脳幹出血","メニエール病","良性発作性頭位めまい症","脳腫瘍"],"a":2,"e":"難聴と耳鳴を伴い、神経症状のない末梢性のめまいは、メニエール病を考えます。","w":["小脳梗塞は、神経症状を伴う中枢性のめまいです。","脳幹出血は、麻痺などを伴う中枢性のめまいです。","","良性発作性頭位めまい症は、難聴や耳鳴を伴いません。","脳腫瘍は、神経症状を伴う中枢性のめまいの原因です。"],"k":-1,"p":1},{"n":212,"b":"総論","t":"臨床","th":"CGAの社会・環境","s":"82歳の女性。夫と死別して一人暮らしである。同居の家族も介護者もいない。階段の多い古い家に住み、年金だけで生活している。高齢者総合機能評価（CGA）で、この状況を評価する領域はどれか。","o":["日常生活動作（ADL）","社会・環境","手段的日常生活動作（IADL）","認知機能","栄養"],"a":1,"e":"家族、介護者、住まい、経済は、CGAの社会・環境の領域で、面接で評価します。","w":["ADLは、食事、入浴、着替えなどの動作の評価です。","","IADLは、買い物、金銭管理などの評価です。","認知機能は、記憶や見当識の評価です。","栄養は、体重の変化や食事量の評価です。"],"k":-1,"p":1},{"n":213,"b":"総論","t":"臨床","th":"乳児のバイタルサイン","s":"生後10か月の乳児。軽い鼻汁で受診した。心拍数は120回/分、呼吸数は40回/分で、元気である。このバイタルサインの評価として正しいのはどれか。","o":["心拍数が多く、頻脈である","呼吸数が多く、頻呼吸である","心拍数が少なく、徐脈である","心拍数も呼吸数も正常範囲である","呼吸数が少なく、徐呼吸である"],"a":3,"e":"乳児の目安は、心拍数が100から150回/分、呼吸数が30から50回/分で、どちらも正常範囲です。","w":["120回/分は、乳児の心拍数の目安に入ります。","40回/分は、乳児の呼吸数の目安に入ります。","120回/分は、徐脈ではありません。","","40回/分は、徐呼吸ではありません。"],"k":-1,"p":1},{"n":214,"b":"総論","t":"臨床","th":"長引く黄疸","s":"生後3週の新生児。皮膚の黄染が、2週間以上続いている。哺乳は良好で、元気である。この黄疸の評価として適切なのはどれか。","o":["病的黄疸を疑い、原因を調べる","生理的黄疸で、経過をみればよい","生後2から3日の典型的な黄疸である","出生時から続く正常な所見である","光線療法が禁忌の黄疸である"],"a":0,"e":"長引く黄疸は、病的な黄疸を疑います。生理的黄疸は生後2から3日に現れます。","w":["","生理的黄疸は生後早期に現れ、数週間続きません。","生後3週は、生後2から3日の時期ではありません。","黄疸は出生時から続く正常な所見ではありません。","光線療法が禁忌という根拠はありません。"],"k":-1,"p":1},{"n":215,"b":"総論","t":"臨床","th":"新生児の評価","s":"在胎38週で出生した新生児。出生直後の全身状態を、点数で評価する。用いる方法はどれか。","o":["成長曲線","グラスゴー・コーマ・スケール","バーセルインデックス","カッツ指数","アプガースコア"],"a":4,"e":"新生児は、出生後すぐにアプガースコアで評価します。","w":["成長曲線は、小児の成長を評価する方法です。","グラスゴー・コーマ・スケールは、意識レベルの評価です。","バーセルインデックスは、高齢者のADLの評価です。","カッツ指数は、高齢者のADLの評価です。",""],"k":-1,"p":1},{"n":216,"b":"総論","t":"臨床","th":"せん妄","s":"80歳の男性。肺炎で入院して3日目の夜に、急に興奮し、つじつまの合わない話をした。日中は落ち着いており、意識の程度が変動している。見逃してはならない病態はどれか。","o":["アルツハイマー型認知症","老年期うつ病","せん妄","良性発作性頭位めまい症","廃用症候群"],"a":2,"e":"高齢者では、入院などをきっかけに、意識が変動するせん妄が起こります。","w":["アルツハイマー型認知症は、ゆっくり進行し、短期間で変動しません。","老年期うつ病は、抑うつ気分が中心です。","","良性発作性頭位めまい症は、頭位で起こる回転性めまいです。","廃用症候群は、筋萎縮や関節拘縮などの病態です。"],"k":-1,"p":1},{"n":217,"b":"総論","t":"臨床","th":"妊婦健診の間隔（後期）","s":"妊娠38週の妊婦。標準的な妊婦健康診査では、次の健診は、いつ行うか。","o":["2週間後","1週間後","4週間後","6週間後","8週間後"],"a":1,"e":"妊婦健康診査は、妊娠36週以降は週に1回が目安です。","w":["2週に1回は、妊娠24から35週の目安です。","","4週に1回は、妊娠23週までの目安です。","6週間後は、標準の間隔より長すぎます。","8週間後は、標準の間隔より長すぎます。"],"k":-1,"p":1},{"n":218,"b":"総論","t":"臨床","th":"救急の診察の順序","s":"45歳の男性。交通事故で搬送された。意識は低下し、呼吸は不規則である。診察の順序として、最初に行うのはどれか。","o":["詳しい病歴の聴取","全身のCT撮影","家族への病状の説明","気道と呼吸の評価","既往歴の確認"],"a":3,"e":"救急の診察は、生命に関わる状態を先に評価します。ABCDEの最初は気道と呼吸です。","w":["詳しい病歴の聴取は、生命の危機に対応した後に行います。","CT撮影は、気道と呼吸の確保を済ませた後に検討します。","家族への説明は、生命の危機に対応した後に行います。","","既往歴の確認は、生命の危機に対応した後に行います。"],"k":-1,"p":1},{"n":219,"b":"総論","t":"一般","th":"上肢の面積","s":"成人の熱傷面積の9の法則で、片方の上肢は何%か。","o":["1%","18%","27%","36%","9%"],"a":4,"e":"9の法則では、上肢は片方が9%です。","w":["1%は、会陰部の値です。","18%は、体幹の前面や片側の下肢の値です。","27%は、9の法則の区分にありません。","36%は、9の法則では両側の下肢の合計に近い値です。",""],"k":-1,"p":1},{"n":220,"b":"総論","t":"一般","th":"確率的影響の例","s":"放射線の確率的影響の例はどれか。","o":["発がん","脱毛","白内障","不妊","皮膚の紅斑"],"a":0,"e":"発がんと遺伝的影響は、しきい値がなく、線量が増えると起こる確率が増える確率的影響です。","w":["","脱毛は、しきい値のある確定的影響です。","白内障は、しきい値のある確定的影響です。","不妊は、しきい値のある確定的影響です。","皮膚の紅斑は、しきい値のある確定的影響です。"],"k":-1,"p":1},{"n":221,"b":"総論","t":"一般","th":"固形物の絶飲食","s":"全身麻酔の手術を受ける成人で、固形物の摂取は、麻酔の何時間前までが目安か。","o":["2時間前","4時間前","8時間前","6時間前","12時間前"],"a":3,"e":"日本麻酔科学会の指針では、固形物と人工乳は6時間前までが目安です。","w":["2時間前は、清澄水の目安です。","4時間前は、母乳の目安です。","8時間前は、指針の目安より長い時間です。","","12時間前は、指針の目安より長い時間です。"],"k":-1,"p":1},{"n":222,"b":"総論","t":"一般","th":"拒絶反応の分類","s":"移植後の拒絶反応を、起こる時期で分けるとき、正しい組合せはどれか。","o":["即時型、遅延型、潜伏型","超急性、急性、慢性","一過性、反復性、持続性","早期、中期、後期","初期、亜急性、末期"],"a":1,"e":"拒絶反応は、起こる時期で、超急性、急性、慢性に分けます。","w":["即時型と遅延型は、アレルギーの分け方です。","","一過性と反復性は、拒絶反応の時期による分類ではありません。","早期、中期、後期は、拒絶反応の分類ではありません。","亜急性や末期は、拒絶反応の分類ではありません。"],"k":-1,"p":1},{"n":223,"b":"総論","t":"一般","th":"晩期の副作用","s":"放射線治療の晩期の副作用が出る時期はどれか。","o":["治療の数か月から数年後","照射の直後から数時間","治療開始から1週間","治療中の数日間","治療終了から1か月以内"],"a":0,"e":"晩期の副作用は、治療の数か月から数年後に出ます。","w":["","照射の直後は、急性期の副作用の時期です。","治療開始から1週間は、急性期にあたります。","治療中は、急性期の副作用の時期です。","治療終了から1か月以内は、晩期より早い時期です。"],"k":-1,"p":1},{"n":224,"b":"総論","t":"一般","th":"9の法則の会陰部","s":"成人の熱傷面積の9の法則で、会陰部は何%か。","o":["2%","5%","9%","18%","1%"],"a":4,"e":"9の法則では、会陰部は1%です。","w":["2%は、9の法則の区分にありません。","5%は、9の法則の区分にありません。","9%は、頭頸部や片側の上肢の値です。","18%は、体幹の前面や片側の下肢の値です。",""],"k":-1,"p":1},{"n":225,"b":"総論","t":"一般","th":"ガドリニウム造影剤","s":"ガドリニウム造影剤を使う検査はどれか。","o":["造影CT","血管造影","造影MRI","消化管のX線検査","PET"],"a":2,"e":"ガドリニウム造影剤は、造影MRIで使います。","w":["造影CTには、ヨード造影剤を使います。","血管造影には、ヨード造影剤を使います。","","消化管のX線検査には、バリウムを使います。","PETには、FDGなどの放射性医薬品を使います。"],"k":-1,"p":1},{"n":226,"b":"総論","t":"一般","th":"核医学検査","s":"核医学検査の説明として正しいのはどれか。","o":["体の外から放射線を当てて、病変を小さくする","磁場を使って、体の断面を撮影する","放射性医薬品を体に入れ、分布を調べる","超音波を当てて、反射を調べる","内視鏡で、粘膜を直接観察する"],"a":2,"e":"核医学検査は、放射性医薬品を体に入れ、その分布を調べる検査です。","w":["体の外から放射線を当てて病変を小さくするのは、放射線治療です。","磁場を使う検査は、MRIです。","","超音波を使う検査は、超音波検査です。","粘膜を直接観察する検査は、内視鏡検査です。"],"k":-1,"p":1},{"n":227,"b":"総論","t":"一般","th":"輸液の目的","s":"輸液の主な目的はどれか。","o":["免疫反応を抑える","血液型を適合させる","胃腸の動きを止める","血小板を増やす","体液の欠乏と電解質を補う"],"a":4,"e":"輸液は、体液の欠乏と電解質を補うために行います。","w":["免疫反応を抑えるのは、免疫抑制薬です。","血液型の適合は、輸血で確認します。","胃腸の動きを止めることは、輸液の目的ではありません。","血小板を増やすのは、血小板製剤の役割です。",""],"k":-1,"p":1},{"n":228,"b":"総論","t":"一般","th":"培養の目的","s":"細菌検査で、培養を行う主な目的はどれか。","o":["菌を紫と赤に分ける","菌を同定する","遺伝子を増やして検出する","効く抗菌薬の血中濃度を測る","組織の悪性度を判定する"],"a":1,"e":"培養では、菌を増やして同定します。効く抗菌薬は、薬剤感受性検査で調べます。","w":["紫と赤に分けるのは、グラム染色です。","","遺伝子を増やして検出するのは、PCR検査です。","抗菌薬の血中濃度は、培養では測りません。","組織の悪性度は、病理検査で判定します。"],"k":-1,"p":1},{"n":229,"b":"総論","t":"一般","th":"内分泌機能の検査","s":"内分泌機能の検査で、ホルモンの血中濃度の測定に加えて行うのはどれか。","o":["負荷試験","神経伝導検査","迅速診断","核型分析","呼吸機能検査"],"a":0,"e":"内分泌機能は、ホルモンの血中濃度に加えて、負荷試験で評価します。","w":["","神経伝導検査は、神経機能の検査です。","迅速診断は、手術中に行う病理検査です。","核型分析は、染色体の検査です。","呼吸機能検査は、スパイロメトリーで行います。"],"k":-1,"p":1},{"n":230,"b":"総論","t":"一般","th":"術後の合併症","s":"術後の合併症に含まれないのはどれか。","o":["無気肺","イレウス","肺塞栓症","腎性全身性線維症","深部静脈血栓症"],"a":3,"e":"腎性全身性線維症は、ガドリニウム造影剤の合併症で、術後の合併症ではありません。","w":["無気肺は、術後の合併症です。","イレウスは、術後の合併症です。","肺塞栓症は、術後の合併症です。","","深部静脈血栓症は、術後の合併症です。"],"k":-1,"p":1},{"n":231,"b":"総論","t":"一般","th":"熱傷の輸液量","s":"熱傷の大量輸液で、輸液量の計算に使う指標の組合せはどれか。","o":["身長と年齢","血圧と脈拍","体温と呼吸数","性別と年齢","体重と熱傷面積"],"a":4,"e":"熱傷の輸液量は、体重と熱傷面積から計算します。","w":["身長と年齢は、輸液量の計算に使いません。","血圧と脈拍は、輸液の効果の観察に使います。","体温と呼吸数は、輸液量の計算に使いません。","性別と年齢は、輸液量の計算に使いません。",""],"k":-1,"p":1},{"n":232,"b":"総論","t":"一般","th":"IVRの治療","s":"IVRに含まれる治療はどれか。","o":["体外からの放射線照射","全身麻酔下の開腹手術","骨髄移植","血管塞栓","高気圧酸素療法"],"a":3,"e":"IVRは、カテーテルなどで行う治療で、血管塞栓やドレナージがあります。","w":["体外からの照射は、外部照射です。","開腹手術は、IVRではありません。","骨髄移植は、IVRではありません。","","高気圧酸素療法は、IVRではありません。"],"k":-1,"p":1},{"n":233,"b":"総論","t":"一般","th":"緩和ケアの中心","s":"緩和ケアで中心となる治療はどれか。","o":["感染症の治療","痛みの治療","病変の切除","臓器の移植","免疫の抑制"],"a":1,"e":"緩和ケアでは、痛みの治療が中心です。WHOの3段階除痛ラダーで薬を選びます。","w":["感染症の治療は、緩和ケアの中心ではありません。","","病変の切除は、緩和ケアの中心ではありません。","臓器の移植は、緩和ケアの中心ではありません。","免疫の抑制は、緩和ケアの中心ではありません。"],"k":-1,"p":1},{"n":234,"b":"総論","t":"一般","th":"絶飲食の目的","s":"手術の前に絶飲食を守る主な目的はどれか。","o":["誤嚥を防ぐ","出血を減らす","創の感染を防ぐ","血栓を防ぐ","術後の痛みを減らす"],"a":0,"e":"手術の前の絶飲食は、麻酔中の誤嚥を防ぐために守ります。","w":["","出血の量は、絶飲食では変わりません。","創の感染は、絶飲食では防げません。","血栓の予防は、絶飲食の目的ではありません。","術後の痛みは、絶飲食では減りません。"],"k":-1,"p":1},{"n":235,"b":"総論","t":"一般","th":"リハビリの目標","s":"リハビリテーションが目指すものはどれか。","o":["安静の維持","病変の切除","機能の回復と社会参加","薬の増量","検査の頻回な実施"],"a":2,"e":"リハビリテーションは、機能の回復と社会参加を目指します。","w":["安静を続けると、廃用症候群が起こります。","病変の切除は、手術の目的です。","","薬の増量は、リハビリテーションの目的ではありません。","検査の頻回な実施は、リハビリテーションの目的ではありません。"],"k":-1,"p":1},{"n":236,"b":"総論","t":"一般","th":"廃用症候群","s":"廃用症候群に含まれる病態の組合せはどれか。","o":["筋肥大、関節の可動域拡大、食欲亢進","脱毛、白内障、不妊","発熱、蕁麻疹、アナフィラキシー","発がん、遺伝的影響、突然変異","筋萎縮、関節拘縮、褥瘡"],"a":4,"e":"廃用症候群は、安静を続けて起こる、筋萎縮、関節拘縮、褥瘡などです。","w":["安静を続けると、筋肉は萎縮し、可動域は狭くなります。","脱毛、白内障、不妊は、放射線の確定的影響です。","発熱、蕁麻疹、アナフィラキシーは、輸血の副作用です。","発がんと遺伝的影響は、放射線の確率的影響です。",""],"k":-1,"p":1},{"n":237,"b":"総論","t":"一般","th":"経腸栄養の方法","s":"経腸栄養の方法として挙げられるのはどれか。","o":["胃ろう","中心静脈栄養","末梢静脈栄養","血液透析","腹膜透析"],"a":0,"e":"経腸栄養には、胃管や胃ろうなどがあります。","w":["","中心静脈栄養は、静脈栄養です。","末梢静脈栄養は、静脈栄養です。","血液透析は、血液浄化の方法です。","腹膜透析は、血液浄化の方法です。"],"k":-1,"p":1},{"n":238,"b":"総論","t":"一般","th":"バリウムの用途","s":"バリウムを用いる検査はどれか。","o":["造影MRI","血管造影","核医学検査","消化管のX線検査","脳波検査"],"a":3,"e":"バリウムは、消化管のX線検査で使います。","w":["造影MRIには、ガドリニウム造影剤を使います。","血管造影には、ヨード造影剤を使います。","核医学検査には、放射性医薬品を使います。","","脳波検査では、造影剤を使いません。"],"k":-1,"p":1},{"n":239,"b":"総論","t":"臨床","th":"PET","s":"62歳の男性。肺がんと診断された。ブドウ糖に似た薬の集積を見て、全身の腫瘍を探したい。適切な検査はどれか。","o":["造影MRI","消化管のX線検査","PET","スパイロメトリー","気管支鏡"],"a":2,"e":"PETは、FDG（ブドウ糖に似た薬）の集積で、腫瘍や炎症を探します。","w":["造影MRIは、磁場を使い、ガドリニウム造影剤を用います。","消化管のX線検査は、バリウムを使い、消化管を調べます。","","スパイロメトリーは、呼吸機能の検査です。","気管支鏡は、気道の粘膜の観察と生検を行います。"],"k":-1,"p":1},{"n":240,"b":"総論","t":"臨床","th":"造影剤と甲状腺","s":"38歳の女性。バセドウ病で、甲状腺機能亢進症が未治療である。ヨード造影剤を使った造影CTを予定している。最も注意すべき点はどれか。","o":["腎性全身性線維症","甲状腺機能亢進症の悪化","バリウムによる腹膜炎","乳酸アシドーシス","高カリウム血症"],"a":1,"e":"ヨード造影剤は、甲状腺機能亢進症の患者では注意が必要です。","w":["腎性全身性線維症は、ガドリニウム造影剤の合併症です。","","バリウムによる腹膜炎は、消化管の穿孔のときの問題です。","乳酸アシドーシスは、ビグアナイド系薬との併用で注意します。","高カリウム血症は、ヨード造影剤の主な注意点ではありません。"],"k":-1,"p":1},{"n":241,"b":"総論","t":"臨床","th":"拘束性換気障害","s":"68歳の男性。乾いた咳と、労作時の息切れがある。スパイロメトリーで、1秒率は82%、%肺活量は62%であった。この換気障害はどれか。","o":["拘束性換気障害","閉塞性換気障害","混合性換気障害","換気障害はない","上気道の狭窄"],"a":0,"e":"%肺活量が80%未満で、1秒率が保たれていれば、拘束性換気障害です。","w":["","閉塞性換気障害は、1秒率が70%未満になります。","混合性換気障害は、両方が低下します。","%肺活量が62%で、基準を下回っています。","上気道の狭窄は、この所見の分類ではありません。"],"k":-1,"p":1},{"n":242,"b":"総論","t":"臨床","th":"肝機能低下時の薬","s":"78歳の女性。肝機能が低下している。肝臓で代謝される薬を新たに処方する。対応として適切なのはどれか。","o":["成人の通常量を、そのまま投与する","効きが弱いため、量を倍にする","血中濃度の確認を、すべて省く","量を調整し、使えない薬を確認する","併用薬を、確認せずに追加する"],"a":3,"e":"肝機能や腎機能が低下した患者では、量を調整し、使えない薬を確認します。","w":["通常量のままでは、薬が体内に残り、副作用が出やすくなります。","量を倍にすると、中毒の危険が高まります。","必要な薬では、血中濃度の確認が役立ちます。","","併用薬の確認を省くと、相互作用を見逃します。"],"k":-1,"p":1},{"n":243,"b":"総論","t":"臨床","th":"赤血球製剤の適応","s":"70歳の女性。ヘモグロビン5.8g/dLの貧血があり、息切れと動悸が強い。血液製剤の選択として適切なのはどれか。","o":["血小板製剤","新鮮凍結血漿","生理食塩液のみの点滴","抗ヒスタミン薬の投与","赤血球製剤"],"a":4,"e":"貧血で症状や酸素運搬の障害が強いときは、赤血球製剤を使います。","w":["血小板製剤は、血小板の著しい減少と出血に使います。","新鮮凍結血漿は、凝固因子の欠乏と出血に使います。","生理食塩液では、酸素の運搬が改善しません。","抗ヒスタミン薬は、アレルギー反応に使う薬です。",""],"k":-1,"p":1},{"n":244,"b":"総論","t":"臨床","th":"術後イレウス","s":"72歳の女性。腹部の手術の3日後から、腹部膨満と嘔吐があり、排ガスがない。腹部は鼓音である。最も考えられる術後合併症はどれか。","o":["手術部位感染","イレウス","深部静脈血栓症","無気肺","肺塞栓症"],"a":1,"e":"術後の腹部膨満、嘔吐、排ガスの停止は、イレウスを考えます。","w":["手術部位感染は、創の発赤や膿が主な所見です。","","深部静脈血栓症は、下肢の腫れが主な所見です。","無気肺は、発熱や呼吸困難が主な所見です。","肺塞栓症は、突然の呼吸困難と胸痛が主な所見です。"],"k":-1,"p":1},{"n":245,"b":"総論","t":"臨床","th":"熱傷の面積","s":"30歳の男性。火災で、体幹の背面と、左右の下肢の全周に熱傷を負った。9の法則による熱傷面積はどれか。","o":["36%","45%","54%","63%","72%"],"a":2,"e":"体幹の背面が18%、下肢が片方18%で、18+36=54%です。","w":["36%は、背面と下肢の片方の合計です。","45%は、9の法則の計算に合いません。","","63%は、9の法則の計算に合いません。","72%は、9の法則の計算に合いません。"],"k":-1,"p":1},{"n":246,"b":"総論","t":"臨床","th":"レスキュー薬","s":"65歳の男性。進行がんで、モルヒネを定期的に投与されている。普段は痛みが抑えられているが、突然、強い痛みが出た。対応として適切なのはどれか。","o":["定期のモルヒネを、すべて中止する","レスキュー薬を追加で投与する","非オピオイドのみに変更する","次の定期投与まで、待つ","鎮痛薬を使わず、安静にする"],"a":1,"e":"突然の痛みには、レスキュー薬を使います。","w":["定期薬を中止すると、普段の痛みも抑えられなくなります。","","非オピオイドのみでは、強い痛みを抑えられません。","次の投与まで待つと、痛みが続きます。","安静だけでは、強い痛みは抑えられません。"],"k":-1,"p":1},{"n":247,"b":"総論","t":"臨床","th":"心臓カテーテル検査","s":"64歳の男性。労作時の胸痛があり、冠動脈の狭窄の部位を、直接調べたい。適切な検査はどれか。","o":["心臓カテーテル検査","胃内視鏡検査","脳波検査","スパイロメトリー","経口ブドウ糖負荷試験"],"a":0,"e":"心臓カテーテル検査は、冠動脈の狭窄の有無と部位を、造影して確認できます。","w":["","胃内視鏡検査は、胃の粘膜を観察する検査です。","脳波検査は、脳の機能の検査です。","スパイロメトリーは、呼吸機能の検査です。","経口ブドウ糖負荷試験は、糖代謝の検査です。"],"k":-1,"p":1},{"n":248,"b":"総論","t":"臨床","th":"気管支鏡の生検","s":"60歳の男性。胸部X線で肺に腫瘤を認めた。組織診断のため、気管支鏡を行う。検査中に行う操作はどれか。","o":["経口ブドウ糖の負荷","神経伝導の測定","粘膜の観察と生検","糸球体濾過量の算出","染色体のG分染"],"a":2,"e":"気管支鏡では、粘膜の観察と、組織を採る生検ができます。","w":["ブドウ糖の負荷は、糖代謝の検査です。","神経伝導の測定は、神経機能の検査です。","","糸球体濾過量は、腎機能の評価です。","G分染は、染色体の検査です。"],"k":-1,"p":1},{"n":249,"b":"総論","t":"臨床","th":"輸血前の確認","s":"55歳の男性。貧血のため、輸血を予定している。輸血の前に必ず行うのはどれか。","o":["輸血の後に血液型を調べる","副作用の観察の省略","輸血速度の最大化","血液型の適合の確認","解熱薬の必須の投与"],"a":3,"e":"輸血では、事前に血液型の適合を確認し、副作用を観察します。","w":["血液型は、輸血の前に確認します。","副作用の観察は、省略せず行います。","速度を最大にすると、副作用の危険が高まります。","","解熱薬を、すべての輸血の前に使う決まりはありません。"],"k":-1,"p":1},{"n":250,"b":"総論","t":"臨床","th":"リハビリの職種","s":"68歳の男性。脳梗塞の後、言葉が出にくく、飲み込みも悪い。この症状への訓練として適切なのはどれか。","o":["理学療法","作業療法","光線療法","温熱療法","言語聴覚療法"],"a":4,"e":"言葉と嚥下の訓練は、言語聴覚療法が担当します。","w":["理学療法は、起立や歩行などの基本動作の訓練です。","作業療法は、日常生活の動作や手作業の訓練です。","光線療法は、リハビリテーションの種類ではありません。","温熱療法は、リハビリテーションの種類ではありません。",""],"k":-1,"p":1},{"n":251,"b":"各論","t":"一般","th":"妊娠高血圧症候群の基準","s":"妊娠高血圧症候群で、高血圧と判定する血圧はどれか。","o":["収縮期120mmHg以上、かつ拡張期80mmHg以上","収縮期130mmHg以上、かつ拡張期85mmHg以上","収縮期140mmHg以上、または拡張期90mmHg以上","収縮期160mmHg以上、または拡張期110mmHg以上","収縮期180mmHg以上、かつ拡張期120mmHg以上"],"a":2,"e":"妊娠高血圧症候群は、収縮期血圧140mmHg以上、または拡張期血圧90mmHg以上で診断します。","w":["この値は正常範囲に近く、高血圧の基準を満たしません。","この値は正常高値であり、診断基準には届きません。","","この値は重症の基準で、診断の基準はもっと低い値です。","この値は高血圧緊急症に近く、診断の基準ではありません。"],"k":-1,"p":1},{"n":252,"b":"各論","t":"一般","th":"病的黄疸を疑う時期","s":"新生児の黄疸のうち、病的な黄疸を疑う所見はどれか。","o":["生後2から3日に出現する黄疸","生後24時間以内に出現する黄疸","生後1週間ほどで消える黄疸","軽度で、哺乳が良好な黄疸","生後4日に最も強くなる黄疸"],"a":1,"e":"生後24時間以内の黄疸、強い黄疸、長引く黄疸は、病的な黄疸を疑います。","w":["生後2から3日に出る黄疸は、生理的黄疸の典型です。","","1週間ほどで消える黄疸は、生理的黄疸の経過です。","軽度で哺乳が良好なら、病的とは考えにくいです。","生後4日前後にピークとなるのは、生理的黄疸でもみられます。"],"k":-1,"p":1},{"n":253,"b":"各論","t":"一般","th":"13トリソミーの特徴","s":"13トリソミーでみられる所見の組合せはどれか。","o":["握りこぶし、重なった指、発育の遅れ","翼状頸、低身長、二次性徴の欠如","高身長、小さい精巣、女性化乳房","口唇口蓋裂、多指症、小頭症","特徴的な顔貌、筋緊張の低下、十二指腸閉鎖"],"a":3,"e":"13トリソミーでは、口唇口蓋裂、多指症、小頭症、心疾患がみられます。","w":["握りこぶしと重なった指は、18トリソミーの所見です。","翼状頸と二次性徴の欠如は、Turner症候群の所見です。","高身長と小さい精巣は、Klinefelter症候群の所見です。","","特徴的な顔貌と十二指腸閉鎖は、Down症候群の所見です。"],"k":-1,"p":1},{"n":254,"b":"各論","t":"臨床","th":"HIV陽性妊婦の対応","s":"30歳の初産婦。妊娠36週。HIV感染症と診断されている。児への感染を防ぐ対応として、適切なのはどれか。","o":["抗ウイルス薬の中止、経腟分娩、母乳栄養","抗菌薬の投与、経腟分娩、母乳栄養","ワクチンの接種、経腟分娩、混合栄養","免疫グロブリンの投与、経腟分娩、母乳栄養","抗ウイルス薬の投与、帝王切開、人工栄養"],"a":4,"e":"HIVの母子感染は、分娩時や授乳で起こるため、抗ウイルス薬、帝王切開、人工栄養で予防します。","w":["抗ウイルス薬を中止すると、感染の危険が高くなります。","抗菌薬はウイルスに効かず、母乳でも感染します。","HIVに有効なワクチンは、現在ありません。","免疫グロブリンでは予防できず、母乳でも感染します。",""],"k":-1,"p":1},{"n":255,"b":"各論","t":"臨床","th":"ABO式血液型不適合","s":"生後1日の新生児。顔と体幹に強い黄疸がある。母親はO型、児はA型である。最も考えられる原因はどれか。","o":["血液型不適合による溶血","生理的黄疸","胆道閉鎖症","先天性甲状腺機能低下症","新生児一過性多呼吸"],"a":0,"e":"生後24時間以内の強い黄疸は、病的な黄疸で、母がO型で児がA型なら、ABO式不適合を考えます。","w":["","生理的黄疸は、生後2から3日に出る軽い黄疸です。","胆道閉鎖症は、生後2週ごろからの白色便と長引く黄疸が特徴です。","先天性甲状腺機能低下症では、長引く黄疸や便秘がみられます。","一過性多呼吸は呼吸の病気で、強い黄疸の原因ではありません。"],"k":-1,"p":1},{"n":256,"b":"各論","t":"臨床","th":"先天性甲状腺機能低下症","s":"生後2か月の女児。黄疸が長引き、便秘と哺乳不良がある。舌が大きく、臍ヘルニアがある。便は黄色である。最も考えられるのはどれか。","o":["先天性副腎過形成","胆道閉鎖症","フェニルケトン尿症","Turner症候群","先天性甲状腺機能低下症"],"a":4,"e":"長引く黄疸、便秘、巨舌、臍ヘルニアは、先天性甲状腺機能低下症の所見で、マススクリーニングの対象です。","w":["先天性副腎過形成は、塩類喪失と女児の外性器の男性化が特徴です。","胆道閉鎖症では、便が白っぽい灰白色になります。","フェニルケトン尿症は、早期の治療が必要ですが、この症状の組合せではありません。","Turner症候群は、低身長と二次性徴の欠如で気づかれます。",""],"k":-1,"p":1},{"n":257,"b":"各論","t":"臨床","th":"産褥期の乳腺炎","s":"28歳の初産婦。産後8日。授乳中で、右の乳房に発赤、腫れ、痛みがある。体温は38.5℃である。最も考えられるのはどれか。","o":["弛緩出血","乳腺炎","産褥精神病","子宮内膜症","異所性妊娠"],"a":1,"e":"産褥期に、乳房の発赤、腫れ、痛み、発熱があれば、乳腺炎を考えます。","w":["弛緩出血は、分娩後の子宮収縮不良による大量の出血です。","","産褥精神病は、幻覚や妄想などの精神症状が主体です。","子宮内膜症は、月経痛などの症状が中心で、乳房の所見はありません。","異所性妊娠は、妊娠初期の疾患で、産後には当てはまりません。"],"k":-1,"p":1},{"n":258,"b":"各論","t":"臨床","th":"Down症候群の新生児","s":"生後3日の男児。特徴的な顔貌と筋緊張の低下がある。緑色の嘔吐を繰り返す。腹部X線で、十二指腸閉鎖が疑われる。最も考えられる染色体異常はどれか。","o":["21トリソミー","18トリソミー","13トリソミー","45,X","47,XXY"],"a":0,"e":"特徴的な顔貌、筋緊張の低下、十二指腸閉鎖は、21トリソミー（Down症候群）の所見です。","w":["","18トリソミーは、握りこぶしと重い発育の遅れが特徴です。","13トリソミーは、口唇口蓋裂、多指症、小頭症が特徴です。","45,XはTurner症候群で、女児にみられます。","47,XXYはKlinefelter症候群で、思春期以降に気づかれます。"],"k":-1,"p":1},{"n":259,"b":"各論","t":"一般","th":"Korsakoff症候群","s":"Korsakoff症候群の特徴はどれか。","o":["眼球運動障害と失調性歩行","手の震えと幻視","記憶障害と作話","高熱と筋強剛","突然の強い不安と動悸"],"a":2,"e":"Korsakoff症候群は、記憶障害と作話が特徴です。Wernicke脳症の後に起こることがあります。","w":["眼球運動障害と失調性歩行は、Wernicke脳症の所見です。","手の震えと幻視は、振戦せん妄の所見です。","","高熱と筋強剛は、悪性症候群の所見です。","突然の強い不安と動悸は、パニック症の所見です。"],"k":-1,"p":1},{"n":260,"b":"各論","t":"一般","th":"医療保護入院の要件","s":"医療保護入院の要件として、正しいのはどれか。","o":["指定医2名の診察と、都道府県知事の命令","本人の同意と、本人からの退院の申し出","指定医1名の診察と、本人の同意","指定医1名の診察と、家族等の同意","一般の医師1名の診察と、警察官の通報"],"a":3,"e":"医療保護入院は、精神保健指定医1名の診察で入院が必要と判断され、家族等の同意があれば、本人の同意は不要です。","w":["指定医2名の診察は、措置入院の要件です。","本人の同意による入院は、任意入院です。","本人の同意が必要なのは、任意入院です。","","医療保護入院には、指定医の診察と家族等の同意が必要です。"],"k":-1,"p":1},{"n":261,"b":"各論","t":"臨床","th":"慢性硬膜下血腫","s":"78歳の男性。2か月前に転倒して頭を打った。最近、物忘れと歩行のふらつきが目立つ。手術で改善する可能性がある。最も考えられるのはどれか。","o":["Alzheimer型認知症","Lewy小体型認知症","慢性硬膜下血腫","前頭側頭型認知症","血管性認知症"],"a":2,"e":"頭部外傷の後に、認知機能の低下と歩行障害が出た場合は、治療で改善する慢性硬膜下血腫を考えます。","w":["Alzheimer型認知症は、緩徐に進行する変性疾患で、手術では改善しません。","Lewy小体型認知症は、幻視と認知機能の変動が特徴です。","","前頭側頭型認知症は、人格の変化と脱抑制が特徴です。","血管性認知症は、脳血管障害の後に、段階的に悪化します。"],"k":-1,"p":1},{"n":262,"b":"各論","t":"臨床","th":"せん妄への対応","s":"82歳の女性。肺炎で入院して3日目の夜から、落ち着きがなくなり、幻視を訴える。意識が混濁し、日中は落ち着いている。適切な対応はどれか。","o":["原因となる肺炎の治療と、環境の調整","抗認知症薬の増量","精神科への転院を、直ちに行う","日中も、ベッドで安静にさせる","夜間に、睡眠薬を大量に投与する"],"a":0,"e":"せん妄は身体の問題が原因です。原因の治療と、環境の調整が基本です。","w":["","認知症の薬は、せん妄の治療ではありません。","身体の治療を優先すべきで、転院は直ちには要りません。","日中の安静は、昼夜の逆転を強め、せん妄を悪化させます。","睡眠薬の大量投与は、せん妄を悪化させることがあります。"],"k":-1,"p":1},{"n":263,"b":"各論","t":"臨床","th":"急性ストレス障害","s":"40歳の男性。10日前に、火災に遭った。その場面の再体験、現場の回避、不眠と過度の警戒が続いている。最も考えられるのはどれか。","o":["心的外傷後ストレス障害","適応障害","パニック症","急性ストレス障害","全般不安症"],"a":3,"e":"外傷体験の後、3日から1か月は急性ストレス障害、1か月以上続けば心的外傷後ストレス障害です。","w":["心的外傷後ストレス障害は、症状が1か月以上続くときに診断します。","適応障害は、強い外傷体験ではなく、明らかなストレス因子で起こります。","パニック症は、突然の発作と予期不安が特徴です。","","全般不安症は、さまざまなことへの持続する不安が特徴です。"],"k":-1,"p":1},{"n":264,"b":"各論","t":"臨床","th":"Alzheimer型認知症の診断","s":"76歳の女性。2年前から、物忘れが徐々に進んでいる。頭部MRIで、海馬の萎縮がある。最も考えられるのはどれか。","o":["血管性認知症","Alzheimer型認知症","正常圧水頭症","Lewy小体型認知症","甲状腺機能低下症"],"a":1,"e":"緩徐に進行する物忘れと、海馬の萎縮は、最も多いAlzheimer型認知症の所見です。","w":["血管性認知症は、段階的に悪化し、局所の神経症状を伴います。","","正常圧水頭症は、歩行障害、認知機能の低下、尿失禁の3つが特徴です。","Lewy小体型認知症は、幻視と認知機能の変動が特徴です。","甲状腺機能低下症は、治療で改善する認知機能の低下の原因です。"],"k":-1,"p":1},{"n":265,"b":"各論","t":"臨床","th":"医療保護入院の判断","s":"42歳の男性。統合失調症で、幻聴がある。病識がなく、入院を拒否している。指定医1名の診察で、入院が必要と判断された。他人を害するおそれはない。家族の同意がある。入院形態はどれか。","o":["任意入院","措置入院","応急入院","緊急措置入院","医療保護入院"],"a":4,"e":"指定医1名が入院を必要と判断し、家族等が同意すれば、本人が拒否しても医療保護入院になります。","w":["任意入院は、本人の同意が必要です。","措置入院は、自傷他害のおそれがあり、指定医2名の診察が必要です。","応急入院は、家族等の同意が得られないときの、72時間以内の入院です。","緊急措置入院は、急を要する自傷他害のおそれで、72時間以内に限ります。",""],"k":-1,"p":1},{"n":266,"b":"各論","t":"一般","th":"鼻出血の初期対応","s":"鼻出血の初期対応として、適切なのはどれか。","o":["仰向けに寝かせて、様子をみる","鼻翼を圧迫して止める","鼻に、強く息を吹き込ませる","首を後ろに反らせて、上を向かせる","出血する鼻の穴を、指で広げる"],"a":1,"e":"鼻出血の多くは鼻中隔の前方からの出血で、鼻翼を圧迫して止めます。","w":["仰向けでは、血液が喉に流れ込みます。","","強く息を吹き込むと、出血を増やします。","上を向くと、血液が喉に流れ込みます。","鼻の穴を広げると、止血になりません。"],"k":-1,"p":1},{"n":267,"b":"各論","t":"一般","th":"急性喉頭蓋炎の診察","s":"急性喉頭蓋炎が疑われる患者の診察で、避けるべきなのはどれか。","o":["舌圧子での無理な咽頭の診察","気道確保の準備","酸素の投与","安静の保持","救急で対応できる体制の確認"],"a":0,"e":"急性喉頭蓋炎では、舌圧子での無理な診察が気道閉塞の引き金になるため、避けます。","w":["","気道確保の準備は、最優先で行います。","酸素の投与は、必要に応じて行います。","安静は、気道の刺激を避けるために大切です。","緊急で対応できる体制の確認は、必要な準備です。"],"k":-1,"p":1},{"n":268,"b":"各論","t":"一般","th":"眼窩吹き抜け骨折の嵌頓","s":"眼窩吹き抜け骨折で、骨折部に嵌頓しやすい眼筋はどれか。","o":["上直筋","外直筋","下直筋","内直筋","上斜筋"],"a":2,"e":"眼窩の下壁が折れて、下直筋などが嵌頓し、上方を見たときの複視が出ます。","w":["上直筋は眼窩の上方にあり、下壁の骨折では嵌頓しにくい筋です。","外直筋は外側にあり、下壁の骨折では嵌頓しにくい筋です。","","内直筋は内側にあり、嵌頓の多い筋は別です。","上斜筋は眼窩の上内側にあり、下壁の骨折とは関係が薄いです。"],"k":-1,"p":1},{"n":269,"b":"各論","t":"一般","th":"メニエール病の病態","s":"メニエール病の病態はどれか。","o":["耳石の半規管への迷入","前庭神経の急性炎症","内耳動脈の閉塞","内リンパ水腫","鼓膜の穿孔"],"a":3,"e":"メニエール病の病態は、内耳の内リンパ水腫です。","w":["耳石が半規管に入り込むのは、良性発作性頭位めまい症です。","前庭神経の炎症は、前庭神経炎の病態です。","内耳動脈の閉塞は、突然のめまいと難聴の原因となる別の病態です。","","鼓膜の穿孔は、中耳の疾患で、回転性めまいの原因ではありません。"],"k":-1,"p":1},{"n":270,"b":"各論","t":"一般","th":"良性発作性頭位めまい症の病態","s":"良性発作性頭位めまい症の病態はどれか。","o":["内リンパが、過剰にたまる","小脳に、出血がある","聴神経に、腫瘍がある","中耳に、膿がたまる","耳石が、半規管に入り込む"],"a":4,"e":"良性発作性頭位めまい症では、耳石が半規管に入り込み、頭位の変化でめまいが起こります。","w":["内リンパ水腫は、メニエール病の病態です。","小脳の出血は中枢性のめまいで、頭位の変化に限る症状ではありません。","聴神経の腫瘍は、片側の難聴や耳鳴の原因となります。","中耳の膿は、急性中耳炎の病態です。",""],"k":-1,"p":1},{"n":271,"b":"各論","t":"臨床","th":"疥癬","s":"80歳の男性。介護施設に入所している。夜間に強いかゆみがあり、指の間に丘疹と線状の皮疹がある。同じ施設で、同様の症状の人がいる。最も考えられるのはどれか。","o":["蕁麻疹","接触皮膚炎","帯状疱疹","疥癬","乾癬"],"a":3,"e":"夜間に強いかゆみがあり、指の間に皮疹があり、施設内で広がるときは、疥癬を考えます。","w":["蕁麻疹は、膨疹が数時間で消え、人にうつりません。","接触皮膚炎は、原因物質が触れた部位に限る湿疹で、人にうつりません。","帯状疱疹は、神経に沿った片側の水疱で、痛みが主体です。","","乾癬は、銀白色の鱗屑を伴う紅斑で、人にうつりません。"],"k":-1,"p":1},{"n":272,"b":"各論","t":"臨床","th":"伝染性膿痂疹","s":"3歳の男児。夏に、顔に水疱が出て、破れてびらんになった。黄色い痂皮がつき、周囲に広がっている。最も考えられるのはどれか。","o":["天疱瘡","類天疱瘡","伝染性膿痂疹","蕁麻疹","基底細胞癌"],"a":2,"e":"小児の夏に、水疱、びらん、黄色い痂皮が広がるときは、伝染性膿痂疹（とびひ）を考えます。","w":["天疱瘡は、成人に多い自己免疫性の水疱症です。","類天疱瘡は、高齢者の緊満した水疱が特徴です。","","蕁麻疹は、膨疹が短時間で消える疾患です。","基底細胞癌は、高齢者の顔の黒色の結節です。"],"k":-1,"p":1},{"n":273,"b":"各論","t":"臨床","th":"蜂窩織炎","s":"62歳の男性。右の下腿が、赤く腫れ、熱をもって痛む。発熱がある。境界は不明瞭である。最も考えられるのはどれか。","o":["乾癬","蜂窩織炎","接触皮膚炎","帯状疱疹","基底細胞癌"],"a":1,"e":"下腿の発赤、腫れ、熱感、痛みと発熱があるときは、細菌感染症の蜂窩織炎を考えます。","w":["乾癬は、銀白色の鱗屑を伴う慢性の紅斑で、発熱はありません。","","接触皮膚炎は、かゆみが主体で、発熱を伴いません。","帯状疱疹は、神経に沿った帯状の水疱が特徴です。","基底細胞癌は、ゆっくり大きくなる黒色の結節です。"],"k":-1,"p":1},{"n":274,"b":"各論","t":"臨床","th":"滲出性中耳炎","s":"5歳の男児。最近、聞こえが悪く、テレビの音を大きくする。発熱と耳痛はない。鼓膜の内側に、液体の貯留がある。最も考えられるのはどれか。","o":["滲出性中耳炎","急性中耳炎","真珠腫性中耳炎","突発性難聴","メニエール病"],"a":0,"e":"発熱と耳痛がなく、鼓膜の内側に液体がたまって、聞こえが悪いのは、滲出性中耳炎です。","w":["","急性中耳炎は、発熱と耳痛があり、鼓膜が赤く膨隆します。","真珠腫性中耳炎は、耳漏と鼓膜の陥凹があり、骨を破壊します。","突発性難聴は、突然の感音難聴で、鼓膜は正常です。","メニエール病は、回転性めまいを繰り返します。"],"k":-1,"p":1},{"n":275,"b":"各論","t":"臨床","th":"扁桃周囲膿瘍","s":"24歳の男性。数日前からの咽頭痛が悪化し、口が開けにくい。発熱がある。口蓋垂が、片側に押されている。最も考えられるのはどれか。","o":["急性喉頭蓋炎","唾石症","耳下腺炎","口腔癌","扁桃周囲膿瘍"],"a":4,"e":"強い咽頭痛、開口障害、発熱、口蓋垂の偏位は、扁桃周囲膿瘍の所見です。","w":["急性喉頭蓋炎は、こもった声と流涎があり、口蓋垂は偏位しません。","唾石症は、食事の際の顎下部の痛みと腫れが特徴です。","耳下腺炎は、耳の下の腫れと痛みが特徴です。","口腔癌は、治りにくい潰瘍や硬結が特徴で、急に起こりません。",""],"k":-1,"p":1},{"n":276,"b":"各論","t":"臨床","th":"小児の鼻出血","s":"8歳の男児。鼻をいじった後に、右の鼻から出血した。出血量は少ない。最初に行う対応はどれか。","o":["仰向けに寝かせる","上を向かせて、鼻にガーゼを詰める","座らせて、前かがみにし、鼻翼を圧迫する","直ちに、全身麻酔で止血する","鼻を強くかませる"],"a":2,"e":"座って前かがみになり、鼻翼を圧迫すると、鼻中隔の前方からの出血は止まります。","w":["仰向けでは、血液が喉に流れ込みます。","上を向くと血液が喉に流れ、これは適切な止血法ではありません。","","出血が少ないので、全身麻酔は必要ありません。","鼻を強くかむと、出血が増えます。"],"k":-1,"p":1},{"n":277,"b":"各論","t":"臨床","th":"真珠腫性中耳炎","s":"45歳の男性。長年、右耳の耳漏と難聴が続いている。鼓膜の上部に陥凹があり、白い塊がみえる。最も考えられるのはどれか。","o":["急性中耳炎","滲出性中耳炎","突発性難聴","良性発作性頭位めまい症","真珠腫性中耳炎"],"a":4,"e":"慢性の耳漏、難聴、鼓膜の上部の陥凹と白い塊は、真珠腫性中耳炎を考えます。","w":["急性中耳炎は、発熱と耳痛、鼓膜の膨隆が特徴です。","滲出性中耳炎は、鼓膜の内側の液体の貯留が特徴です。","突発性難聴は、突然の感音難聴で、鼓膜は正常です。","良性発作性頭位めまい症は、頭位の変化によるめまいです。",""],"k":-1,"p":1},{"n":278,"b":"各論","t":"臨床","th":"流行性耳下腺炎","s":"6歳の男児。発熱し、両側の耳の下が腫れて、痛む。食べるときに、痛みが強くなる。最も考えられるのはどれか。","o":["急性中耳炎","流行性耳下腺炎","扁桃周囲膿瘍","唾石症","急性喉頭蓋炎"],"a":1,"e":"発熱と、耳下部の腫れと痛みは、流行性耳下腺炎（おたふくかぜ）を考えます。","w":["急性中耳炎は、耳痛と鼓膜の発赤が特徴で、耳の下は腫れません。","","扁桃周囲膿瘍は、強い咽頭痛と開口障害が特徴です。","唾石症は、食事のときの顎下部の腫れが特徴で、発熱はまれです。","急性喉頭蓋炎は、流涎とこもった声が特徴です。"],"k":-1,"p":1},{"n":279,"b":"各論","t":"臨床","th":"舌癌","s":"65歳の男性。喫煙歴がある。2か月前から、舌の縁に潰瘍があり、治らない。触ると硬い。最も考えられるのはどれか。","o":["口腔癌","唾石症","扁桃周囲膿瘍","口内炎","伝染性膿痂疹"],"a":0,"e":"治らない潰瘍と硬結が、喫煙者の舌にあるときは、口腔癌を考えます。","w":["","唾石症は、食事のときの顎下部の痛みと腫れが特徴です。","扁桃周囲膿瘍は、強い咽頭痛と開口障害が特徴です。","口内炎は、通常は1から2週間で治ります。","伝染性膿痂疹は、小児の皮膚の感染症です。"],"k":-1,"p":1},{"n":280,"b":"各論","t":"臨床","th":"基底細胞癌の診断","s":"75歳の男性。鼻翼に、光沢のある黒色の結節が、数年かけて、ゆっくり大きくなった。転移はない。最も考えられるのはどれか。","o":["悪性黒色腫","有棘細胞癌","脂漏性皮膚炎","基底細胞癌","乾癬"],"a":3,"e":"顔面に多い黒色の結節で、ゆっくり増大し、転移がまれなのは、基底細胞癌です。","w":["悪性黒色腫は、不規則な色素斑で、急に大きくなります。","有棘細胞癌は、びらんや潰瘍を作りやすく、転移することがあります。","脂漏性皮膚炎は、結節ではなく、鱗屑を伴う紅斑です。","","乾癬は、銀白色の鱗屑を伴う紅斑で、結節ではありません。"],"k":-1,"p":1},{"n":281,"b":"各論","t":"臨床","th":"接触皮膚炎","s":"28歳の女性。金属のピアスをつけて2日後に、耳たぶにかゆみのある紅斑と小水疱が出た。原因の部位に限られている。最も考えられるのはどれか。","o":["アトピー性皮膚炎","蕁麻疹","乾癬","接触皮膚炎","脂漏性皮膚炎"],"a":3,"e":"原因物質が触れた部位に限って出る、かゆみのある紅斑と小水疱は、接触皮膚炎です。","w":["アトピー性皮膚炎は、慢性に繰り返す全身の湿疹です。","蕁麻疹は、膨疹が数時間で消え、場所を変えて出ます。","乾癬は、肘や膝の、銀白色の鱗屑を伴う紅斑です。","","脂漏性皮膚炎は、頭や顔の脂の多い部位に出ます。"],"k":-1,"p":1},{"n":282,"b":"各論","t":"一般","th":"Ⅱ型呼吸不全の定義","s":"Ⅱ型呼吸不全の定義はどれか。","o":["PaO2が60mmHg以下で、PaCO2が45mmHg以下","PaO2が80mmHg以下で、PaCO2が35mmHg未満","PaO2が60mmHg以下で、PaCO2が45mmHgを超える","PaO2が90mmHg以上で、PaCO2が45mmHgを超える","PaO2が60mmHg以上で、PaCO2が45mmHg以下"],"a":2,"e":"Ⅱ型呼吸不全は、PaO2が60mmHg以下で、PaCO2が45mmHgを超えるものです。","w":["PaCO2が45mmHg以下のものは、Ⅰ型呼吸不全です。","PaO2が80mmHg以下という基準は、呼吸不全の定義ではありません。","","PaO2が高ければ、低酸素血症がなく、呼吸不全ではありません。","PaO2が正常で、PaCO2も正常なら、呼吸不全ではありません。"],"k":-1,"p":1},{"n":283,"b":"各論","t":"一般","th":"閉塞性換気障害の所見","s":"閉塞性換気障害でみられる所見はどれか。","o":["1秒率の上昇と、残気量の減少","%肺活量の低下と、残気量の減少","1秒率の正常と、%肺活量の低下","肺活量の低下と、1秒率の上昇","1秒率の低下と、残気量の増加"],"a":4,"e":"閉塞性換気障害では、1秒率が70%未満に低下し、肺の過膨張で残気量が増加します。","w":["1秒率が上昇し、残気量が減るのは、拘束性の型です。","%肺活量の低下と残気量の減少は、拘束性換気障害の所見です。","1秒率が正常で、%肺活量が低下するのは、拘束性の所見です。","肺活量が低下し、1秒率が上昇するのは、拘束性の所見です。",""],"k":-1,"p":1},{"n":284,"b":"各論","t":"一般","th":"扁平上皮癌の特徴","s":"肺の扁平上皮癌で、上昇しやすい腫瘍マーカーはどれか。","o":["ProGRPとNSE","SCCとCYFRA","CEAのみ","AFPとPIVKA-Ⅱ","CA19-9"],"a":1,"e":"扁平上皮癌は、喫煙との関連が強く、SCCとCYFRAが上昇します。","w":["ProGRPとNSEは、小細胞癌のマーカーです。","","CEAは、腺癌で上昇しやすいマーカーです。","AFPとPIVKA-Ⅱは、肝細胞癌のマーカーです。","CA19-9は、膵癌のマーカーです。"],"k":-1,"p":1},{"n":285,"b":"各論","t":"臨床","th":"気管支喘息の長期管理","s":"28歳の女性。夜間から早朝に、咳と呼気性の喘鳴を繰り返している。気管支喘息と診断された。長期管理の第一選択はどれか。","o":["吸入ステロイド","経口の抗菌薬","鎮咳薬の内服","ステロイドの長期の内服","NSAIDsの内服"],"a":0,"e":"気管支喘息の長期管理は、吸入ステロイドが中心です。","w":["","喘息の原因は感染ではなく、抗菌薬は第一選択ではありません。","鎮咳薬は、咳を抑えるだけで、気道の炎症を治療できません。","全身の副作用が多く、長期管理の第一選択ではありません。","NSAIDsは、アスピリン喘息で発作を誘発することがあります。"],"k":-1,"p":1},{"n":286,"b":"各論","t":"臨床","th":"誤嚥性肺炎の予防","s":"82歳の男性。脳梗塞の後遺症で、嚥下障害がある。発熱と咳で受診し、右の下葉に浸潤影があり、誤嚥性肺炎と診断された。再発を防ぐ対応はどれか。","o":["口腔ケアと、嚥下機能の評価","ワクチンの定期の接種を中止する","経口摂取を、評価なしで続ける","仰向けで、食事をとらせる","抗菌薬を、長期に予防投与する"],"a":0,"e":"誤嚥性肺炎の予防には、口腔ケアと、嚥下機能の評価に基づく食事の工夫が大切です。","w":["","肺炎球菌ワクチンなどの接種は、予防に役立ちます。","評価なしで続けると、誤嚥を繰り返します。","仰向けでの食事は、誤嚥しやすい姿勢です。","抗菌薬の長期の予防投与は、耐性菌を増やし、勧められません。"],"k":-1,"p":1},{"n":287,"b":"各論","t":"臨床","th":"肺扁平上皮癌","s":"68歳の男性。喫煙歴が50年ある。血痰がある。胸部X線で、肺門部に空洞を伴う腫瘤がある。血清カルシウムが高い。最も考えられるのはどれか。","o":["腺癌","小細胞癌","大細胞癌","扁平上皮癌","悪性胸膜中皮腫"],"a":3,"e":"喫煙と関連し、肺門部に空洞を作り、高カルシウム血症を伴う肺癌は、扁平上皮癌です。","w":["腺癌は、末梢に多く、非喫煙者にも出ます。","小細胞癌は、進行が速く、SIADHなどを伴います。","大細胞癌は、頻度が低く、末梢に多い組織型です。","","悪性胸膜中皮腫は、アスベストへの曝露が原因で、胸膜に生じます。"],"k":-1,"p":1},{"n":288,"b":"各論","t":"臨床","th":"小細胞癌のSIADH","s":"66歳の男性。喫煙歴がある。倦怠感と食欲低下がある。血清ナトリウムが低く、尿の浸透圧が高い。胸部X線で、肺門部に腫瘤がある。最も考えられるのはどれか。","o":["腺癌","小細胞癌","扁平上皮癌","胸腺腫","サルコイドーシス"],"a":1,"e":"SIADHを伴い、肺門部にできる、進行の速い肺癌は、小細胞癌です。","w":["腺癌は、末梢に多く、CEAが上昇します。","","扁平上皮癌は、空洞を作り、高カルシウム血症を伴います。","胸腺腫は、前縦隔の腫瘍で、重症筋無力症を合併します。","サルコイドーシスは、両側の肺門リンパ節腫脹で気づかれます。"],"k":-1,"p":1},{"n":289,"b":"各論","t":"臨床","th":"間質性肺炎の血清マーカー","s":"68歳の男性。乾性咳と労作時の息切れがある。ばち指があり、背側下部で捻髪音を聴取する。間質性肺炎が疑われる。上昇する血清マーカーはどれか。","o":["ProGRPとNSE","CEAとCA19-9","KL-6とSP-D","AFPとPIVKA-Ⅱ","SCCとCYFRA"],"a":2,"e":"間質性肺炎では、血清のKL-6とSP-Dが上昇します。","w":["ProGRPとNSEは、小細胞癌で上昇します。","CEAとCA19-9は、腺癌や消化器癌で上昇します。","","AFPとPIVKA-Ⅱは、肝細胞癌で上昇します。","SCCとCYFRAは、扁平上皮癌で上昇します。"],"k":-1,"p":1},{"n":290,"b":"各論","t":"臨床","th":"胸腺腫","s":"50歳の女性。夕方になると、まぶたが下がり、物が二重に見える。胸部CTで、前縦隔に腫瘤がある。最も考えられる腫瘍はどれか。","o":["神経鞘腫","気管支嚢胞","小細胞癌","食道癌","胸腺腫"],"a":4,"e":"前縦隔の腫瘤に、重症筋無力症の症状が伴えば、胸腺腫を考えます。","w":["神経鞘腫は、後縦隔に発生する神経原性腫瘍です。","気管支嚢胞は、中縦隔に発生します。","小細胞癌は、肺の腫瘍で、前縦隔には発生しません。","食道癌は、嚥下困難が主な症状で、重症筋無力症とは関連しません。",""],"k":-1,"p":1},{"n":291,"b":"各論","t":"臨床","th":"悪性胸膜中皮腫","s":"72歳の男性。若いころ、造船所で働いていた。数か月前から、息切れと胸痛がある。胸水が貯留している。最も考えられるのはどれか。","o":["肺血栓塞栓症","自然気胸","特発性肺線維症","悪性胸膜中皮腫","緊張性気胸"],"a":3,"e":"アスベストへの曝露歴があり、胸水と胸痛を伴うときは、悪性胸膜中皮腫を考えます。","w":["肺血栓塞栓症は、突然の呼吸困難と胸痛で発症します。","自然気胸は、若いやせ型の男性に多く、突然に発症します。","特発性肺線維症は、乾性咳、ばち指、捻髪音が特徴です。","","緊張性気胸は、ショックを起こす緊急疾患です。"],"k":-1,"p":1},{"n":292,"b":"各論","t":"一般","th":"家庭血圧の基準","s":"高血圧と診断する、家庭血圧の基準はどれか。","o":["120/80mmHg以上","130/80mmHg未満","140/90mmHg以上","160/100mmHg以上","135/85mmHg以上"],"a":4,"e":"高血圧は、診察室血圧が140/90mmHg以上、または家庭血圧が135/85mmHg以上です。","w":["120/80mmHgは、正常血圧の目安です。","130/80mmHg未満は、高血圧の基準ではありません。","140/90mmHg以上は、診察室血圧の基準です。","160/100mmHg以上は、より重い高血圧で、診断の基準ではありません。",""],"k":-1,"p":1},{"n":293,"b":"各論","t":"一般","th":"右心不全の所見","s":"右心不全でみられる所見はどれか。","o":["起坐呼吸と、湿性ラ音","夜間の発作性呼吸困難と、III音","頸静脈の怒張と、肝腫大","胸部X線での肺うっ血","喀血と、ピンク色の泡沫痰"],"a":2,"e":"右心不全では、頸静脈の怒張、肝腫大、腹水、下腿の浮腫がみられます。","w":["起坐呼吸と湿性ラ音は、左心不全の所見です。","夜間の発作性呼吸困難は、左心不全の症状です。","","肺うっ血は、左心不全で胸部X線にみられる所見です。","ピンク色の泡沫痰は、急性の肺水腫の所見です。"],"k":-1,"p":1},{"n":294,"b":"各論","t":"一般","th":"大動脈弁狭窄症の症状","s":"大動脈弁狭窄症で、進行するとみられる3つの症状はどれか。","o":["発熱、関節痛、皮疹","失神、狭心痛、心不全","咳、血痰、体重減少","頭痛、悪心、視力低下","腹痛、下痢、体重減少"],"a":1,"e":"大動脈弁狭窄症では、失神、狭心痛、心不全の3つの症状が重要です。","w":["発熱、関節痛、皮疹は、リウマチ熱などでみられます。","","咳、血痰、体重減少は、肺の疾患を疑う症状です。","頭痛、悪心、視力低下は、急性閉塞隅角緑内障などの症状です。","腹痛、下痢、体重減少は、消化器疾患を疑う症状です。"],"k":-1,"p":1},{"n":295,"b":"各論","t":"一般","th":"心筋梗塞の血液検査","s":"急性心筋梗塞で、上昇する血液検査項目はどれか。","o":["心筋トロポニン","血清アルブミン","血清カリウム","血清アミラーゼ","血清アンモニア"],"a":0,"e":"急性心筋梗塞では、心筋トロポニンが上昇します。","w":["","血清アルブミンは、栄養状態や肝機能の指標です。","血清カリウムは、心筋梗塞の診断には用いません。","血清アミラーゼは、膵炎で上昇します。","血清アンモニアは、肝性脳症で上昇します。"],"k":-1,"p":1},{"n":296,"b":"各論","t":"一般","th":"Stanford A型の合併症","s":"Stanford A型の大動脈解離で、合併しやすいのはどれか。","o":["僧帽弁狭窄と、心房細動","大動脈弁閉鎖不全と、心タンポナーデ","肺動脈弁狭窄と、右室肥大","心室中隔欠損と、肺高血圧","動脈管開存と、連続性雑音"],"a":1,"e":"A型は上行大動脈に解離があり、大動脈弁閉鎖不全や心タンポナーデを合併します。","w":["僧帽弁狭窄は、リウマチ熱が原因の弁膜症です。","","肺動脈弁狭窄は、先天性の疾患で、解離の合併症ではありません。","心室中隔欠損は、先天性の疾患で、解離の合併症ではありません。","動脈管開存は、先天性の疾患で、解離の合併症ではありません。"],"k":-1,"p":1},{"n":297,"b":"各論","t":"臨床","th":"心房細動の抗凝固","s":"72歳の男性。心房細動がある。弁膜症はない。脳塞栓症の予防に使う薬はどれか。","o":["抗菌薬","利尿薬","直接経口抗凝固薬（DOAC）","鎮痛薬","制酸薬"],"a":2,"e":"弁膜症のない心房細動では、脳塞栓症の予防に、DOACかワルファリンを使います。","w":["抗菌薬では、血栓を予防できません。","利尿薬は、心不全の症状を改善します。","","鎮痛薬は、血栓の予防になりません。","制酸薬は、胃酸を抑える薬で、血栓を予防できません。"],"k":-1,"p":1},{"n":298,"b":"各論","t":"臨床","th":"拡張型心筋症","s":"52歳の男性。息切れと下腿の浮腫がある。心エコーで、左室が拡大し、収縮が低下している。最も考えられるのはどれか。","o":["肥大型心筋症","たこつぼ心筋症","急性心膜炎","僧帽弁狭窄症","拡張型心筋症"],"a":4,"e":"左室の拡大と収縮の低下は、拡張型心筋症の特徴です。","w":["肥大型心筋症は、心室中隔の肥厚が特徴です。","たこつぼ心筋症は、強い精神的ストレスの後に、心尖部の収縮が低下します。","急性心膜炎は、胸痛と心膜摩擦音が特徴です。","僧帽弁狭窄症は、拡張期のランブルが特徴です。",""],"k":-1,"p":1},{"n":299,"b":"各論","t":"臨床","th":"原発性アルドステロン症","s":"45歳の女性。若いころから高血圧があり、降圧薬の効果が乏しい。血清カリウムが低い。最も考えられるのはどれか。","o":["本態性高血圧","腎血管性高血圧","大動脈弁狭窄症","原発性アルドステロン症","起立性低血圧"],"a":3,"e":"若い高血圧と低カリウム血症は、二次性高血圧の原発性アルドステロン症を考えます。","w":["本態性高血圧は、原因が特定できず、低カリウム血症を伴いません。","腎血管性高血圧は、腎動脈の狭窄が原因で、低カリウムが主ではありません。","大動脈弁狭窄症は、失神や狭心痛が特徴です。","","起立性低血圧は、起立時の血圧低下で、高血圧ではありません。"],"k":-1,"p":1},{"n":300,"b":"各論","t":"臨床","th":"褐色細胞腫","s":"35歳の男性。発作性の頭痛、動悸、発汗とともに、血圧が上昇する。副腎に腫瘍がある。最も考えられるのはどれか。","o":["褐色細胞腫","原発性アルドステロン症","本態性高血圧","パニック症","腎血管性高血圧"],"a":0,"e":"発作性の高血圧、頭痛、動悸、発汗と副腎の腫瘍は、褐色細胞腫を考えます。","w":["","原発性アルドステロン症は、低カリウム血症が特徴です。","本態性高血圧は、副腎に腫瘍を認めません。","パニック症は、副腎の腫瘍を伴わない精神疾患です。","腎血管性高血圧は、腎動脈の狭窄が原因です。"],"k":-1,"p":1},{"n":301,"b":"各論","t":"臨床","th":"心房中隔欠損","s":"5歳の女児。健診で、心雑音を指摘された。チアノーゼはない。肺動脈弁領域で、収縮期の駆出性雑音があり、II音は固定性に分裂している。最も考えられるのはどれか。","o":["動脈管開存","Fallot四徴症","大動脈弁狭窄症","心房中隔欠損","僧帽弁狭窄症"],"a":3,"e":"チアノーゼのない左右シャントで、II音の固定性分裂があれば、心房中隔欠損を考えます。","w":["動脈管開存は、連続性の機械様雑音が特徴です。","Fallot四徴症は、チアノーゼと無酸素発作が特徴です。","大動脈弁狭窄症は、頸部へ放散する収縮期雑音が特徴です。","","僧帽弁狭窄症は、拡張期のランブルが特徴です。"],"k":-1,"p":1},{"n":302,"b":"各論","t":"臨床","th":"心室中隔欠損","s":"生後2か月の男児。哺乳不良と多呼吸がある。胸骨左縁で、全収縮期雑音を聴取する。チアノーゼはない。最も考えられるのはどれか。","o":["Fallot四徴症","心室中隔欠損","動脈管開存","僧帽弁狭窄症","大動脈弁狭窄症"],"a":1,"e":"チアノーゼがなく、胸骨左縁の全収縮期雑音と心不全症状があれば、心室中隔欠損を考えます。","w":["Fallot四徴症は、チアノーゼを伴います。","","動脈管開存は、連続性の機械様雑音が特徴です。","僧帽弁狭窄症は、乳児ではまれで、拡張期の雑音が特徴です。","大動脈弁狭窄症は、収縮期の駆出性雑音で、頸部に放散します。"],"k":-1,"p":1},{"n":303,"b":"各論","t":"臨床","th":"リンパ浮腫","s":"58歳の女性。乳癌の手術で、腋窩のリンパ節を切除した。数か月後から、手術した側の腕が、腫れてきた。最も考えられるのはどれか。","o":["深部静脈血栓症","右心不全","リンパ浮腫","蜂窩織炎","下肢静脈瘤"],"a":2,"e":"がんの手術の後に、片側の腕が腫れるのは、リンパの流れの障害によるリンパ浮腫です。","w":["深部静脈血栓症は、片側の下肢の腫れと痛みが典型です。","右心不全は、両側の下腿の浮腫が主体です。","","蜂窩織炎は、発熱と、熱感のある発赤を伴います。","下肢静脈瘤は、立位で目立つ静脈の拡張です。"],"k":-1,"p":1},{"n":304,"b":"各論","t":"臨床","th":"労作性狭心症の発作時","s":"60歳の男性。階段を上ると、胸が締めつけられる痛みが出る。約3分、安静にすると消える。発作時の対応はどれか。","o":["直ちに、全身麻酔","抗菌薬の投与","高濃度の酸素と、利尿薬","鎮咳薬の内服","硝酸薬の舌下"],"a":4,"e":"労作性狭心症の発作時は、硝酸薬の舌下投与で、胸痛を和らげます。","w":["全身麻酔は、発作の対応ではありません。","狭心症の原因は感染ではなく、抗菌薬は無効です。","酸素は低酸素のときに使い、利尿薬は発作を止めません。","鎮咳薬は、咳を抑える薬で、胸痛に効きません。",""],"k":-1,"p":1},{"n":305,"b":"各論","t":"臨床","th":"脈の触れない心室頻拍","s":"60歳の男性。胸痛のあと、意識を失って倒れた。心電検査で、wide QRSの頻拍があり、脈は触れない。直ちに行うべき対応はどれか。","o":["除細動","ATPの静注","迷走神経刺激","硝酸薬の舌下","β遮断薬の内服"],"a":0,"e":"脈のない心室頻拍は、心室細動と同様に、直ちに除細動と胸骨圧迫を行います。","w":["","ATPの静注は、発作性上室性頻拍に使います。","迷走神経刺激は、発作性上室性頻拍に行う方法です。","硝酸薬は、血圧低下をきたし、蘇生にはなりません。","内服薬は、意識がなく、脈のない患者への対応になりません。"],"k":-1,"p":1},{"n":306,"b":"各論","t":"臨床","th":"川崎病の治療","s":"2歳の男児。5日間続く発熱がある。両側の眼球結膜の充血、口唇の紅潮、いちご舌、発疹、手足の硬性浮腫がある。最も適切な治療はどれか。","o":["抗菌薬のみの投与","免疫グロブリン静注とアスピリン","ステロイドの外用","利尿薬の内服","対症療法のみで経過をみる"],"a":1,"e":"川崎病の治療は、免疫グロブリン静注とアスピリンで、冠動脈瘤を防ぎます。","w":["川崎病は感染症ではなく、抗菌薬のみでは効果が乏しいです。","","外用薬では、全身の血管炎を抑えられません。","利尿薬では、血管炎を治療できません。","放置すると冠動脈瘤を合併するため、治療が必要です。"],"k":-1,"p":1},{"n":307,"b":"各論","t":"一般","th":"肝細胞障害型の検査値","s":"肝細胞障害型の肝障害で、特に上昇する検査値はどれか。","o":["ALP","γ-GTP","直接ビリルビンのみ","ALT","血清アミラーゼ"],"a":3,"e":"肝細胞障害型では、AST、ALT（特にALT）が上昇します。","w":["ALPは、胆汁うっ滞型で上昇します。","γ-GTPは、胆汁うっ滞型で上昇します。","直接ビリルビンの上昇が主なのは、胆汁うっ滞型です。","","血清アミラーゼは、膵炎で上昇します。"],"k":-1,"p":1},{"n":308,"b":"各論","t":"一般","th":"急性膵炎の原因","s":"急性膵炎の原因として、多いものの組合せはどれか。","o":["アルコールと胆石","ピロリ菌とNSAIDs","B型肝炎と飲酒","喫煙とアスベスト","高血圧と動脈硬化"],"a":0,"e":"急性膵炎の原因は、アルコールと胆石が多いです。","w":["","ピロリ菌とNSAIDsは、消化性潰瘍の原因です。","B型肝炎は、膵炎ではなく肝炎の原因です。","喫煙とアスベストは、肺癌と中皮腫の原因です。","高血圧と動脈硬化は、膵炎の主な原因ではありません。"],"k":-1,"p":1},{"n":309,"b":"各論","t":"一般","th":"上部消化管出血の便","s":"上部消化管からの出血で、みられる便の性状はどれか。","o":["鮮紅色の血便","白色の灰白色便","黒色のタール便","緑色の水様便","イチゴゼリー状の血便"],"a":2,"e":"上部消化管の出血は、血液が消化されて、黒色のタール便になります。","w":["鮮紅色の血便は、下部消化管や肛門に近い出血でみられます。","灰白色の便は、胆道閉鎖症などでみられます。","","緑色の水様便は、出血を示す所見ではありません。","イチゴゼリー状の血便は、乳児の腸重積症の所見です。"],"k":-1,"p":1},{"n":310,"b":"各論","t":"一般","th":"急性腹症で除外する疾患","s":"急性腹症の初期対応で、先に除外すべき疾患はどれか。","o":["慢性の便秘の原因疾患","過敏性腸症候群の悪化","軽症の急性胃炎","慢性の痔核","緊急手術が必要な疾患"],"a":4,"e":"急性腹症では、緊急の手術が必要な疾患を、先に除外します。","w":["慢性の便秘は、緊急性が低い疾患です。","過敏性腸症候群は、緊急性が低い疾患です。","軽症の胃炎は、緊急性が低い疾患です。","痔核は、緊急性が低い疾患です。",""],"k":-1,"p":1},{"n":311,"b":"各論","t":"一般","th":"Crohn病の好発部位","s":"Crohn病の好発部位はどれか。","o":["食道","回腸末端","胃体部","直腸のみ","胆管"],"a":1,"e":"Crohn病は、口から肛門までどこにでもできますが、回腸末端に好発します。","w":["食道の病変は、Crohn病ではまれです。","","胃体部の病変は、Crohn病ではまれです。","直腸に限るのは、潰瘍性大腸炎の特徴です。","胆管の病変は、Crohn病の好発部位ではありません。"],"k":-1,"p":1},{"n":312,"b":"各論","t":"一般","th":"ワクチンのある肝炎","s":"予防のワクチンがある、肝炎ウイルスの組合せはどれか。","o":["B型とC型","C型とE型","A型とC型","A型とB型","C型のみ"],"a":3,"e":"A型肝炎とB型肝炎には、予防のワクチンがあります。","w":["C型肝炎には、ワクチンがありません。","C型とE型に、ワクチンはありません。","C型には、ワクチンがありません。","","C型には、ワクチンがありません。"],"k":-1,"p":1},{"n":313,"b":"各論","t":"臨床","th":"絞扼性腸閉塞","s":"70歳の女性。腹部の手術の既往がある。持続する強い腹痛と嘔吐がある。腹部に、腹膜刺激症状がある。最も適切な対応はどれか。","o":["絶食にして、数日、経過をみる","浣腸で、排便を促す","造影CTで確認し、緊急手術を行う","鎮痛薬を内服させて、帰宅させる","下剤を投与する"],"a":2,"e":"持続する強い腹痛と腹膜刺激症状は、絞扼性腸閉塞を疑い、緊急手術を行います。","w":["数日の経過観察では、腸管が壊死する危険があります。","浣腸は、絞扼性の腸閉塞を解除できません。","","帰宅では、腸管の壊死が進みます。","下剤は、腸閉塞を悪化させます。"],"k":-1,"p":1},{"n":314,"b":"各論","t":"臨床","th":"癒着性腸閉塞","s":"55歳の男性。腹部の手術の既往がある。嘔吐と腹部膨満がある。腹膜刺激症状はなく、腹部X線で鏡面像がある。初期の対応はどれか。","o":["直ちに、緊急手術を行う","下剤を投与して、排便を促す","経口で、水分と食事を開始する","運動を勧めて、帰宅させる","絶飲食にして、経鼻胃管で減圧する"],"a":4,"e":"腹膜刺激症状のない単純性の腸閉塞は、絶飲食と、経鼻胃管などによる減圧を行います。","w":["絞扼性の所見がなければ、まず保存的に治療します。","下剤は、腸管の内圧を高め、悪化させます。","経口摂取は、嘔吐と腹部膨満を悪化させます。","腸閉塞の患者の帰宅は、危険です。",""],"k":-1,"p":1},{"n":315,"b":"各論","t":"臨床","th":"C型慢性肝炎の治療","s":"60歳の男性。健診で、肝障害を指摘された。HCV抗体とHCV-RNAが陽性である。治療として、適切なのはどれか。","o":["直接作用型抗ウイルス薬","予防ワクチンの接種","広域の抗菌薬の投与","ステロイドの長期投与","生活指導のみで経過観察"],"a":0,"e":"C型肝炎は、直接作用型抗ウイルス薬で、治癒を目指します。","w":["","ワクチンは、C型肝炎には存在せず、治療にもなりません。","抗菌薬は、ウイルスに効きません。","ステロイドは、ウイルスの増殖を促し、不適切です。","慢性化しやすいため、治療が必要です。"],"k":-1,"p":1},{"n":316,"b":"各論","t":"臨床","th":"上部消化管出血の初期対応","s":"60歳の男性。NSAIDsを服用している。黒色便の後に、立ちくらみがある。脈拍は120回/分、血圧は80/50mmHgである。最初に行う対応はどれか。","o":["直ちに、食事を開始する","下剤を投与して、排便を促す","輸液を行い、循環を安定させる","経過観察のため、帰宅させる","鎮痛薬を増量して、様子をみる"],"a":2,"e":"上部消化管出血でショックがあるときは、まず輸液で循環を安定させ、内視鏡で止血します。","w":["食事の開始は、出血を悪化させます。","下剤は、消化管の刺激で、出血を増やします。","","ショックの患者の帰宅は、危険です。","NSAIDsは、潰瘍の原因であり、鎮痛薬の増量は不適切です。"],"k":-1,"p":1},{"n":317,"b":"各論","t":"臨床","th":"Krukenberg腫瘍","s":"48歳の女性。1年前に、胃癌の手術を受けた。下腹部が張り、CTで、両側の卵巣の腫大がある。最も考えられるのはどれか。","o":["Virchow転移","Schnitzler転移","卵巣嚢腫","Krukenberg腫瘍","子宮内膜症"],"a":3,"e":"胃癌の卵巣転移を、Krukenberg腫瘍といいます。","w":["Virchow転移は、左鎖骨上窩リンパ節への転移です。","Schnitzler転移は、直腸Douglas窩への転移です。","胃癌の既往があり、両側の腫大は、転移を考えます。","","子宮内膜症は、月経痛が主な症状で、胃癌の転移ではありません。"],"k":-1,"p":1},{"n":318,"b":"各論","t":"臨床","th":"便潜血陽性の精査","s":"62歳の男性。大腸癌検診の、便潜血検査が陽性であった。次に行う検査はどれか。","o":["再度の便潜血検査のみ","大腸内視鏡検査","腹部の単純X線","上部消化管内視鏡のみ","腹部の超音波検査のみ"],"a":1,"e":"便潜血が陽性なら、大腸癌を疑い、大腸内視鏡検査で精査します。","w":["再検だけで済ませると、癌を見逃します。","","単純X線では、大腸の粘膜病変を診断できません。","上部だけでは、大腸の病変を確認できません。","超音波検査では、大腸の粘膜を観察できません。"],"k":-1,"p":1},{"n":319,"b":"各論","t":"臨床","th":"肛門周囲膿瘍","s":"35歳の男性。肛門の周囲が、赤く腫れて、強く痛む。熱感があり、発熱がある。最も考えられるのはどれか。","o":["内痔核","大腸癌","潰瘍性大腸炎","腸重積症","肛門周囲膿瘍"],"a":4,"e":"肛門周囲の発赤、腫れ、熱感、痛み、発熱は、肛門周囲膿瘍の所見です。","w":["内痔核は、排便時の無痛性の出血が特徴です。","大腸癌は、便潜血や便通の変化で気づかれます。","潰瘍性大腸炎は、粘血便と下痢が特徴です。","腸重積症は、乳児の疾患です。",""],"k":-1,"p":1},{"n":320,"b":"各論","t":"臨床","th":"内痔核","s":"50歳の女性。便秘がちで、排便時に、鮮紅色の出血がある。痛みはない。肛門を診察すると、腫れた静脈叢がある。最も考えられるのはどれか。","o":["痔核","痔瘻","肛門周囲膿瘍","大腸癌","虚血性大腸炎"],"a":0,"e":"排便時の無痛性の鮮血は、痔核を考えます。大腸癌の除外も大切です。","w":["","痔瘻は、肛門周囲の膿瘍のあとにできる、膿の通り道です。","肛門周囲膿瘍は、強い痛みと発熱を伴います。","大腸癌は、診察で静脈叢の腫れという所見が合いません。","虚血性大腸炎は、突然の腹痛と下血が特徴です。"],"k":-1,"p":1},{"n":321,"b":"各論","t":"臨床","th":"痔瘻","s":"32歳の男性。肛門周囲膿瘍を切開した後も、肛門の近くの皮膚から、膿が繰り返し出る。最も考えられるのはどれか。","o":["内痔核","痔瘻","大腸癌","腸重積症","虚血性大腸炎"],"a":1,"e":"肛門周囲膿瘍のあとに、膿が繰り返し出るときは、痔瘻を考えます。","w":["内痔核は、排便時の出血が主な症状です。","","大腸癌は、便潜血や便通の変化で気づかれます。","腸重積症は、乳児の疾患です。","虚血性大腸炎は、高齢者の突然の腹痛と下血が特徴です。"],"k":-1,"p":1},{"n":322,"b":"各論","t":"臨床","th":"食道癌の診断","s":"65歳の男性。大量の飲酒と喫煙の習慣がある。数か月前から、固形物がつかえ、体重が減った。最初に行う検査はどれか。","o":["大腸内視鏡検査","腹部の超音波検査のみ","上部消化管内視鏡検査","胸部の単純X線のみ","便潜血検査"],"a":2,"e":"つかえ感がある、飲酒と喫煙のある男性は、食道癌を疑い、上部消化管内視鏡で診断します。","w":["大腸内視鏡は、下部消化管の検査です。","超音波検査のみでは、食道の病変を診断できません。","","単純X線のみでは、食道癌を確定できません。","便潜血検査は、大腸癌のスクリーニングです。"],"k":-1,"p":1},{"n":323,"b":"各論","t":"臨床","th":"潰瘍性大腸炎の軽症","s":"25歳の女性。粘血便と下痢が続き、内視鏡で、直腸から連続する浅い潰瘍がある。軽症である。寛解導入に使う薬はどれか。","o":["抗菌薬の長期投与","インスリン","利尿薬","鎮咳薬","5-ASA製剤"],"a":4,"e":"軽症の潰瘍性大腸炎は、5-ASA製剤で治療します。","w":["抗菌薬の長期投与は、基本の治療ではありません。","インスリンは、糖尿病の治療薬です。","利尿薬は、腹水や心不全の治療薬です。","鎮咳薬は、咳を抑える薬です。",""],"k":-1,"p":1},{"n":324,"b":"各論","t":"臨床","th":"食道静脈瘤の予防","s":"58歳の男性。肝硬変がある。内視鏡で、出血のリスクが高い食道静脈瘤が見つかった。出血はない。適切な治療はどれか。","o":["食道の全摘手術","抗菌薬の長期投与","鎮咳薬の長期内服","内視鏡的静脈瘤結紮術","高脂肪食の積極摂取"],"a":3,"e":"出血のリスクが高い食道静脈瘤は、内視鏡的静脈瘤結紮術で、出血を予防します。","w":["食道の全摘は、侵襲が大きく、第一選択ではありません。","抗菌薬では、静脈瘤を治療できません。","鎮咳薬は、静脈瘤に効果がありません。","","高脂肪食は、肝臓に負担で、治療ではありません。"],"k":-1,"p":1},{"n":325,"b":"各論","t":"臨床","th":"急性胆嚢炎","s":"50歳の女性。脂肪の多い食事の後に、右上腹部痛と発熱が出た。右季肋部の圧迫で、吸気が止まる。最初に行う検査はどれか。","o":["腹部超音波検査","胸部の単純X線","上部消化管の造影","頭部MRI","骨塩定量検査"],"a":0,"e":"右上腹部痛と発熱で、胆嚢炎を疑うときは、腹部超音波検査を行います。","w":["","胸部X線は、胆嚢の評価に向きません。","上部消化管造影は、胆嚢炎の第一の検査ではありません。","頭部MRIは、腹痛の原因の評価に関係しません。","骨塩定量検査は、骨粗鬆症の評価に用います。"],"k":-1,"p":1},{"n":326,"b":"各論","t":"一般","th":"凝固因子異常の出血部位","s":"凝固因子の異常で、特徴的にみられる出血はどれか。","o":["関節内や筋肉内の深部出血","皮膚の点状出血","皮膚の紫斑","粘膜からの出血","尿路からの出血だけ"],"a":0,"e":"凝固因子の異常では、関節内や筋肉内の深部に出血が出ます。","w":["","点状出血は、血小板の異常でみられます。","紫斑は、血小板の異常でみられます。","粘膜出血は、血小板の異常で出やすい所見です。","尿路だけの出血は、凝固因子の異常に特徴的ではありません。"],"k":-1,"p":1},{"n":327,"b":"各論","t":"一般","th":"ワルファリンと凝固検査","s":"ワルファリンの内服で、先に延長する検査はどれか。","o":["活性化部分トロンボプラスチン時間（APTT）","血小板数","出血時間","プロトロンビン時間（PT）","赤血球数"],"a":3,"e":"ワルファリンやビタミンK欠乏では、PTが先に延びます。","w":["APTTは、PTより遅れて軽度に延びます。","ワルファリンでは、血小板数は変わりません。","出血時間は、血小板の機能を反映します。","","赤血球数は、凝固能の指標ではありません。"],"k":-1,"p":1},{"n":328,"b":"各論","t":"臨床","th":"鉄欠乏性貧血の対応","s":"32歳の女性。過多月経があり、倦怠感と動悸を訴える。Hb 8.0g/dL、MCV 70fLで、血清フェリチンは低値である。最も適切な対応はどれか。","o":["ビタミンB12を筋肉内に注射する","鉄剤を投与し、出血の原因を調べる","ステロイドを投与する","免疫抑制療法を始める","瀉血を行う"],"a":1,"e":"小球性貧血で、フェリチンが低ければ、鉄欠乏性貧血です。鉄剤を投与し、消化管出血や月経などの原因を探します。","w":["ビタミンB12は、大球性貧血の治療です。","","ステロイドは、自己免疫性溶血性貧血の治療です。","免疫抑制療法は、再生不良性貧血の治療です。","瀉血は、真性赤血球増加症の治療です。"],"k":-1,"p":1},{"n":329,"b":"各論","t":"臨床","th":"慢性骨髄性白血病の治療","s":"52歳の男性。健診で白血球増多を指摘された。脾腫があり、Philadelphia染色体（BCR-ABL融合遺伝子）が陽性である。治療薬として適切なのはどれか。","o":["全トランス型レチノイン酸","R-CHOP療法","イマチニブ","デスモプレシン","鉄剤"],"a":2,"e":"BCR-ABL融合遺伝子を持つ慢性骨髄性白血病には、チロシンキナーゼ阻害薬のイマチニブが著効します。","w":["全トランス型レチノイン酸は、急性前骨髄球性白血病の薬です。","R-CHOP療法は、びまん性大細胞型B細胞リンパ腫の治療です。","","デスモプレシンは、中枢性尿崩症の薬です。","鉄剤は、鉄欠乏性貧血の薬です。"],"k":-1,"p":1},{"n":330,"b":"各論","t":"臨床","th":"成人のITPの治療","s":"45歳の女性。皮下に点状出血がある。血小板数は低下し、PTとAPTTは正常で、骨髄の巨核球は正常である。ピロリ菌が陽性である。適切な治療はどれか。","o":["第VIII因子製剤の補充","血漿交換療法","ビタミンK製剤の投与","全トランス型レチノイン酸の投与","ピロリ菌の除菌"],"a":4,"e":"特発性血小板減少性紫斑病では、ピロリ菌が陽性なら除菌を行います。ステロイドも用います。","w":["第VIII因子の補充は、血友病Aの治療です。","血漿交換は、血栓性血小板減少性紫斑病の治療です。","ビタミンK製剤は、PTが延長する病態の治療です。","全トランス型レチノイン酸は、急性前骨髄球性白血病の治療です。",""],"k":-1,"p":1},{"n":331,"b":"各論","t":"臨床","th":"自己免疫性溶血性貧血の治療","s":"40歳の女性。貧血と黄疸がある。間接ビリルビンとLDHが上昇し、ハプトグロビンが低下している。直接Coombs試験が陽性である。初期治療として適切なのはどれか。","o":["ステロイドの投与","ビタミンB12の筋肉内注射","鉄剤の内服","瀉血","全トランス型レチノイン酸の投与"],"a":0,"e":"直接Coombs試験が陽性の自己免疫性溶血性貧血は、ステロイドで治療します。","w":["","ビタミンB12は、悪性貧血の治療です。","鉄剤は、鉄欠乏性貧血の治療です。","瀉血は、真性赤血球増加症の治療です。","全トランス型レチノイン酸は、急性前骨髄球性白血病の治療です。"],"k":-1,"p":1},{"n":332,"b":"各論","t":"臨床","th":"DLBCLの治療","s":"65歳の男性。頸部のリンパ節が急速に腫れた。生検で、びまん性大細胞型B細胞リンパ腫と診断された。治療として適切なのはどれか。","o":["イマチニブの内服","全トランス型レチノイン酸の内服","瀉血","血漿交換療法","R-CHOP療法"],"a":4,"e":"びまん性大細胞型B細胞リンパ腫には、R-CHOP療法を行います。","w":["イマチニブは、慢性骨髄性白血病の薬です。","全トランス型レチノイン酸は、急性前骨髄球性白血病の薬です。","瀉血は、真性赤血球増加症の治療です。","血漿交換は、血栓性血小板減少性紫斑病の治療です。",""],"k":-1,"p":1},{"n":333,"b":"各論","t":"一般","th":"腎前性急性腎障害の原因","s":"急性腎障害のうち、腎前性の原因となるのはどれか。","o":["尿細管壊死","尿路結石による閉塞","糸球体の半月体形成","脱水","前立腺肥大による閉塞"],"a":3,"e":"腎前性は、脱水や心不全による腎血流の低下が原因です。","w":["尿細管壊死は、腎性の原因です。","尿路の閉塞は、腎後性の原因です。","半月体の形成は、腎性の原因です。","","尿路の閉塞は、腎後性の原因です。"],"k":-1,"p":1},{"n":334,"b":"各論","t":"一般","th":"精巣捻転の時間","s":"精巣捻転で、精巣が壊死するまでの時間の目安はどれか。","o":["約1時間","約24時間","約6時間","約3日","約1週間"],"a":2,"e":"発症から約6時間以内に整復できないと、精巣が壊死します。","w":["1時間では、まだ壊死は起こりません。","24時間では、すでに壊死しています。","","3日では、すでに壊死しています。","1週間では、すでに壊死しています。"],"k":-1,"p":1},{"n":335,"b":"各論","t":"一般","th":"更年期の期間","s":"更年期とされる期間はどれか。","o":["閉経後の10年だけ","閉経の前後各5年","満40歳から50歳まで","閉経の1年前から","初経の前後各5年"],"a":1,"e":"更年期は、閉経の前後各5年の期間です。","w":["閉経前の期間も含みます。","","年齢で決める期間ではありません。","閉経の1年前からではありません。","初経は、更年期と関係がありません。"],"k":-1,"p":1},{"n":336,"b":"各論","t":"一般","th":"続発性無月経の定義","s":"続発性無月経の定義はどれか。","o":["満18歳になっても、初経がない","月経周期が、35日以上になる","月経が、1か月だけ止まる","それまであった月経が、3か月以上止まる","閉経後に、月経がない"],"a":3,"e":"それまであった月経が3か月以上止まるものが、続発性無月経です。","w":["これは、原発性無月経の定義です。","周期が長いだけでは、無月経ではありません。","1か月では、無月経とはしません。","","閉経後の状態は、無月経の分類ではありません。"],"k":-1,"p":1},{"n":337,"b":"各論","t":"一般","th":"ネフローゼ症候群の補体","s":"ネフローゼ症候群で、通常は正常な検査値はどれか。","o":["血清アルブミン値","血清補体","1日の尿蛋白量","総コレステロール値","尿中アルブミン排泄量"],"a":1,"e":"ネフローゼ症候群では、血清補体は通常、正常です。低下は、急性腎炎症候群の所見です。","w":["血清アルブミンは、低下します。","","尿蛋白は、大量に出ます。","総コレステロールは、上昇します。","尿中アルブミンは、増加します。"],"k":-1,"p":1},{"n":338,"b":"各論","t":"一般","th":"絨毛性疾患の腫瘍マーカー","s":"絨毛性疾患である胞状奇胎で、著しく高値になるのはどれか。","o":["AFP","CA125","PSA","カルシトニン","hCG"],"a":4,"e":"胞状奇胎では、hCGが著しい高値を示します。","w":["AFPは、精巣腫瘍などで上昇します。","CA125は、子宮内膜症などで上昇します。","PSAは、前立腺癌で上昇します。","カルシトニンは、甲状腺髄様癌で上昇します。",""],"k":-1,"p":1},{"n":339,"b":"各論","t":"臨床","th":"IgA腎症","s":"19歳の男性。上気道炎の翌日に、肉眼的血尿が出た。数日で軽くなったが、血尿と蛋白尿が続く。血清C3は正常である。最も考えられるのはどれか。","o":["溶連菌感染後糸球体腎炎","微小変化型ネフローゼ症候群","IgA腎症","急性腎盂腎炎","膀胱癌"],"a":2,"e":"上気道炎の直後に肉眼的血尿が出て、補体が正常なのはIgA腎症です。","w":["溶連菌感染後は、1から3週間後に発症し、C3が低下します。","微小変化型では、大量の蛋白尿が中心です。","","腎盂腎炎では、発熱と側腹部痛が出ます。","膀胱癌は、痛みのない血尿ですが、若年には少ない疾患です。"],"k":-1,"p":1},{"n":340,"b":"各論","t":"臨床","th":"急性尿細管壊死","s":"62歳の男性。大量出血を伴う手術のあと、血圧が低下し、尿量が減った。輸液をしても改善せず、水腎症もない。最も考えられるのはどれか。","o":["腎性急性腎障害（尿細管壊死）","腎前性急性腎障害（脱水）","腎後性急性腎障害（尿路閉塞）","慢性腎臓病","IgA腎症"],"a":0,"e":"ショックのあと、輸液で改善せず、水腎症がなければ、尿細管壊死による腎性の急性腎障害です。","w":["","輸液で改善すれば、腎前性です。","水腎症があれば、腎後性です。","急性に発症しており、慢性ではありません。","血尿が中心の疾患ではありません。"],"k":-1,"p":1},{"n":341,"b":"各論","t":"臨床","th":"慢性腎臓病の診断","s":"70歳の男性。健診で、eGFRが52mL/分/1.73㎡、尿蛋白が陽性であった。3か月前の検査でも同じ所見であった。診断はどれか。","o":["慢性腎臓病","急性腎障害","急性腎炎症候群","ネフローゼ症候群","腎後性急性腎障害"],"a":0,"e":"腎障害が3か月以上続き、eGFRが60未満なら、慢性腎臓病です。","w":["","3か月以上続いており、急性ではありません。","急性腎炎症候群は、血尿と乏尿が急に出ます。","ネフローゼ症候群は、大量の蛋白尿が中心です。","腎後性は、尿路の閉塞による急性の障害です。"],"k":-1,"p":1},{"n":342,"b":"各論","t":"臨床","th":"精巣腫瘍","s":"26歳の男性。左の陰嚢に、痛みのない硬い腫れがある。AFPとhCGが上昇している。最も考えられるのはどれか。","o":["精巣捻転","精巣腫瘍","精巣上体炎","前立腺癌","腎細胞癌"],"a":1,"e":"若年男性の無痛性の陰嚢の腫れで、AFPとhCGが上がれば、精巣腫瘍です。","w":["精巣捻転は、突然の強い痛みが特徴です。","","精巣上体炎は、痛みと発熱が出ます。","前立腺癌は、高齢男性で、PSAが上がります。","腎細胞癌は、陰嚢の腫れを起こしません。"],"k":-1,"p":1},{"n":343,"b":"各論","t":"臨床","th":"子宮頸癌の検査","s":"38歳の女性。性交のあとに出血があった。子宮頸癌を疑う。最初に行う検査はどれか。","o":["子宮内膜の組織診","血中CA125の測定","子宮頸部の細胞診","血中hCGの測定","尿の蛋白定量"],"a":2,"e":"子宮頸癌は、子宮頸部の細胞診で調べます。","w":["子宮内膜の組織診は、子宮体癌の検査です。","CA125は、子宮内膜症などで上がる値です。","","hCGは、絨毛性疾患の指標です。","尿蛋白は、腎疾患の検査です。"],"k":-1,"p":1},{"n":344,"b":"各論","t":"臨床","th":"多嚢胞性卵巣症候群","s":"27歳の女性。月経不順があり、多毛と肥満がある。血中のLHが高値である。最も考えられるのはどれか。","o":["子宮内膜症","子宮筋腫","胞状奇胎","子宮体癌","多嚢胞性卵巣症候群"],"a":4,"e":"排卵障害、多毛、肥満、LH高値は、多嚢胞性卵巣症候群の特徴です。","w":["子宮内膜症は、月経困難症が中心です。","子宮筋腫は、過多月経と貧血が中心です。","胞状奇胎は、妊娠に伴う不正出血が中心です。","子宮体癌は、閉経後の不正出血が中心です。",""],"k":-1,"p":1},{"n":345,"b":"各論","t":"臨床","th":"原発性無月経","s":"18歳の女性。これまでに、初経がない。この状態として正しいのはどれか。","o":["続発性無月経","更年期障害","生理的な無月経","原発性無月経","多嚢胞性卵巣症候群"],"a":3,"e":"満18歳になっても初経がないものは、原発性無月経です。","w":["続発性は、それまであった月経が止まるものです。","更年期は、閉経の前後の期間です。","生理的な無月経は、妊娠などの状態です。","","多嚢胞性卵巣症候群は、月経不順を起こす疾患です。"],"k":-1,"p":1},{"n":346,"b":"各論","t":"臨床","th":"糖尿病性腎症","s":"62歳の男性。2型
