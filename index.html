ッピングやコイル塞栓","免疫グロブリン静注","レボドパの内服"],"a":2,"e":"破裂した脳動脈瘤には、クリッピングやコイル塞栓で、再出血を予防します。","w":["rt-PA静注療法は、脳梗塞の治療で、出血を増やします。","血漿交換は、Guillain-Barré症候群などの治療です。","","免疫グロブリン静注は、Guillain-Barré症候群の治療です。","レボドパは、Parkinson病の治療です。"],"k":-1,"p":1},{"n":353,"b":"各論","t":"一般","th":"骨折後の確認","s":"骨折のあとに、必ず確認する事項はどれか。","o":["末梢の血流と神経","体温だけ","尿の色だけ","血糖値だけ","体重だけ"],"a":0,"e":"骨折のあとは、必ず末梢の血流と神経を確認します。","w":["","体温だけでは、血管と神経の障害を見逃します。","尿の色だけでは、血管と神経の障害を見逃します。","血糖値だけでは、血管と神経の障害を見逃します。","体重だけでは、血管と神経の障害を見逃します。"],"k":-1,"p":1},{"n":354,"b":"各論","t":"臨床","th":"一過性脳虚血発作の対応","s":"70歳の男性。30分間、右手に力が入らず、言葉が出にくかったが、症状は消えた。診察時は神経学的に異常がない。対応として適切なのはどれか。","o":["症状が消えたため、経過をみる","2か月後に、外来を受診させる","鎮痛薬だけを処方する","安静にして、翌年に検査する","直ちに精査し、脳梗塞を予防する"],"a":4,"e":"一過性脳虚血発作は、脳梗塞の前触れです。直ちに精査して、予防の治療を始めます。","w":["症状が消えても、脳梗塞の危険は高いままです。","2か月後では、脳梗塞の予防が遅れます。","鎮痛薬は、再発の予防になりません。","翌年の検査では、遅すぎます。",""],"k":-1,"p":1},{"n":355,"b":"各論","t":"臨床","th":"多発性硬化症","s":"28歳の女性。数か月前に視力が低下したが、自然に回復した。今回は、下肢のしびれと歩行障害が出た。最も考えられるのはどれか。","o":["Guillain-Barré症候群","重症筋無力症","Parkinson病","多発性硬化症","筋萎縮性側索硬化症"],"a":3,"e":"症状が時間的にも空間的にも多発する中枢神経の脱髄疾患は、多発性硬化症です。","w":["Guillain-Barré症候群は、感染後の急な上行性麻痺です。","重症筋無力症は、日内変動のある易疲労性が中心です。","Parkinson病は、高齢者の振戦と無動が中心です。","","筋萎縮性側索硬化症は、感覚障害を伴いません。"],"k":-1,"p":1},{"n":356,"b":"各論","t":"臨床","th":"Duchenne型筋ジストロフィー","s":"5歳の男児。転びやすく、床から立ち上がるとき、両手を膝について、体を支える。両側のふくらはぎが太い。母方の叔父にも同様の症状がある。最も考えられるのはどれか。","o":["重症筋無力症","Guillain-Barré症候群","多発性硬化症","筋萎縮性側索硬化症","Duchenne型筋ジストロフィー"],"a":4,"e":"Gowers徴候と腓腹筋の仮性肥大があり、男児で、X連鎖潜性遺伝なら、Duchenne型筋ジストロフィーです。","w":["重症筋無力症は、日内変動のある眼瞼下垂が中心です。","Guillain-Barré症候群は、感染後に急に進む麻痺です。","多発性硬化症は、若い成人に多い疾患です。","筋萎縮性側索硬化症は、中高年に多い疾患です。",""],"k":-1,"p":1},{"n":357,"b":"各論","t":"臨床","th":"片頭痛の治療","s":"30歳の女性。片側の拍動性の頭痛を繰り返す。悪心と光過敏を伴う。神経学的な異常はない。発作時の薬として適切なのはどれか。","o":["アシクロビル","レボドパ","トリプタン","ジアゼパムの静注","ビスホスホネート"],"a":2,"e":"片頭痛の発作には、トリプタンを使います。","w":["アシクロビルは、単純ヘルペス脳炎の薬です。","レボドパは、Parkinson病の薬です。","","ジアゼパムの静注は、けいれん重積の治療です。","ビスホスホネートは、骨粗鬆症の薬です。"],"k":-1,"p":1},{"n":358,"b":"各論","t":"臨床","th":"骨粗鬆症の治療","s":"78歳の女性。尻もちをついたあとから、背中が痛む。椎体の骨折があり、骨密度が低い。再骨折を防ぐ薬として適切なのはどれか。","o":["トリプタン","レボドパ","コリンエステラーゼ阻害薬","ビスホスホネート薬","アシクロビル"],"a":3,"e":"骨粗鬆症には、ビスホスホネート薬などを使います。","w":["トリプタンは、片頭痛の薬です。","レボドパは、Parkinson病の薬です。","コリンエステラーゼ阻害薬は、重症筋無力症の薬です。","","アシクロビルは、単純ヘルペス脳炎の薬です。"],"k":-1,"p":1},{"n":359,"b":"各論","t":"臨床","th":"Guillain-Barré症候群の治療","s":"30歳の男性。下痢の2週間後から、両下肢の脱力が上行し、腱反射が消えた。髄液は蛋白細胞解離を示す。治療として適切なのはどれか。","o":["コリンエステラーゼ阻害薬","免疫グロブリン静注","レボドパ","トリプタン","アシクロビル"],"a":1,"e":"Guillain-Barré症候群には、免疫グロブリン静注や血漿交換を行います。","w":["コリンエステラーゼ阻害薬は、重症筋無力症の治療です。","","レボドパは、Parkinson病の薬です。","トリプタンは、片頭痛の薬です。","アシクロビルは、単純ヘルペス脳炎の薬です。"],"k":-1,"p":1},{"n":360,"b":"各論","t":"臨床","th":"重症筋無力症の合併症","s":"34歳の女性。夕方に悪化する眼瞼下垂と複視があり、抗アセチルコリン受容体抗体が陽性で、重症筋無力症と診断した。合併を調べる検査はどれか。","o":["胸部CT","腹部超音波検査","腰椎穿刺","骨密度測定","頭部MRI"],"a":0,"e":"重症筋無力症には、胸腺腫を合併することがあり、胸部CTで調べます。","w":["","腹部の臓器は、合併の中心ではありません。","腰椎穿刺は、Guillain-Barré症候群の髄液検査です。","骨密度は、骨粗鬆症の評価です。","頭部MRIは、中枢神経の病変を調べる検査です。"],"k":-1,"p":1},{"n":361,"b":"各論","t":"臨床","th":"髄膜腫","s":"55歳の女性。数か月前から、頭痛が続く。頭部の検査で、硬膜に付着する、境界が明瞭な腫瘤を認めた。最も考えられるのはどれか。","o":["神経膠芽腫","脳膿瘍","脳出血","くも膜下出血","髄膜腫"],"a":4,"e":"硬膜に付着する境界明瞭な腫瘤で、中年女性に多いのは髄膜腫です。","w":["神経膠芽腫は、悪性で、境界が不明瞭です。","脳膿瘍は、発熱を伴うことが多い疾患です。","脳出血は、突然に発症します。","くも膜下出血は、突然の激しい頭痛です。",""],"k":-1,"p":1},{"n":362,"b":"各論","t":"臨床","th":"心原性脳塞栓症","s":"75歳の女性。心房細動がある。突然、左の片麻痺と半側空間無視が出た。頭部CTで出血はない。脳梗塞の病型として最も考えられるのはどれか。","o":["ラクナ梗塞","心原性脳塞栓症","アテローム血栓性脳梗塞","脳出血","一過性脳虚血発作"],"a":1,"e":"心房細動のある患者の、突然に発症する広範囲の脳梗塞は、心原性脳塞栓症です。","w":["ラクナ梗塞は、小さな梗塞で、症状が軽い病型です。","","アテローム血栓性は、動脈硬化が背景です。","CTで出血がないので、脳出血ではありません。","症状が持続しており、一過性ではありません。"],"k":-1,"p":1},{"n":363,"b":"各論","t":"一般","th":"原発性アルドステロン症の検査","s":"原発性アルドステロン症のスクリーニングに用いる指標はどれか。","o":["アルドステロン/レニン比","血中カルシトニン","血中ACTH","TSH受容体抗体","抗TPO抗体"],"a":0,"e":"原発性アルドステロン症は、アルドステロン/レニン比が高くなります。","w":["","カルシトニンは、甲状腺髄様癌の指標です。","ACTHは、Cushing病などの評価に用います。","TSH受容体抗体は、Basedow病の指標です。","抗TPO抗体は、橋本病の指標です。"],"k":-1,"p":1},{"n":364,"b":"各論","t":"一般","th":"Kussmaul呼吸","s":"糖尿病ケトアシドーシスにみられる、特徴的な呼吸はどれか。","o":["Cheyne-Stokes呼吸","吸気時の笛声","呼吸が止まる睡眠時無呼吸","Kussmaul呼吸","口すぼめ呼吸"],"a":3,"e":"糖尿病ケトアシドーシスでは、アシドーシスを補うため、Kussmaul呼吸がみられます。","w":["Cheyne-Stokes呼吸は、重い心不全や脳の疾患でみられます。","吸気時の笛声は、百日咳の咳発作の特徴です。","睡眠時無呼吸は、糖尿病ケトアシドーシスの所見ではありません。","","口すぼめ呼吸は、COPDでみられます。"],"k":-1,"p":1},{"n":365,"b":"各論","t":"一般","th":"糖尿病診断に必要な血糖値","s":"糖尿病型を別の日の検査でも確認して診断する際、初回検査と再検査の少なくとも一方が必要なのはどれか。","o":["HbA1c","尿ケトン体","血糖値","尿糖","血清インスリン値"],"a":2,"e":"初回検査と再検査の少なくとも一方は、血糖値でなければなりません。","w":["HbA1cだけの確認では、診断できません。","尿ケトン体は、診断基準に含まれません。","","尿糖は、診断基準に含まれません。","インスリン値は、診断基準に含まれません。"],"k":-1,"p":1},{"n":366,"b":"各論","t":"一般","th":"乳腺の良性疾患","s":"乳腺の良性の疾患はどれか。","o":["浸潤性乳管癌","乳頭状癌","髄様癌","線維腺腫","Basedow病"],"a":3,"e":"乳腺の良性疾患には、線維腺腫と乳腺症があります。","w":["浸潤性乳管癌は、乳癌の代表的な組織型です。","乳頭癌は、甲状腺癌で最も多い組織型です。","髄様癌は、甲状腺癌の一型です。","","Basedow病は、甲状腺の疾患です。"],"k":-1,"p":1},{"n":367,"b":"各論","t":"臨床","th":"副甲状腺機能亢進症","s":"55歳の女性。尿路結石を繰り返している。血清カルシウムは高値、リンは低値で、PTHが高値である。最も考えられるのはどれか。","o":["Cushing症候群","Addison病","Basedow病","橋本病","副甲状腺機能亢進症"],"a":4,"e":"高カルシウム血症、低リン血症、PTH高値は、副甲状腺機能亢進症の特徴です。","w":["Cushing症候群は、満月様顔貌と中心性肥満が特徴です。","Addison病は、低ナトリウム、高カリウム、色素沈着が特徴です。","Basedow病は、動悸と体重減少が特徴です。","橋本病は、機能低下が多い甲状腺の疾患です。",""],"k":-1,"p":1},{"n":368,"b":"各論","t":"臨床","th":"線維腺腫","s":"25歳の女性。右の乳房に、可動性のある、境界明瞭な、痛みのないしこりがある。最も考えられるのはどれか。","o":["乳癌","線維腺腫","乳腺炎","亜急性甲状腺炎","先端巨大症"],"a":1,"e":"若い女性の、可動性のある境界明瞭なしこりは、良性の線維腺腫が多いです。","w":["乳癌のしこりは、硬く、可動性が乏しいのが特徴です。","","乳腺炎は、発赤と痛みを伴います。","亜急性甲状腺炎は、甲状腺の疾患です。","先端巨大症は、下垂体の疾患です。"],"k":-1,"p":1},{"n":369,"b":"各論","t":"臨床","th":"クレチン症","s":"生後2週の新生児。マススクリーニングで、TSHが高値で、先天性甲状腺機能低下症を疑う。治療として適切なのはどれか。","o":["抗甲状腺薬の投与","放射性ヨウ素の内服","レボチロキシンの補充","デスモプレシンの投与","カベルゴリンの投与"],"a":2,"e":"先天性甲状腺機能低下症は、早期からレボチロキシンを補充します。","w":["抗甲状腺薬は、甲状腺機能亢進症の薬です。","放射性ヨウ素は、機能亢進症の治療です。","","デスモプレシンは、中枢性尿崩症の薬です。","カベルゴリンは、プロラクチノーマの薬です。"],"k":-1,"p":1},{"n":370,"b":"各論","t":"臨床","th":"糖尿病の診断手順","s":"55歳の男性。健診で、空腹時血糖が130mg/dLであった。HbA1cは6.2%で、同日の検査である。次に行う対応はどれか。","o":["別の日に、再検査する","直ちに糖尿病と診断する","糖尿病ではないと判断する","インスリンを開始する","経過観察を終了する"],"a":0,"e":"糖尿病型が1つだけなら、別の日の検査で、糖尿病型を確認します。","w":["","空腹時血糖だけが糖尿病型では、1回で診断できません。","空腹時血糖が126以上で、糖尿病型を示しています。","再検査をする前の、インスリン開始は不適切です。","糖尿病型があり、経過観察の終了は不適切です。"],"k":-1,"p":1},{"n":371,"b":"各論","t":"臨床","th":"痛風","s":"45歳の男性。夜間に、第1中足趾節関節に、激しい痛みが出た。血清尿酸値は8.5mg/dLである。最も考えられるのはどれか。","o":["偽痛風","関節リウマチ","痛風発作","化膿性関節炎","変形性関節症"],"a":2,"e":"高尿酸血症があり、第1中足趾節関節が激しく痛むのは、痛風発作です。","w":["偽痛風は、膝などの大関節に起こります。","関節リウマチは、手指の小関節の対称性の関節炎です。","","化膿性関節炎は、発熱と強い炎症を伴います。","変形性関節症は、急な激痛を起こしません。"],"k":-1,"p":1},{"n":372,"b":"各論","t":"臨床","th":"急性副腎不全","s":"55歳の女性。Addison病でステロイドを内服中だが、感染症を契機に内服をやめた。嘔吐とショックの状態である。治療として適切なのはどれか。","o":["抗甲状腺薬の投与","ステロイドの静注補充","インスリンの大量投与","α遮断薬の投与","デスモプレシンの投与"],"a":1,"e":"Addison病の急性副腎不全には、ステロイドを補充します。","w":["抗甲状腺薬は、Basedow病の薬です。","","インスリンの大量投与は、低血糖を招きます。","α遮断薬は、褐色細胞腫の術前に使います。","デスモプレシンは、中枢性尿崩症の薬です。"],"k":-1,"p":1},{"n":373,"b":"各論","t":"臨床","th":"肥満症","s":"48歳の男性。BMIは29で、高血圧と2型糖尿病を合併している。診断として正しいのはどれか。","o":["肥満症","単純性肥満","Cushing症候群","低体重","正常体重"],"a":0,"e":"BMI25以上の肥満に、健康障害を合併するものは、肥満症です。","w":["","単純性肥満は、健康障害の合併のない肥満です。","Cushing症候群は、特徴的な顔貌と皮膚線条を伴います。","BMIが高く、低体重ではありません。","BMI25以上は、肥満です。"],"k":-1,"p":1},{"n":374,"b":"各論","t":"臨床","th":"脂質異常症の診断","s":"50歳の男性。空腹時の採血で、LDLコレステロールが150mg/dL、HDLコレステロールが50mg/dL、中性脂肪が100mg/dLであった。診断はどれか。","o":["高尿酸血症","肥満症","糖尿病","脂質異常症","低血糖"],"a":3,"e":"LDLコレステロールが140mg/dL以上なら、脂質異常症です。","w":["高尿酸血症は、尿酸が7.0mg/dLを超えるものです。","肥満症は、BMIで判断します。","糖尿病は、血糖値とHbA1cで判断します。","","低血糖は、血糖値が低い状態です。"],"k":-1,"p":1},{"n":375,"b":"各論","t":"一般","th":"アドレナリンの投与部位","s":"アナフィラキシーで、アドレナリンを筋肉内に注射する部位はどれか。","o":["上腕の後ろ","臀部の中央","腹部の皮下","手背の静脈","大腿の外側"],"a":4,"e":"アドレナリンは、大腿の外側に、筋肉内注射します。","w":["上腕の後ろは、推奨される部位ではありません。","臀部は、推奨される部位ではありません。","皮下ではなく、筋肉内に注射します。","第一選択は、筋肉内注射です。",""],"k":-1,"p":1},{"n":376,"b":"各論","t":"一般","th":"関節リウマチの自己抗体","s":"関節リウマチで、診断への特異性が高い自己抗体はどれか。","o":["抗CCP抗体","抗dsDNA抗体","抗Scl-70抗体","抗SS-A抗体","抗Jo-1抗体"],"a":0,"e":"抗CCP抗体は、関節リウマチの診断への特異性が高い抗体です。","w":["","抗dsDNA抗体は、SLEの抗体です。","抗Scl-70抗体は、全身性強皮症の抗体です。","抗SS-A抗体は、Sjögren症候群の抗体です。","抗Jo-1抗体は、皮膚筋炎・多発筋炎の抗体です。"],"k":-1,"p":1},{"n":377,"b":"各論","t":"臨床","th":"好酸球性多発血管炎性肉芽腫症","s":"45歳の女性。気管支喘息があり、末梢血の好酸球が著しく増加している。手足のしびれも出てきた。最も考えられるのはどれか。","o":["高安動脈炎","巨細胞性動脈炎","好酸球性多発血管炎性肉芽腫症","Behçet病","強直性脊椎炎"],"a":2,"e":"気管支喘息と好酸球増多を伴う小型血管炎は、好酸球性多発血管炎性肉芽腫症です。","w":["高安動脈炎は、若い女性の大型血管炎です。","巨細胞性動脈炎は、高齢者の側頭動脈の痛みが特徴です。","","Behçet病は、口腔内アフタとぶどう膜炎が特徴です。","強直性脊椎炎は、仙腸関節炎が特徴です。"],"k":-1,"p":1},{"n":378,"b":"各論","t":"臨床","th":"HIV感染症の日和見感染","s":"35歳の男性。HIV感染症があり、CD4陽性リンパ球が150/μLである。乾いた咳と、労作時の息切れが出た。最も考えられるのはどれか。","o":["細菌性髄膜炎","ニューモシスチス肺炎","麻しん","インフルエンザ","Guillain-Barré症候群"],"a":1,"e":"CD4陽性リンパ球が200/μL未満では、ニューモシスチス肺炎が出やすくなります。","w":["細菌性髄膜炎は、発熱、頭痛、項部硬直が特徴です。","","麻しんは、発疹とKoplik斑が特徴です。","インフルエンザは、急な発熱が特徴です。","Guillain-Barré症候群は、麻痺の疾患です。"],"k":-1,"p":1},{"n":379,"b":"各論","t":"臨床","th":"重症複合免疫不全症","s":"生後4か月の乳児。重い感染症を繰り返している。T細胞とB細胞の両方に欠陥がある。治療として適切なのはどれか。","o":["抗ヒスタミン薬","ビスホスホネート薬","免疫抑制薬","トリプタン","造血幹細胞移植"],"a":4,"e":"重症複合免疫不全症には、造血幹細胞移植を行います。","w":["抗ヒスタミン薬は、アレルギーの補助薬です。","ビスホスホネート薬は、骨粗鬆症の薬です。","免疫抑制薬は、免疫を弱める薬で、欠陥を治せません。","トリプタンは、片頭痛の薬です。",""],"k":-1,"p":1},{"n":380,"b":"各論","t":"臨床","th":"アナフィラキシーの体位","s":"ハチに刺された30歳の男性。蕁麻疹と喘鳴があり、血圧が低下している。アドレナリンの筋肉内注射とあわせて行う体位はどれか。","o":["座らせて、前かがみにする","うつ伏せにする","頭を高くして、歩かせる","仰向けにして、下肢を挙げる","左側臥位で、膝を曲げる"],"a":3,"e":"アナフィラキシーでは、仰向けにして下肢を挙げ、血圧の低下に備えます。","w":["座位は、血圧が下がるため、避けます。","うつ伏せは、気道の確認ができません。","歩かせてはいけません。","","側臥位は、下肢挙上の姿勢ではありません。"],"k":-1,"p":1},{"n":381,"b":"各論","t":"臨床","th":"強直性脊椎炎","s":"24歳の男性。数か月前から、朝に強い腰背部の痛みとこわばりがあり、運動で軽くなる。仙腸関節炎を認める。関連が深いのはどれか。","o":["HLA-B51","HLA-B27","抗CCP抗体","抗Sm抗体","抗Scl-70抗体"],"a":1,"e":"若い男性の炎症性の腰背部痛と仙腸関節炎は、強直性脊椎炎で、HLA-B27が関連します。","w":["HLA-B51は、Behçet病に関連します。","","抗CCP抗体は、関節リウマチの抗体です。","抗Sm抗体は、SLEの抗体です。","抗Scl-70抗体は、全身性強皮症の抗体です。"],"k":-1,"p":1},{"n":382,"b":"各論","t":"一般","th":"五類全数把握の届出期限","s":"五類感染症の全数把握の届出期限として、原則とされるのはどれか。","o":["7日以内","直ちに","24時間以内","30日以内","3か月以内"],"a":0,"e":"五類の全数把握は、原則として7日以内に届け出ます。","w":["","直ちに届け出るのは、一類から四類などです。","24時間以内は、原則の期限ではありません。","30日では、遅すぎます。","3か月では、遅すぎます。"],"k":-1,"p":1},{"n":383,"b":"各論","t":"一般","th":"活動性結核の標準治療","s":"活動性結核の標準的な治療はどれか。","o":["イソニアジド1剤を6か月","ペニシリン系を10日間","ノイラミニダーゼ阻害薬を5日間","治療せず、経過観察","4剤で2か月、続いて2剤で4か月"],"a":4,"e":"活動性結核は、4剤で2か月、続いて2剤で4か月治療します。","w":["イソニアジド1剤は、潜在性結核感染症の治療です。","ペニシリン系は、A群溶連菌咽頭炎の治療です。","ノイラミニダーゼ阻害薬は、インフルエンザの薬です。","活動性結核は、治療が必要です。",""],"k":-1,"p":1},{"n":384,"b":"各論","t":"一般","th":"流行性耳下腺炎の合併症","s":"流行性耳下腺炎の合併症として、挙げられているのはどれか。","o":["胎児水腫","先天性風しん症候群","難聴、精巣炎、髄膜炎","溶血性尿毒症症候群","リウマチ熱"],"a":2,"e":"流行性耳下腺炎は、難聴、精巣炎、髄膜炎を合併することがあります。","w":["胎児水腫は、伝染性紅斑の妊婦への感染で起こります。","先天性風しん症候群は、妊婦の風しんで起こります。","","溶血性尿毒症症候群は、腸管出血性大腸菌感染症の合併症です。","リウマチ熱は、A群溶血性レンサ球菌の合併症です。"],"k":-1,"p":1},{"n":385,"b":"各論","t":"一般","th":"アスペルギルス症","s":"肺のアスペルギローマの原因となる病原体はどれか。","o":["Cryptococcus","Candida","Mycoplasma","Aspergillus","Rickettsia"],"a":3,"e":"肺のアスペルギローマは、アスペルギルス症の一型です。","w":["Cryptococcusは、鳥の糞に関連し、髄膜炎を起こします。","Candidaは、口腔、食道、血流の感染を起こします。","Mycoplasmaは、細胞壁のない細菌です。","","Rickettsiaは、細胞内に寄生する細菌です。"],"k":-1,"p":1},{"n":386,"b":"各論","t":"臨床","th":"活動性結核の治療","s":"55歳の男性。3週間続く咳と痰、体重減少がある。胸部X線で空洞があり、喀痰の抗酸菌が陽性である。治療として適切なのはどれか。","o":["4剤を併用して治療する","イソニアジド1剤だけで治療する","ペニシリン系を投与する","経過観察とする","ステロイドを投与する"],"a":0,"e":"活動性結核は、4剤を併用し、2か月、続いて2剤で4か月治療します。","w":["","1剤だけでは、耐性菌を生みます。","ペニシリン系は、結核に無効です。","排菌があり、経過観察は不適切です。","ステロイドは、結核の治療薬ではありません。"],"k":-1,"p":1},{"n":387,"b":"各論","t":"臨床","th":"腸管出血性大腸菌の届出","s":"6歳の男児。血性の下痢があり、腸管出血性大腸菌感染症と診断した。診断した医師の対応として適切なのはどれか。","o":["7日以内に届け出る","届出は不要である","1か月後にまとめて届け出る","直ちに保健所へ届け出る","患者の家族だけに報告する"],"a":3,"e":"腸管出血性大腸菌感染症は三類感染症で、診断後、直ちに届け出ます。","w":["7日以内は、五類の全数把握の期限です。","三類感染症は、届出が必要です。","1か月後では、遅すぎます。","","保健所への届出が必要です。"],"k":-1,"p":1},{"n":388,"b":"各論","t":"臨床","th":"MRSA感染症の治療","s":"70歳の男性。入院中に、MRSAによる敗血症を起こした。治療薬として適切なのはどれか。","o":["ペニシリン系","アジスロマイシン","アシクロビル","イマチニブ","バンコマイシン"],"a":4,"e":"MRSA感染症には、バンコマイシンなどを使います。","w":["MRSAは、ペニシリン系に耐性です。","アジスロマイシンは、MRSAの第一選択ではありません。","アシクロビルは、ヘルペスウイルスの薬です。","イマチニブは、慢性骨髄性白血病の薬です。",""],"k":-1,"p":1},{"n":389,"b":"各論","t":"臨床","th":"マイコプラズマ肺炎","s":"20歳の男性。乾いた咳と発熱が続く。ペニシリン系の抗菌薬を数日使ったが、改善しない。細胞壁のない病原体を疑う。次に選ぶ薬はどれか。","o":["セファロスポリン系抗菌薬","マクロライド系抗菌薬","アシクロビル","抗真菌薬","ノイラミニダーゼ阻害薬"],"a":1,"e":"マイコプラズマは、β-ラクタム薬が効かず、マクロライド系やテトラサイクリン系を使います。","w":["セファロスポリンも、β-ラクタム薬で無効です。","","アシクロビルは、ヘルペスウイルスの薬です。","マイコプラズマは、真菌ではなく細菌です。","ノイラミニダーゼ阻害薬は、インフルエンザの薬です。"],"k":-1,"p":1},{"n":390,"b":"各論","t":"臨床","th":"非結核性抗酸菌症の対応","s":"62歳の女性。慢性の咳があり、喀痰から、肺MAC症が確認された。周囲への感染対策として正しいのはどれか。","o":["空気感染のため、陰圧の個室で隔離する","家族全員に、予防内服を行う","人から人へは感染しないため、隔離は不要である","接触した人の、全数の届出を行う","患者の使った食器を、すべて廃棄する"],"a":2,"e":"非結核性抗酸菌症は、人から人へは感染しません。","w":["結核と違い、空気感染しません。","接触者への予防内服は、必要ありません。","","接触者の届出は、必要ありません。","食器の廃棄は、必要ありません。"],"k":-1,"p":1},{"n":391,"b":"各論","t":"臨床","th":"破傷風の予防","s":"30歳の男性。農作業中に、土のついた傷を負った。破傷風を予防する対応として適切なのはどれか。","o":["傷を放置し、様子をみる","ステロイドを投与する","解熱薬だけを投与する","抗真菌薬を投与する","破傷風トキソイドを接種する"],"a":4,"e":"破傷風は、トキソイドで予防します。","w":["放置すると、破傷風を発症する危険があります。","ステロイドは、予防の効果がありません。","解熱薬は、予防の効果がありません。","破傷風は、真菌ではなく細菌の感染症です。",""],"k":-1,"p":1},{"n":392,"b":"各論","t":"臨床","th":"伝染性紅斑と妊婦","s":"妊娠20週の28歳の女性。上の子が、頬の紅斑を伴う伝染性紅斑（リンゴ病）にかかった。胎児に起こりうる合併症はどれか。","o":["胎児水腫","先天性風しん症候群","難聴","精巣炎","髄膜炎"],"a":0,"e":"伝染性紅斑は、妊婦への感染で、胎児水腫を起こすことがあります。","w":["","先天性風しん症候群は、風しんウイルスによって起こります。","難聴は、流行性耳下腺炎などの合併症です。","精巣炎は、流行性耳下腺炎の合併症です。","髄膜炎は、流行性耳下腺炎などの合併症です。"],"k":-1,"p":1},{"n":393,"b":"各論","t":"臨床","th":"百日咳の治療","s":"3歳の男児。連続する咳発作があり、吸気時に笛のような声が出る。百日咳と診断した。治療として適切なのはどれか。","o":["ペニシリン系抗菌薬を10日間","ノイラミニダーゼ阻害薬","マクロライド系抗菌薬","抗ヘルペスウイルス薬","イマチニブ"],"a":2,"e":"百日咳は、マクロライド系で治療します。五類の全数把握です。","w":["ペニシリン系10日間は、A群溶連菌咽頭炎の治療です。","ノイラミニダーゼ阻害薬は、インフルエンザの薬です。","","抗ヘルペスウイルス薬は、ヘルペスウイルスの薬です。","イマチニブは、慢性骨髄性白血病の薬です。"],"k":-1,"p":1},{"n":394,"b":"各論","t":"一般","th":"腸炎ビブリオ","s":"腸炎ビブリオによる食中毒の原因として、代表的なのはどれか。","o":["チャーハンなどの米飯","夏の海産魚介類","握り飯などの手作りの食品","大量に調理した煮込み料理","蜂蜜"],"a":1,"e":"腸炎ビブリオは、夏の海産魚介類が原因で、潜伏期間は12時間前後です。","w":["米飯は、セレウス菌の原因です。","","握り飯は、黄色ブドウ球菌の原因です。","煮込み料理は、ウェルシュ菌の原因です。","蜂蜜は、乳児ボツリヌス症の原因です。"],"k":-1,"p":1},{"n":395,"b":"各論","t":"一般","th":"ヘパリンの拮抗薬","s":"ヘパリンの過量に用いる拮抗薬はどれか。","o":["ビタミンK","ナロキソン","フルマゼニル","プロタミン","アセチルシステイン"],"a":3,"e":"ヘパリンには、プロタミンを使います。APTTが延長します。","w":["ビタミンKは、ワルファリンの拮抗薬です。","ナロキソンは、オピオイドの拮抗薬です。","フルマゼニルは、ベンゾジアゼピン系薬の拮抗薬です。","","アセチルシステインは、アセトアミノフェン中毒の解毒薬です。"],"k":-1,"p":1},{"n":396,"b":"各論","t":"臨床","th":"熱中症Ⅲ度","s":"夏の工事現場で倒れた45歳の男性。搬送後、肝機能と腎機能の障害があり、DICを合併している。深部体温は39.5℃である。熱中症の重症度はどれか。","o":["Ⅰ度","Ⅲ度","Ⅱ度","Ⅳ度","重症度は決められない"],"a":1,"e":"臓器障害を伴い、Ⅳ度に該当しないものは、Ⅲ度です。","w":["Ⅰ度は、意識障害のない軽症です。","","Ⅱ度は、臓器障害を伴いません。","Ⅳ度は、深部体温40℃以上で、中等度以上の意識障害を伴います。","所見から、Ⅲ度と判定できます。"],"k":-1,"p":1},{"n":397,"b":"各論","t":"臨床","th":"月80時間を超える時間外労働","s":"45歳の男性会社員。時間外・休日労働が月に90時間で、疲労の蓄積を自覚している。本人が申し出たときに、事業者が行う対応はどれか。","o":["医師による面接指導","労働時間の延長","手当の増額","就業規則の変更","自宅での経過観察"],"a":0,"e":"月80時間を超え、疲労の蓄積がある労働者が申し出れば、医師の面接指導を行います。","w":["","労働時間を延ばすと、負担が増えます。","手当の増額は、健康管理の対応ではありません。","就業規則の変更は、面接指導ではありません。","自宅での経過観察は、事業者の対応ではありません。"],"k":-1,"p":1},{"n":398,"b":"各論","t":"臨床","th":"セレウス菌食中毒","s":"24歳の男性。チャーハンを食べた3時間後に、激しい嘔吐が出た。発熱は軽く、下痢はほとんどない。原因として最も考えられるのはどれか。","o":["腸炎ビブリオ","サルモネラ","セレウス菌","腸管出血性大腸菌","ノロウイルス"],"a":2,"e":"潜伏期間が短く、米飯が原因の嘔吐は、セレウス菌の嘔吐型です。","w":["腸炎ビブリオは、夏の海産魚介類が原因です。","サルモネラは、卵や鶏肉が原因で、発熱を伴います。","","腸管出血性大腸菌は、血便が特徴です。","ノロウイルスは、冬に二枚貝などが原因です。"],"k":-1,"p":1},{"n":399,"b":"各論","t":"臨床","th":"ベンゼン曝露","s":"50歳の男性。化学工場で、有機溶剤を長年扱っていた。汎血球減少があり、骨髄は低形成である。原因物質として最も考えられるのはどれか。","o":["塩化ビニル","アスベスト","鉛","シリカ","ベンゼン"],"a":4,"e":"ベンゼンは、白血病や再生不良性貧血の原因です。","w":["塩化ビニルは、肝血管肉腫の原因です。","アスベストは、悪性胸膜中皮腫や肺癌の原因です。","鉛は、貧血や腹痛、末梢神経障害の原因です。","シリカは、じん肺の原因です。",""],"k":-1,"p":1},{"n":400,"b":"各論","t":"臨床","th":"じん肺の合併症","s":"60歳の男性。トンネル工事で、粉じんに長年曝露した。珪肺と診断された。合併しやすい感染症はどれか。","o":["麻しん","風しん","水痘","結核","百日咳"],"a":3,"e":"珪肺などのじん肺は、結核を合併しやすい疾患です。","w":["麻しんは、じん肺との関連がありません。","風しんは、じん肺との関連がありません。","水痘は、じん肺との関連がありません。","","百日咳は、じん肺との関連がありません。"],"k":-1,"p":1}];

 app.innerHTML='<div class="wrap"><h1>医師国家試験　シミュレーター</h1><p class="sub">400問。必修100問、医学総論150問、医学各論150問。画像の問題はありません。</p>'+
 (has?'<div class="card"><b>途中の試験があります</b><p class="sub">'+Object.keys(S.ans).length+' / '+S.ids.length+'問に回答済み</p><div class="row"><button class="pri" id="resume">続きから始める</button><button id="drop">破棄する</button></div></div>':'')+
 '<div class="card"><h2 style="margin-top:0">モード</h2><div class="seg" id="mode"><label><input type="radio" name="m" value="test" checked>試験モード（解説は最後）</label><label><input type="radio" name="m" value="study">練習モード（1問ごとに解説）</label></div>'+
 '<h2>出題範囲</h2><div class="seg" id="sec"><label><input type="radio" name="s" value="all" checked>全問 400</label><label><input type="radio" name="s" value="必修">必修 100</label><label><input type="radio" name="s" value="総論">医学総論 150</label><label><input type="radio" name="s" value="各論">医学各論 150</label></div>'+
 '<h2>順序</h2><div class="seg" id="ord"><label><input type="radio" name="o" value="seq" checked>番号順</label><label><input type="radio" name="o" value="rand">ランダム</label></div>'+
 '<div class="row" style="margin-top:18px"><button class="pri" id="go">始める</button><button id="key">解答と解説を見る</button></div></div>'+
 '<div class="card"><b>合格の目安</b><p class="sub" style="margin:6px 0 0">必修は、一般問題1点、臨床実地問題3点で、200点満点中160点以上。禁忌肢は3つ以下。必修を除く問題は300点満点で、近年の合格点は約70から75%です。</p></div></div>';
 if(has){$("resume").onclick=()=>test();$("drop").onclick=()=>{S={mode:"test",sec:"all",order:"seq",ids:[],ans:{},flag:{},i:0,t0:0,sec_t:0,done:false,started:false};save();home()}}
 $("go").onclick=()=>{const g=n=>document.querySelector('input[name="'+n+'"]:checked').value;S.mode=g("m");S.sec=g("s");S.order=g("o");
  let ids=Q.filter(q=>S.sec==="all"||q.b===S.sec).map(q=>q.n-1);if(S.order==="rand")ids=shuffle(ids);
  S.ids=ids;S.ans={};S.flag={};S.i=0;S.t0=Date.now();S.sec_t=0;S.done=false;S.started=true;save();test()};
 $("key").onclick=()=>review(Q.map(q=>q.n-1),null,true);
}
function elapsed(){return Math.floor((Date.now()-S.t0)/1000)+S.sec_t}
let timer=null;
function test(){
 if(!S.t0)S.t0=Date.now();clearInterval(timer);
 const q=Q[S.ids[S.i]];const a=S.ans[q.n];const showFb=S.mode==="study"&&a!==undefined;
 let opts="";q.o.forEach((o,j)=>{let c="opt";if(showFb){if(j===q.a)c+=" right";else if(j===a)c+=" wrong"}else if(a===j)c+=" sel";
  opts+='<button class="'+c+'" data-j="'+j+'"'+(showFb?" disabled":"")+'><b>'+LET[j]+'</b><span>'+o+'</span></button>'+(showFb&&q.w[j]?'<div class="why">'+q.w[j]+(q.k===j?'<span class="kinshi">禁忌肢</span>':'')+'</div>':'')});
 const answered=Object.keys(S.ans).length;
 app.innerHTML='<div class="top"><div class="wrap"><b id="pos">'+(S.i+1)+' / '+S.ids.length+'</b><div class="bar"><i style="width:'+(answered/S.ids.length*100)+'%"></i></div><span id="clk" class="sub" style="margin:0"></span><button id="fin">終了</button></div></div>'+
 '<div class="wrap"><div class="card"><div><span class="tag">'+q.b+'</span><span class="tag">'+q.t+'</span><span class="sub">問'+q.n+'</span></div><div class="stem">'+q.s+'</div>'+opts+
 (showFb?'<div class="exp"><b>'+(a===q.a?"正解です。":"正解は "+LET[q.a]+" です。")+'</b><br>'+q.e+'</div>':'')+
 '<div class="nav"><button id="prev"'+(S.i===0?" disabled":"")+'>前へ</button><button id="flg">'+(S.flag[q.n]?"見直しを外す":"見直しにする")+'</button><button id="next" class="pri"'+(S.i===S.ids.length-1?" disabled":"")+'>次へ</button></div></div>'+
 '<div class="card"><b>問題一覧</b><div class="grid" id="grid"></div></div></div>';
 const g=$("grid");S.ids.forEach((id,k)=>{const n=Q[id].n;const b=document.createElement("button");b.textContent=k+1;let c="";if(S.ans[n]!==undefined)c+=" ans";if(S.flag[n])c+=" flg";if(k===S.i)c+=" cur";b.className=c.trim();b.onclick=()=>{S.i=k;save();test()};g.appendChild(b)});
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ans[q.n]=+b.dataset.j;save();test()});
 $("prev").onclick=()=>{S.i--;save();test()};$("next").onclick=()=>{S.i++;save();test()};
 $("flg").onclick=()=>{if(S.flag[q.n])delete S.flag[q.n];else S.flag[q.n]=1;save();test()};
 $("fin").onclick=()=>confirmFin();
 const tick=()=>{const c=$("clk");if(c)c.textContent=fmt(elapsed())};tick();timer=setInterval(tick,1000);
}
function confirmFin(){
 const un=S.ids.length-Object.keys(S.ans).length;const fl=Object.keys(S.flag).length;
 const d=document.createElement("div");d.className="card flag";d.innerHTML='<b>試験を終了しますか。</b><p class="sub" style="margin:6px 0">未回答 '+un+'問、見直し '+fl+'問</p><div class="row"><button class="pri" id="y">終了して採点する</button><button id="n">続ける</button></div>';
 const w=document.querySelector(".wrap:last-child");w.insertBefore(d,w.firstChild);d.scrollIntoView({block:"center"});
 $("y").onclick=()=>{S.done=true;S.sec_t=elapsed();clearInterval(timer);save();results()};$("n").onclick=()=>d.remove();
}
function results(){
 clearInterval(timer);const ids=S.ids.map(i=>Q[i]);
 const g=(f)=>{const a=ids.filter(f);return{n:a.length,c:a.filter(q=>S.ans[q.n]===q.a).length,pt:a.reduce((s,q)=>s+q.p,0),sc:a.filter(q=>S.ans[q.n]===q.a).reduce((s,q)=>s+q.p,0)}};
 const hi=g(q=>q.b==="必修"),so=g(q=>q.b!=="必修"),all=g(()=>true);
 const kin=ids.filter(q=>q.k>=0&&S.ans[q.n]===q.k);const full=S.sec==="all";
 let h='<div class="wrap"><h1>結果</h1><p class="sub">所要時間 '+fmt(S.sec_t)+'</p><div class="card"><div class="big">'+all.c+' / '+all.n+'</div><p class="sub" style="margin:4px 0 0">正答 '+Math.round(all.c/all.n*100)+'%（問題数ベース）</p></div>';
 h+='<div class="card"><table><tr><th>区分</th><th>得点</th><th>目安</th></tr>';
 if(hi.n){const rate=hi.sc/hi.pt;h+='<tr><td>必修（一般1点、臨床実地3点）</td><td><b class="'+(rate>=0.8?"pass":"fail")+'">'+hi.sc+' / '+hi.pt+'</b></td><td>'+(hi.n===100?"160点以上（80%）":"80%以上")+'</td></tr>'}
 if(so.n){const rate=so.c/so.n;h+='<tr><td>必修を除く（各1点）</td><td><b class="'+(rate>=0.72?"pass":"fail")+'">'+so.c+' / '+so.n+'</b>（'+Math.round(rate*100)+'%）</td><td>約70から75%</td></tr>'}
 h+='<tr><td>禁忌肢</td><td><b class="'+(kin.length<=3?"pass":"fail")+'">'+kin.length+'</b></td><td>3つ以下</td></tr></table>';
 if(!full)h+='<p class="sub">一部の範囲だけを解いたため、得点は、その範囲の目安です。</p>';
 h+='</div><div class="row"><button class="pri" id="rv">すべて見直す</button><button id="rw">間違いだけ見直す</button><button id="hm">最初の画面へ</button></div>';
 h+='<div class="card"><b>問題ごとの結果</b><div class="grid" id="rg"></div></div></div>';
 app.innerHTML=h;
 const rg=$("rg");S.ids.forEach((id,k)=>{const q=Q[id];const b=document.createElement("button");b.textContent=k+1;b.className=S.ans[q.n]===undefined?"":S.ans[q.n]===q.a?"r":"w";b.onclick=()=>review(S.ids,k);rg.appendChild(b)});
 $("rv").onclick=()=>review(S.ids,0);$("rw").onclick=()=>review(S.ids.filter(i=>S.ans[Q[i].n]!==Q[i].a),0);
 $("hm").onclick=()=>{S={mode:"test",sec:"all",order:"seq",ids:[],ans:{},flag:{},i:0,t0:0,sec_t:0,done:false,started:false};save();home()};
}
function review(ids,start,keyMode){
 let k=start||0;if(!ids.length){app.innerHTML='<div class="wrap"><div class="card">間違えた問題はありません。</div><button id="b">戻る</button></div>';$("b").onclick=()=>S.done?results():home();return}
 const draw=()=>{const q=Q[ids[k]];const a=keyMode?undefined:S.ans[q.n];
  let o="";q.o.forEach((t,j)=>{let c="opt";if(j===q.a)c+=" right";else if(j===a)c+=" wrong";o+='<div class="'+c+'"><b>'+LET[j]+'</b><span>'+t+'</span></div>'+(q.w[j]?'<div class="why">'+q.w[j]+(q.k===j?'<span class="kinshi">禁忌肢</span>':'')+'</div>':'')});
  app.innerHTML='<div class="top"><div class="wrap"><b>'+(k+1)+' / '+ids.length+'</b><span class="sub" style="margin:0">'+(keyMode?"解答集":a===undefined?"未回答":a===q.a?"正解":"不正解")+'</span><div class="bar"></div><button id="bk">戻る</button></div></div>'+
  '<div class="wrap"><div class="card"><div><span class="tag">'+q.b+'</span><span class="tag">'+q.t+'</span><span class="sub">問'+q.n+'</span></div><div class="stem">'+q.s+'</div>'+o+'<div class="exp"><b>正解は '+LET[q.a]+' です。</b><br>'+q.e+'</div><div class="nav"><button id="p"'+(k===0?" disabled":"")+'>前へ</button><button id="x" class="pri"'+(k===ids.length-1?" disabled":"")+'>次へ</button></div></div></div>';
  $("p").onclick=()=>{k--;draw();scrollTo(0,0)};$("x").onclick=()=>{k++;draw();scrollTo(0,0)};$("bk").onclick=()=>S.done?results():home()};
 draw();
}
if(S.started&&S.done)results();else home();
</script></body></html>
